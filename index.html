    <script type="module" crossorigin>(function(){const e=document.createElement("link").relList;if(e&&e.supports&&e.supports("modulepreload"))return;for(const s of document.querySelectorAll('link[rel="modulepreload"]'))n(s);new MutationObserver(s=>{for(const r of s)if(r.type==="childList")for(const i of r.addedNodes)i.tagName==="LINK"&&i.rel==="modulepreload"&&n(i)}).observe(document,{childList:!0,subtree:!0});function a(s){const r={};return s.integrity&&(r.integrity=s.integrity),s.referrerPolicy&&(r.referrerPolicy=s.referrerPolicy),s.crossOrigin==="use-credentials"?r.credentials="include":s.crossOrigin==="anonymous"?r.credentials="omit":r.credentials="same-origin",r}function n(s){if(s.ep)return;s.ep=!0;const r=a(s);fetch(s.href,r)}})();const O="Flavia Destefanio",Ae="Audio can be replayed once; transcript available as an accommodation.",Nn="Audio can be replayed once; transcript available as an accommodation (it changes what is measured, so note it in the session conditions).",Re="Plain text, screen-reader friendly; extra time is an allowed accommodation.",Qe="For learners with dyslexia, the teacher may accept a close spelling on review.",Ho=[{id:"EN-VO-PA1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"numbers",band:0,difficulty:-1,objectiveId:"en.pa1.vocab-everyday",topic:"Numbers 1-10",format:"match",prompt:"Match each word to the number.",pairs:[["two","2"],["four","4"],["seven","7"],["ten","10"]],feedback:"Each number word matches exactly one digit; these are the first numbers learners meet.",seconds:30,status:"approved",author:O,createdAt:"2025-08-04"},{id:"EN-VO-PA1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"animals",band:0,difficulty:0,objectiveId:"en.pa1.vocab-everyday",topic:"Animals",format:"mcq",prompt:"My pet says 'meow'. It's a ___.",options:["dog","cat","bird","fish"],correct:1,feedback:"A cat says 'meow'; the other animals make different sounds (or none).",seconds:20,status:"approved",author:O,createdAt:"2025-08-04"},{id:"EN-VO-A1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"family words",band:1,difficulty:-1,objectiveId:"en.a1.vocab-routine",topic:"Family",format:"mcq",prompt:"My mother's brother is my ___.",options:["cousin","grandfather","nephew","uncle"],correct:3,feedback:"Your mother's or father's brother is your uncle; his children are your cousins.",seconds:20,status:"approved",author:O,createdAt:"2025-08-05"},{id:"EN-VO-A1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"word meaning",band:1,difficulty:0,objectiveId:"en.a1.vocab-routine",topic:"Food, home and school",format:"match",prompt:"Match each word to its meaning.",pairs:[["breakfast","the first meal of the day"],["kitchen","the room where you cook"],["bakery","a shop where you buy bread"],["timetable","a list of your classes and their times"]],feedback:"Each word is a high-frequency A1 noun and each definition fits only one of them.",seconds:40,status:"approved",author:O,createdAt:"2025-08-05"},{id:"EN-VO-A1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"daily routine verbs",band:1,difficulty:1,objectiveId:"en.a1.vocab-routine",topic:"Daily routine",format:"gap",prompt:"Complete with one word: On Saturdays I ___ up late, at about ten o'clock.",accept:["get","wake"],feedback:"'Get up' and 'wake up' are the routine verbs for starting your day.",seconds:30,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-06"},{id:"EN-VO-A2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"past time expressions",band:2,difficulty:0,objectiveId:"en.a2.time-expressions",topic:"Time expressions",format:"mcq",prompt:"I visited my grandparents in Florianópolis two weeks ___.",options:["ago","before","past","last"],correct:0,feedback:"'Ago' comes after a period of time to show how far back something happened ('two weeks ago'), not 'before' as in Portuguese 'atrás'.",seconds:25,status:"approved",author:O,createdAt:"2025-08-07"},{id:"EN-VO-A2-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"past time expressions",band:2,difficulty:-1,objectiveId:"en.a2.time-expressions",topic:"Time expressions",format:"gap",prompt:"Complete with one word: I didn't sleep well ___ night, so I'm really tired this morning.",accept:["last"],feedback:"English says 'last night', not 'yesterday night' (a direct translation of 'ontem à noite').",seconds:30,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-07"},{id:"EN-VO-A2-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"travel words",band:2,difficulty:0,objectiveId:"en.a2.vocab-travel",topic:"Travel",format:"match",prompt:"Match each travel word to its meaning.",pairs:[["boarding pass","the document you show to get on a plane"],["platform","the place where you wait for a train"],["receipt","a piece of paper that shows what you paid"],["luggage","the bags and suitcases you take on a trip"]],feedback:"Each travel noun has one clear everyday meaning that matches only one definition.",seconds:40,status:"approved",author:O,createdAt:"2025-08-08"},{id:"EN-VO-A2-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"shopping verbs (false friends)",band:2,difficulty:1,objectiveId:"en.a2.vocab-travel",topic:"Shopping",format:"mcq",prompt:"These jeans are too small. Can I ___ them on in a bigger size?",options:["prove","test","try","check"],correct:2,feedback:"You 'try on' clothes to see if they fit; 'prove' is a false friend of Portuguese 'provar'.",seconds:25,status:"approved",author:O,createdAt:"2025-08-08"},{id:"EN-VO-B1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"make/do/have collocations",band:3,difficulty:-1,objectiveId:"en.b1.collocations",topic:"Collocations: events",format:"mcq",prompt:"We're going to ___ a party for Lucas's birthday on Friday. Can you come?",options:["make","do","have","take"],correct:2,feedback:"In English you 'have' (or 'throw') a party; 'make a party' is a direct translation of 'fazer uma festa'.",seconds:25,status:"approved",author:O,createdAt:"2025-08-11"},{id:"EN-VO-B1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"verb + noun collocations",band:3,difficulty:0,objectiveId:"en.b1.collocations",topic:"make / do / take / have",format:"match",prompt:"Match each verb to the words it goes with.",pairs:[["make","a mistake"],["do","the washing-up"],["take","a photo"],["have","a good time"]],feedback:"These are fixed collocations: make a mistake, do the washing-up, take a photo, have a good time.",seconds:35,status:"approved",author:O,createdAt:"2025-08-11"},{id:"EN-VO-B1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"do collocations",band:3,difficulty:1,objectiveId:"en.b1.collocations",topic:"make / do",format:"gap",prompt:"Complete with one word: Could you ___ me a favour and feed my cat while I'm away?",accept:["do"],feedback:"The fixed expression is 'do someone a favour'; 'make me a favour' comes from Portuguese 'fazer um favor'.",seconds:30,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-12"},{id:"EN-VO-B1-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"adjective + noun collocations",band:3,difficulty:0,objectiveId:"en.b1.collocations",topic:"Collocations: city life",format:"mcq",prompt:"There was really ___ traffic on the way here, so I arrived twenty minutes late.",options:["heavy","strong","big","tall"],correct:0,feedback:"Traffic is 'heavy' in English; 'strong' and 'big' do not collocate with 'traffic'.",seconds:25,status:"approved",author:O,createdAt:"2025-08-12"},{id:"EN-VO-B2-01",version:1,lang:"en",ageGroups:["adult"],skill:"vocabulary",subskill:"phrasal verbs",band:4,difficulty:0,objectiveId:"en.b2.vocab-precision",topic:"Phrasal verbs: work",format:"mcq",prompt:"The meeting has been ___ until next Thursday because the director is ill.",options:["put out","put off","put up","put away"],correct:1,feedback:"'Put off' means postpone; 'put out' means extinguish, 'put up' means raise or host, and 'put away' means store.",seconds:25,status:"approved",author:O,createdAt:"2025-08-13"},{id:"EN-VO-B2-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"phrasal verbs",band:4,difficulty:1,objectiveId:"en.b2.vocab-precision",topic:"Phrasal verbs: everyday problems",format:"gap",prompt:"Complete with one word: I can't ___ up with this noise any longer — I'm going to talk to the neighbours.",accept:["put"],feedback:"'Put up with' means tolerate something unpleasant.",seconds:30,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-13"},{id:"EN-VO-B2-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"false friends",band:4,difficulty:-1,objectiveId:"en.b2.vocab-precision",topic:"Personality adjectives",format:"mcq",prompt:"Be careful what you say to Ana about her exam results — she's very ___ about them.",options:["sensible","sentimental","sensational","sensitive"],correct:3,feedback:"'Sensitive' means easily upset; 'sensible' (a false friend of 'sensível') means practical and reasonable.",seconds:25,status:"approved",author:O,createdAt:"2025-08-14"},{id:"EN-VO-B2-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"phrasal verbs",band:4,difficulty:0,objectiveId:"en.b2.vocab-precision",topic:"Phrasal verbs: meaning",format:"match",prompt:"Match each phrasal verb to its meaning.",pairs:[["turn down","refuse an offer or invitation"],["run out of","have none left"],["come up with","think of an idea or plan"],["look into","investigate a problem"]],feedback:"Each phrasal verb has one core meaning here, and the definitions do not overlap.",seconds:40,status:"approved",author:O,createdAt:"2025-08-14"},{id:"EN-VO-C1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"register",band:5,difficulty:0,objectiveId:"en.c1.vocab-nuance",topic:"Formal and informal register",format:"match",prompt:"Match each informal expression to a more formal word with the same meaning.",pairs:[["find out","ascertain"],["go up","increase"],["ask for","request"],["get in touch with","contact"]],feedback:"Formal writing often replaces multi-word verbs with single Latin-based verbs of the same meaning.",seconds:40,status:"approved",author:O,createdAt:"2025-08-15"},{id:"EN-VO-C1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"idiom",band:5,difficulty:0,objectiveId:"en.c1.vocab-nuance",topic:"Idioms: communication",format:"mcq",prompt:"Instead of telling us directly that the project had been cancelled, Marcos kept ___ for ten minutes.",options:["breaking the ice","beating around the bush","hitting the nail on the head","pulling our leg"],correct:1,feedback:"'Beat around the bush' means avoid saying something directly, which contrasts with 'telling us directly'.",seconds:30,status:"approved",author:O,createdAt:"2025-08-15"},{id:"EN-VO-C1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"vocabulary",subskill:"word formation",band:5,difficulty:1,objectiveId:"en.c1.vocab-nuance",topic:"Word formation: abstract nouns",format:"gap",prompt:"Complete with the correct form of the word in capitals: The ___ (LIKELY) of reaching an agreement before Friday now seems remote.",accept:["likelihood","likeliness"],feedback:"'Likelihood' is the noun meaning probability, and 'remote likelihood' is a natural collocation.",seconds:35,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-15"},{id:"EN-GR-PA1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"be for age",band:0,difficulty:-1,objectiveId:"en.pa1.be-have",topic:"Verb be",format:"mcq",prompt:"My brother ___ twelve years old.",options:["has","is","have","are"],correct:1,feedback:"English uses 'be' for age ('he is twelve'); 'he has twelve years' is a translation from Portuguese.",seconds:20,status:"approved",author:O,createdAt:"2025-08-18"},{id:"EN-GR-PA1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"have got (he/she)",band:0,difficulty:0,objectiveId:"en.pa1.be-have",topic:"Have got",format:"gap",prompt:"Complete with one word: Ana ___ got two cats and a dog.",accept:["has"],feedback:"With he, she or it, 'have got' becomes 'has got'.",seconds:25,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-18"},{id:"EN-GR-A1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"third person -s",band:1,difficulty:-1,objectiveId:"en.a1.present-simple",topic:"Present Simple",format:"error",prompt:"One part of this sentence has a mistake. Choose the part with the mistake.",options:["My brother lives","in Recife and","work","in a bank."],correct:2,correction:"works",feedback:"With he, she or it the Present Simple verb takes -s, so both verbs need it: 'lives … and works'.",seconds:30,status:"approved",author:O,createdAt:"2025-08-19"},{id:"EN-GR-A1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"there is / there are",band:1,difficulty:0,objectiveId:"en.a1.there-is",topic:"There is / there are",format:"mcq",prompt:"___ two parks and a big library near my house.",options:["Have","There is","It has","There are"],correct:3,feedback:"'There are' introduces plural nouns; 'Have …' and 'It has …' translate Portuguese 'Tem …'.",seconds:25,status:"approved",author:O,createdAt:"2025-08-19"},{id:"EN-GR-A1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"can questions",band:1,difficulty:1,objectiveId:"en.a1.can-ability",topic:"Can / can't for ability",format:"order",prompt:"Put the words in order to make a question.",tokens:["Can","your","brother","play","the","guitar?"],feedback:"In questions 'can' comes before the subject and is followed by the base verb.",seconds:35,status:"approved",author:O,createdAt:"2025-08-20"},{id:"EN-GR-A2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"irregular past forms",band:2,difficulty:-1,objectiveId:"en.a2.past-simple",topic:"Past Simple",format:"mcq",prompt:"We ___ to the festa junina at school last Saturday. It was great!",options:["go","goed","went","were go"],correct:2,feedback:"'Go' is irregular: its past form is 'went'.",seconds:20,status:"approved",author:O,createdAt:"2025-08-21"},{id:"EN-GR-A2-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"past simple wh- questions",band:2,difficulty:0,objectiveId:"en.a2.past-questions",topic:"Past Simple questions",format:"order",prompt:"Put the words in order to make a question.",tokens:["What","time","did","you","get","home","yesterday?"],feedback:"Past questions follow question word + did + subject + base verb.",seconds:40,status:"approved",author:O,createdAt:"2025-08-21"},{id:"EN-GR-A2-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"irregular comparatives",band:2,difficulty:0,objectiveId:"en.a2.comparatives",topic:"Comparatives",format:"error",prompt:"One part of this sentence has a mistake. Choose the part with the mistake.",options:["Florianópolis is smaller","than São Paulo,","but its beaches","are more good."],correct:3,correction:"are better.",feedback:"'Good' has an irregular comparative: 'better', not 'more good'.",seconds:35,status:"approved",author:O,createdAt:"2025-08-22"},{id:"EN-GR-A2-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"present continuous for arrangements",band:2,difficulty:1,objectiveId:"en.a2.future-plans",topic:"Future plans",format:"gap",prompt:"Complete with one word: What ___ you doing this weekend? — I'm going to my cousin's birthday party.",accept:["are"],feedback:"The present continuous ('What are you doing …?') asks about plans that are already arranged.",seconds:30,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-22"},{id:"EN-GR-B1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"past continuous vs past simple",band:3,difficulty:-1,objectiveId:"en.b1.past-continuous",topic:"Past Continuous",format:"mcq",prompt:"I ___ dinner when the lights suddenly went out.",options:["cooked","was cooking","am cooking","have cooked"],correct:1,feedback:"The past continuous describes the longer action in progress, which the past simple ('went out') interrupts.",seconds:25,status:"approved",author:O,createdAt:"2025-08-25"},{id:"EN-GR-B1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"for / since",band:3,difficulty:0,objectiveId:"en.b1.present-perfect",topic:"Present Perfect",format:"gap",prompt:"Complete with one word: We've lived in this flat ___ 2021, and we still love it.",accept:["since"],feedback:"'Since' is used with a point in time (2021) and 'for' with a period (three years).",seconds:30,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-25"},{id:"EN-GR-B1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"first conditional form",band:3,difficulty:0,objectiveId:"en.b1.first-conditional",topic:"First conditional",format:"error",prompt:"One part of this sentence has a mistake. Choose the part with the mistake.",options:["If it","will rain tomorrow,","we'll watch a film","at home instead."],correct:1,correction:"rains tomorrow,",feedback:"In a first conditional the if-clause uses the present simple ('if it rains'), not 'will'.",seconds:35,status:"approved",author:O,createdAt:"2025-08-26"},{id:"EN-GR-B1-04",version:1,lang:"en",ageGroups:["preteen","teen"],skill:"grammar",subskill:"don't have to vs mustn't",band:3,difficulty:1,objectiveId:"en.b1.modals-obligation",topic:"Modals of obligation",format:"mcq",prompt:"You ___ wear a uniform on Fridays at my school — it's optional, so most people wear jeans.",options:["mustn't","shouldn't","can't","don't have to"],correct:3,feedback:"'Don't have to' means it is not necessary, while 'mustn't' means it is not allowed.",seconds:30,status:"approved",author:O,createdAt:"2025-08-26"},{id:"EN-GR-B2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"future passive",band:4,difficulty:-1,objectiveId:"en.b2.passive",topic:"Passive voice",format:"mcq",prompt:"The results of the student survey ___ on the school website next week.",options:["will be published","will publish","are publishing","have published"],correct:0,feedback:"The results do not publish anything themselves, so a passive (will be + past participle) is needed.",seconds:25,status:"approved",author:O,createdAt:"2025-08-27"},{id:"EN-GR-B2-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"present continuous passive",band:4,difficulty:1,objectiveId:"en.b2.passive",topic:"Passive voice",format:"order",prompt:"Put the words in order to make a sentence.",tokens:["Our","flat","is","being","painted","this","week."],feedback:"The present continuous passive is is/are + being + past participle.",seconds:40,status:"approved",author:O,createdAt:"2025-08-27"},{id:"EN-GR-B2-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"third conditional",band:4,difficulty:0,objectiveId:"en.b2.conditionals",topic:"Third conditional",format:"gap",prompt:"Complete with one word: If I ___ known about the roadworks, I would have left home earlier.",accept:["had"],feedback:"The third conditional uses if + past perfect ('had known') + would have + past participle.",seconds:30,a11y:Qe,status:"approved",author:O,createdAt:"2025-08-28"},{id:"EN-GR-B2-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"reported questions",band:4,difficulty:1,objectiveId:"en.b2.reported-speech",topic:"Reported speech",format:"error",prompt:"One part of this sentence has a mistake. Choose the part with the mistake.",options:["My cousin wanted to know","how much my trainers cost","and asked me","where did I buy them."],correct:3,correction:"where I had bought them.",feedback:"Reported questions use statement word order without 'did': 'asked me where I had bought them'.",seconds:40,status:"approved",author:O,createdAt:"2025-08-28"},{id:"EN-GR-C1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"negative inversion",band:5,difficulty:0,objectiveId:"en.c1.advanced-structures",topic:"Inversion",format:"mcq",prompt:"___ had I sat down at my desk than the fire alarm went off.",options:["Hardly","As soon as","No sooner","Barely"],correct:2,feedback:"'No sooner … than' is the fixed pattern; 'hardly' and 'barely' pair with 'when'.",seconds:30,status:"approved",author:O,createdAt:"2025-08-29"},{id:"EN-GR-C1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"cleft sentences",band:5,difficulty:-1,objectiveId:"en.c1.advanced-structures",topic:"Cleft sentences",format:"order",prompt:"Put the words in order to make a sentence.",tokens:["What","worries","me","is","the","lack","of","communication."],feedback:"A wh-cleft ('What worries me is …') puts the important information at the end for emphasis.",seconds:40,status:"approved",author:O,createdAt:"2025-08-29"},{id:"EN-GR-C1-03",version:1,lang:"en",ageGroups:["adult"],skill:"grammar",subskill:"mixed conditionals",band:5,difficulty:1,objectiveId:"en.c1.advanced-structures",topic:"Mixed conditionals",format:"error",prompt:"One part of this sentence has a mistake. Choose the part with the mistake.",options:["If I didn't accept that job offer in 2019,","I would still be living","in Lisbon","with my parents now."],correct:0,correction:"If I hadn't accepted that job offer in 2019,",feedback:"A past condition with a present result needs a mixed conditional: 'If I hadn't accepted …, I would still be living …'.",seconds:40,status:"approved",author:O,createdAt:"2025-08-29"},{id:"EN-RE-PA1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"specific detail",band:0,difficulty:-1,objectiveId:"en.pa1.read-words",topic:"Signs",format:"mcq",passageTitle:"Sign at the park",passage:`Welcome to CITY PARK!
Open every day: 8:00 – 18:00
No dogs. No bikes.
Café →
Toilets ←
Playground ↑`,prompt:"What can you NOT bring to the park?",options:["a dog","a ball","a sandwich"],correct:0,feedback:"The sign says 'No dogs', so a dog is not allowed in the park.",seconds:30,a11y:Re,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-RE-PA1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"specific detail",band:0,difficulty:0,objectiveId:"en.pa1.read-words",topic:"About me",format:"mcq",passageTitle:"Bia's card",passage:"Hi! I'm Bia. I'm eleven. I have a cat. Her name is Luna. Luna is black and white. My favourite colour is green.",prompt:"What colour is Luna?",options:["green","black and white","brown"],correct:1,feedback:"The card says 'Luna is black and white'; green is Bia's favourite colour, not the cat's.",seconds:35,a11y:Re,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-RE-A1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"specific detail",band:1,difficulty:-1,objectiveId:"en.a1.read-short",topic:"Family messages",format:"mcq",passageTitle:"A message from Mum",passage:`Hi Leo,
I'm at work until seven today. There's pasta in the fridge for lunch. Please walk the dog and do your homework. Grandma is coming at six to help you with your maths.
Love, Mum`,prompt:"Why is Grandma coming?",options:["to make lunch","to walk the dog","to help Leo with maths","to take Leo to school"],correct:2,feedback:"The message says Grandma is coming 'to help you with your maths'.",seconds:50,a11y:Re,status:"approved",author:O,createdAt:"2025-09-02"},{id:"EN-RE-A1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"specific detail",band:1,difficulty:0,objectiveId:"en.a1.read-short",topic:"Signs and notices",format:"mcq",passageTitle:"Swimming pool notice",passage:`SWIMMING POOL
Monday to Friday: 6 am – 10 pm
Saturday: 8 am – 6 pm
Sunday: closed
Please have a shower before you swim.
Children under 10 must swim with an adult.
No food or drinks near the pool.`,prompt:"Which sentence is true?",options:["The pool is open on Sunday mornings.","You can eat a sandwich next to the pool.","The pool closes at 10 pm on Saturdays.","A nine-year-old can't swim without an adult."],correct:3,feedback:"Children under 10 must swim with an adult, so a nine-year-old cannot swim alone.",seconds:55,a11y:Re,status:"approved",author:O,createdAt:"2025-09-02"},{id:"EN-RE-A1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"specific detail",band:1,difficulty:1,objectiveId:"en.a1.read-short",topic:"Personal information",format:"gap",passageTitle:"Rafael's profile",passage:"My name is Rafael. I'm 34 and live in Curitiba with my wife and our two daughters. I work at a hospital — I'm a nurse. I start work at seven in the morning, so I get up early. At the weekend I play football with my friends.",prompt:"Complete with one word: At the weekend, Rafael plays ___ with his friends.",accept:["football","soccer"],feedback:"The last sentence says 'At the weekend I play football with my friends'.",seconds:60,a11y:Qe,status:"approved",author:O,createdAt:"2025-09-03"},{id:"EN-RE-A2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"main idea",band:2,difficulty:0,objectiveId:"en.a2.read-main",topic:"Travel blog",format:"mcq",passageTitle:"Blog: A rainy weekend in Paraty",passage:"Last weekend my friends and I went to Paraty. We wanted to swim and take a boat trip, but it rained all day on Saturday. At first we were disappointed. Then we found a cooking class in the old town and learned to make moqueca. In the evening we listened to live music. On Sunday the sun came out, but we didn't go to the beach — we went back to the cooking school! It wasn't the trip we planned, but it was one of the best.",prompt:"What is the main idea of the blog post?",options:["The weather in Paraty is usually bad.","The trip was different from their plan, but they enjoyed it.","Cooking classes in Paraty are expensive.","They spent most of the weekend at the beach."],correct:1,feedback:"The rain changed their plans, but the last sentence says it was 'one of the best' trips.",seconds:80,a11y:Re,status:"approved",author:O,createdAt:"2025-09-03"},{id:"EN-RE-A2-02",version:1,lang:"en",ageGroups:["preteen","teen"],skill:"reading",subskill:"specific detail",band:2,difficulty:-1,objectiveId:"en.a2.read-main",topic:"School notices",format:"mcq",passageTitle:"Notice: School library",passage:`LIBRARY NEWS
From Monday 15th September, the school library will open at 7:30 am, not 8:00. You can now borrow four books for two weeks, but dictionaries must stay in the library. The computers are for homework only — no games, please. Our new reading club meets every Thursday after lunch. Ask Ms Oliveira at the front desk if you want to join.`,prompt:"Which sentence is true, according to the notice?",options:["The library will open earlier than before.","Students can now play games on the computers.","The reading club meets on Tuesdays.","Students can take dictionaries home."],correct:0,feedback:"The library will open at 7:30 instead of 8:00, which is earlier than before.",seconds:75,a11y:Re,status:"approved",author:O,createdAt:"2025-09-04"},{id:"EN-RE-A2-03",version:1,lang:"en",ageGroups:["adult"],skill:"reading",subskill:"specific detail",band:2,difficulty:1,objectiveId:"en.a2.read-main",topic:"Renting a flat",format:"mcq",passageTitle:"Advert: Flat to rent",passage:`FLAT TO RENT – Pinheiros, São Paulo
Two-bedroom flat on the third floor, five minutes from the metro. The kitchen is small but modern, and the living room has a balcony. Rent: R$3,200 a month, plus building fees. No pets, sorry. The flat is available from 1st October. To visit, send a message to Carla after 6 pm on weekdays or any time on Saturday.`,prompt:"When can you contact Carla to arrange a visit?",options:["on a Tuesday morning","on Saturday afternoon","on Sunday at any time","on a weekday at lunchtime"],correct:1,feedback:"Carla can be contacted 'any time on Saturday', so Saturday afternoon is fine; on weekdays it must be after 6 pm.",seconds:80,a11y:Re,status:"approved",author:O,createdAt:"2025-09-04"},{id:"EN-RE-A2-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"specific detail",band:2,difficulty:0,objectiveId:"en.a2.read-main",topic:"Making plans",format:"gap",passageTitle:"Group chat: Saturday plans",passage:`Júlia: Hi everyone! Are we still going to the cinema on Saturday?
Theo: Yes! But the 4 pm film is sold out. Let's go to the 7 pm one.
Júlia: OK. Shall we meet at the shopping centre first and have pizza?
Theo: Good idea. Let's meet at the entrance at 6.
Maya: Sorry, I can't come at 6 — I've got a piano lesson. See you inside the cinema!`,prompt:"Complete with one word: Maya can't meet the others at 6 because she has a ___ lesson.",accept:["piano"],feedback:"Maya writes that she can't come at 6 because she has 'a piano lesson'.",seconds:75,a11y:Qe,status:"approved",author:O,createdAt:"2025-09-05"},{id:"EN-RE-B1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"writer's opinion",band:3,difficulty:0,objectiveId:"en.b1.read-inference",topic:"Restaurant review",format:"mcq",passageTitle:"Review: Casa Mandioca",passage:"I'd heard great things about Casa Mandioca, so I booked a table for my mum's birthday. The place itself is lovely: plants everywhere, soft lighting and friendly staff who clearly enjoy their work. The menu is short, which I usually see as a good sign. My fish with coconut sauce was perfectly cooked, and the cassava chips were the best I've ever had. Unfortunately, we waited almost an hour for our main courses, and nobody explained why. When the bill arrived, there was a 'service charge' I hadn't seen on the menu. Would I go back? For the food, definitely — but maybe on a quieter night, and I'd check the bill carefully.",prompt:"What is the writer's overall opinion of Casa Mandioca?",options:["Everything was perfect, and the writer will recommend it to everyone.","It is too expensive, so the writer won't go back.","The staff were unfriendly, but the atmosphere was pleasant.","The food was excellent, but the service and the bill were disappointing."],correct:3,feedback:"The writer praises the food but complains about the long wait and the unexpected charge, and would return only for the food.",seconds:100,a11y:Re,status:"approved",author:O,createdAt:"2025-09-05"},{id:"EN-RE-B1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"inference",band:3,difficulty:1,objectiveId:"en.b1.read-inference",topic:"Social media",format:"mcq",passageTitle:"Blog: My month without social media",passage:"Last month I deleted all my social media apps for thirty days. The first week was harder than I expected. I kept picking up my phone without thinking, and I was worried I was missing important news from my friends. By the second week, though, something changed. I started reading again — three novels in a month! — and I actually called my best friend instead of just sending her messages. Now the thirty days are over, and I've put one app back on my phone, but only for weekends. I'm not saying everyone should do this. It just made me realise how much time I used to give away without noticing.",prompt:"What can we infer about the writer now?",options:["The writer thinks everyone should stop using social media.","The writer now uses social media in a more limited way.","The writer has lost contact with friends.","The writer regrets doing the experiment."],correct:1,feedback:"The writer has reinstalled only one app and uses it 'only for weekends', so their use is now limited.",seconds:100,a11y:Re,status:"approved",author:O,createdAt:"2025-09-08"},{id:"EN-RE-B1-03",version:1,lang:"en",ageGroups:["adult"],skill:"reading",subskill:"inference: writer's purpose",band:3,difficulty:0,objectiveId:"en.b1.read-inference",topic:"Work email",format:"mcq",passageTitle:"Email from a colleague",passage:`Hi Daniel,
Thanks for sending the sales report yesterday — it looks great. I've just noticed that the figures for July are the same as June's, though. I'm sure it's just a copy-and-paste thing, and it happens to all of us! The problem is that Patrícia is presenting the report to the directors at 10 tomorrow, and she'll probably be asked about July in particular. Do you think you could have a quick look this afternoon? If it helps, I'm free after 3 and happy to go through the numbers with you.
Best,
Renata`,prompt:"What is Renata's main purpose in writing?",options:["to complain to Daniel about his work in front of his manager","to thank Daniel for finishing the report early","to ask Daniel politely to correct a mistake quickly","to tell Daniel that Patrícia's presentation is cancelled"],correct:2,feedback:"Renata softens the problem but clearly asks Daniel to check the July figures this afternoon, before the presentation.",seconds:100,a11y:Re,status:"approved",author:O,createdAt:"2025-09-08"},{id:"EN-RE-B1-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"vocabulary in context",band:3,difficulty:-1,objectiveId:"en.b1.read-inference",topic:"Community projects",format:"mcq",passageTitle:"Article: A garden on the roof",passage:"When the residents of a building in central São Paulo decided to turn their empty roof into a vegetable garden, many neighbours laughed. 'Nothing grows up there,' they said. Three years later, the roof produces lettuce, tomatoes, herbs and even bananas. The project started with just four volunteers and a few old boxes. Now more than thirty families take turns watering the plants, and the building holds a small market every month. According to Dona Célia, one of the founders, the biggest change isn't the food. 'Before, we didn't even know each other's names,' she says. 'Now we have a reason to talk.'",prompt:"The families 'take turns watering the plants'. This means they …",options:["water them one after another, on different days","all water them together once a month","pay someone to water them","argue about who should water them"],correct:0,feedback:"'Take turns' means each person or family does something in sequence, one after another.",seconds:95,a11y:Re,status:"approved",author:O,createdAt:"2025-09-09"},{id:"EN-RE-B2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"text organisation",band:4,difficulty:0,objectiveId:"en.b2.read-organisation",topic:"Work and technology",format:"mcq",passageTitle:"Article: The four-day week",passage:`Over the past few years, several companies have experimented with a four-day working week, keeping salaries the same while cutting one day of work. Supporters claim that staff are happier, take fewer sick days and get just as much done.

However, the picture is not entirely positive. In some trials, employees reported that they were simply squeezing five days of work into four, which left them more exhausted than before. Managers in customer-facing sectors, such as healthcare and retail, also pointed out that their services cannot simply close on Fridays.

What seems to matter most is not the number of days but how the change is introduced. Where teams were consulted early and unnecessary meetings were cut, the results were impressive. Where the new schedule was imposed from above, enthusiasm faded within months.`,prompt:"What is the main purpose of the second paragraph?",options:["to give more examples of the benefits mentioned in the first paragraph","to present problems that challenge the positive view in the first paragraph","to explain how companies should introduce a four-day week","to describe the history of the four-day week"],correct:1,feedback:"'However, the picture is not entirely positive' signals that the paragraph introduces problems contrasting with paragraph one.",seconds:130,a11y:Re,status:"approved",author:O,createdAt:"2025-09-09"},{id:"EN-RE-B2-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"implied meaning",band:4,difficulty:1,objectiveId:"en.b2.read-organisation",topic:"Education: homework",format:"mcq",passageTitle:"Opinion: Less homework, better learning?",passage:`Every year, someone suggests that schools should ban homework, and every year the debate follows the same pattern. One side says homework steals children's free time; the other says it builds discipline. Both sides tend to ignore a simpler question: what is the homework actually for?

When I was at school, our history teacher gave us forty questions every weekend, copied straight from the textbook. We copied the answers just as quickly from each other. Nobody learned much, but the teacher's records looked impressive.

Compare that with my niece, whose teacher asks her class to interview an older relative about life thirty years ago. It takes less time, yet she talks about it for weeks. Perhaps the problem was never homework itself.`,prompt:"What does the writer imply in the last sentence?",options:["Homework should be banned in all schools.","Students today are lazier than in the past.","The type and purpose of homework matter more than whether it exists.","Teachers should give more homework at weekends."],correct:2,feedback:"The two contrasting examples show that useful homework depends on its purpose, so the problem is badly designed homework, not homework itself.",seconds:130,a11y:Re,status:"approved",author:O,createdAt:"2025-09-10"},{id:"EN-RE-B2-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"reference and cohesion",band:4,difficulty:-1,objectiveId:"en.b2.read-organisation",topic:"Product review",format:"mcq",passageTitle:"Review: The FitTrack 3 watch",passage:`I bought the FitTrack 3 to replace an older fitness watch whose battery barely lasted a day. In that respect, the new model is a huge improvement: I charged it on Monday and it was still going on Saturday. The screen is bright enough to read in direct sunlight, which matters when you run along the beach in Fortaleza at midday.

The companion app is another story. It asks for access to your contacts, your location and your microphone, and it took me twenty minutes to work out how to turn most of this off. Once I had done so, it worked smoothly enough. Overall, I'd recommend the watch itself without hesitation; the software, on the other hand, needs serious attention from the developers.`,prompt:"In the second paragraph, what does 'this' refer to in 'turn most of this off'?",options:["the watch's bright screen","the watch's long battery life","the twenty minutes the writer spent","the app's access to personal information"],correct:3,feedback:"'This' points back to the access the app requests to contacts, location and microphone, mentioned just before.",seconds:120,a11y:Re,status:"approved",author:O,createdAt:"2025-09-10"},{id:"EN-RE-B2-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"text organisation: missing sentence",band:4,difficulty:0,objectiveId:"en.b2.read-organisation",topic:"Travel notice",format:"mcq",passageTitle:"Notice: Changes to the ferry service",passage:`From 3rd November, the ferry between the island and the mainland will run on a reduced timetable while the main pier is repaired. Departures will be every 90 minutes instead of every 30, and the last ferry will leave the island at 9 pm rather than midnight. [ … ] Passengers with reduced mobility can request assistance at the ticket office, as the temporary pier has steps rather than a ramp.

We understand that these changes will cause inconvenience, particularly for people who commute to work on the mainland. For this reason, a free shuttle bus will connect the temporary pier with the town centre throughout the repair period, which is expected to last six weeks. Updated timetables are available on our website and at the ticket office.`,prompt:"Which sentence best fills the gap marked [ … ] in the notice?",options:["All ferries will leave from a temporary pier next to the fish market.","The shuttle bus will also stop at the hospital and the bus station.","As a result, tickets will be cheaper until the end of the year.","The repairs were finished ahead of schedule last year."],correct:0,feedback:"The next sentence refers to 'the temporary pier', so the missing sentence must introduce it first.",seconds:140,a11y:Re,status:"approved",author:O,createdAt:"2025-09-11"},{id:"EN-RE-C1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"writer's stance",band:5,difficulty:0,objectiveId:"en.c1.read-complex",topic:"Tourism",format:"mcq",passageTitle:"Opinion: Loving a place to death",passage:`There is a particular kind of postcard town that seems to exist mainly to be photographed. Its colonial streets are spotless, its cafés serve flat whites, and almost nobody who was born there can still afford to live in the centre. It would be easy to blame the tourists, and many commentators do. I find that argument convenient rather than convincing.

Visitors do not decide planning laws, nor do they choose to convert family homes into short-term rentals; local councils and property owners do. Tourism has brought jobs and restored buildings that were falling apart a generation ago, and pretending otherwise is a kind of nostalgia for a poverty most residents were glad to leave behind.

The real question, then, is not whether tourists should come, but who gets to decide what the town is for. Until residents have a meaningful say in that decision, rather than a token consultation once every few years, the postcards will keep getting prettier and the streets emptier.`,prompt:"Which statement best summarises the writer's position?",options:["Tourists are mainly to blame for the problems of historic towns.","Historic towns were better places to live before tourism arrived.","The key issue is that residents lack real control over how their town develops.","Short-term rentals should be banned in historic town centres."],correct:2,feedback:"The writer rejects blaming tourists and argues the real question is 'who gets to decide what the town is for'.",seconds:150,a11y:Re,status:"approved",author:O,createdAt:"2025-09-11"},{id:"EN-RE-C1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"reading",subskill:"inference: reviewer's attitude",band:5,difficulty:1,objectiveId:"en.c1.read-complex",topic:"Book review",format:"mcq",passageTitle:"Review: 'Scattered' by L. M. Duarte",passage:`In Scattered, L. M. Duarte sets out to prove that smartphones have permanently damaged our ability to concentrate. It is an engaging read, full of vivid anecdotes: the surgeon who checks her messages between operations, the student who cannot finish a film without pausing it six times. What it is not, however, is a convincing argument.

Duarte relies heavily on surveys in which people report feeling more distracted than they used to, but feeling distracted and being less able to concentrate are hardly the same thing. Every generation, after all, has complained that the next one cannot sit still. When the book does cite experimental research, it tends to mention only the studies that support its thesis, while a large body of more cautious work goes unmentioned.

None of this makes Scattered worthless. As a portrait of how many of us experience daily life, it rings true. Readers looking for hard evidence, though, would do well to look elsewhere.`,prompt:"What is the reviewer's attitude towards the book?",options:["enthusiastic: it proves its argument with strong evidence","dismissive: it has no value for any reader","neutral: it summarises the book without judging it","mixed: it describes everyday experience well but does not prove its main claim"],correct:3,feedback:"The reviewer calls the book engaging and true to experience but 'not a convincing argument', which is a mixed evaluation.",seconds:150,a11y:Re,status:"approved",author:O,createdAt:"2025-09-12"},{id:"EN-RE-C1-03",version:1,lang:"en",ageGroups:["adult"],skill:"reading",subskill:"inference: implied criticism",band:5,difficulty:0,objectiveId:"en.c1.read-complex",topic:"Workplace culture",format:"mcq",passageTitle:"Article: The open-plan promise",passage:`When our company moved to an open-plan office three years ago, the announcement promised 'a new era of collaboration'. Walls came down, private offices disappeared and everyone, from interns to directors, was given an identical desk. The directors, admittedly, soon discovered that their schedules required them to spend most of the day in the glass meeting rooms on the top floor.

For the rest of us, the results have been mixed. Conversations that once required a walk down the corridor now happen instantly, and new staff say they learn faster by overhearing experienced colleagues. On the other hand, noise-cancelling headphones have become as essential as laptops, and the quiet rooms are booked weeks in advance.

Perhaps the most telling sign is the number of people who now 'work from home on Fridays to get things done'. Collaboration, it seems, is something we are happy to do four days a week — as long as we can escape it on the fifth.`,prompt:"What does the writer suggest about the directors?",options:["They found a way to avoid working in the open-plan space themselves.","They spend more time collaborating with junior staff than before.","They were the strongest critics of the open-plan design.","They now work from home on Fridays like everyone else."],correct:0,feedback:"'Admittedly' and 'their schedules required them' ironically suggest the directors escaped the open-plan floor into private meeting rooms.",seconds:150,a11y:Re,status:"approved",author:O,createdAt:"2025-09-12"},{id:"EN-LI-PA1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific information",band:0,difficulty:-1,objectiveId:"en.pa1.listen-words",topic:"Colours",format:"mcq",passageTitle:"Whose bag?",passage:`[F] Is this your bag?
[M] No. My bag is blue.
[F] Oh, OK. This bag is black.`,prompt:"What colour is his bag?",options:["black","blue","brown"],correct:1,feedback:"He says 'My bag is blue'; the black bag is a different one.",seconds:25,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-15"},{id:"EN-LI-PA1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific information",band:0,difficulty:0,objectiveId:"en.pa1.listen-words",topic:"Objects and places",format:"mcq",passageTitle:"At home",passage:`[M] Where's my phone? Is it in my bag?
[F] No, it isn't. It's on the table.
[M] On the table? Thank you!`,prompt:"Where is the phone?",options:["on the chair","in the bag","on the table"],correct:2,feedback:"She says 'No, it isn't. It's on the table', so it is not in the bag.",seconds:25,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-15"},{id:"EN-LI-A1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific information: times",band:1,difficulty:-1,objectiveId:"en.a1.listen-info",topic:"Times",format:"mcq",passageTitle:"At the cinema",passage:`[F] Excuse me, what time does the film start?
[M] At half past seven.
[F] Half past seven. And what time does it finish?
[M] At about ten o'clock.`,prompt:"What time does the film start?",options:["10:00","6:30","7:15","7:30"],correct:3,feedback:"'Half past seven' is 7:30; ten o'clock is when the film finishes.",seconds:40,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-16"},{id:"EN-LI-A1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific information: prices",band:1,difficulty:0,objectiveId:"en.a1.listen-info",topic:"Food and shopping",format:"mcq",passageTitle:"At the bakery",passage:`[M] Good morning. Can I have six pão de queijo, please?
[F] Sure. Anything else?
[M] And a small coffee.
[F] OK. That's twelve reais, please.
[M] Here you are. Thanks!`,prompt:"How much does the man pay?",options:["R$12","R$20","R$16","R$6"],correct:0,feedback:"The woman says 'That's twelve reais'; 'twelve' and 'twenty' are often confused.",seconds:40,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-16"},{id:"EN-LI-A1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific information: numbers",band:1,difficulty:1,objectiveId:"en.a1.listen-info",topic:"Numbers and places",format:"mcq",passageTitle:"An announcement at a language school",passage:"[N] Good morning, everyone. Today the English class is in room fourteen, not room forty. That's room one-four, on the first floor. Thank you.",prompt:"Which room is the English class in today?",options:["room 40","room 4","room 14","room 41"],correct:2,feedback:"The announcer says 'room fourteen, not room forty' and spells it out as 'one-four'.",seconds:40,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-17"},{id:"EN-LI-A2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific detail",band:2,difficulty:0,objectiveId:"en.a2.listen-detail",topic:"Weekend plans",format:"mcq",passageTitle:"Two friends making plans",passage:`[F] Are you free this weekend? There's a street food festival in the park.
[M] I'd love to go, but I'm working on Saturday.
[F] Oh no. What about Sunday? It's open all weekend.
[M] Sunday's perfect. Shall we meet at the main gate at twelve?
[F] Great — and bring some cash. Some of the stalls don't take cards.`,prompt:"What does the woman tell the man to bring?",options:["some cash","his bank card","something to eat","a jacket"],correct:0,feedback:"She says 'bring some cash' because some stalls don't take cards.",seconds:60,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-17"},{id:"EN-LI-A2-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific detail",band:2,difficulty:1,objectiveId:"en.a2.listen-detail",topic:"Travel: tickets",format:"mcq",passageTitle:"At the bus station",passage:`[M] Hi. Can I have a return ticket to Santos, please?
[F] Are you coming back today?
[M] No, on Sunday afternoon.
[F] OK. That's eighty-four reais. The next bus leaves at ten fifteen from platform three.
[M] Platform three. Thanks.`,prompt:"When is the man coming back?",options:["today","tomorrow","on Sunday morning","on Sunday afternoon"],correct:3,feedback:"He answers 'No, on Sunday afternoon' when asked if he is coming back today.",seconds:60,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-18"},{id:"EN-LI-A2-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific detail",band:2,difficulty:-1,objectiveId:"en.a2.listen-detail",topic:"Last weekend",format:"mcq",passageTitle:"Talking about the weekend",passage:`[M] Hi Bruna! How was your weekend?
[F] Really nice, thanks. On Saturday I went to my aunt's farm with my parents.
[M] Cool! Did you ride a horse?
[F] No, I didn't — it rained all afternoon. So we played cards and ate a lot of cake!`,prompt:"What did Bruna do at the farm?",options:["She rode a horse.","She played cards.","She went swimming.","She made a cake."],correct:1,feedback:"Bruna didn't ride a horse because of the rain; she says 'we played cards and ate a lot of cake'.",seconds:60,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-18"},{id:"EN-LI-A2-04",version:1,lang:"en",ageGroups:["adult"],skill:"listening",subskill:"specific detail",band:2,difficulty:0,objectiveId:"en.a2.listen-detail",topic:"Health appointments",format:"mcq",passageTitle:"Calling a health clinic",passage:`[F] Good morning, Vida Clinic.
[M] Hi, I'd like to make an appointment with Dr Lima, please.
[F] Let me see … She's free on Wednesday at four, or on Friday at nine.
[M] Wednesday's difficult for me. I'll take Friday.
[F] Friday at nine, then. Please arrive ten minutes early.`,prompt:"When is the man's appointment?",options:["Wednesday at 4:00","Friday at 4:00","Friday at 9:00","Wednesday at 9:00"],correct:2,feedback:"Wednesday is difficult for him, so he takes the Friday slot at nine.",seconds:65,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-19"},{id:"EN-LI-B1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"attitude",band:3,difficulty:0,objectiveId:"en.b1.listen-gist",topic:"Films",format:"mcq",passageTitle:"After the cinema",passage:`[F] So, what did you think?
[M] Honestly? The first half was brilliant. I loved the way they introduced the characters.
[F] But …?
[M] But it just went on and on. That ending must have been forty minutes long. I kept checking my watch.
[F] I know what you mean. I'd still watch it again, though — the music was amazing.`,prompt:"What is the man's opinion of the film?",options:["He didn't like the characters.","He thought the music was the best part.","He wants to see it again soon.","He enjoyed the start, but he found it too long."],correct:3,feedback:"He calls the first half 'brilliant' but says 'it just went on and on'; the music and seeing it again are the woman's views.",seconds:80,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-19"},{id:"EN-LI-B1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"main idea",band:3,difficulty:-1,objectiveId:"en.b1.listen-gist",topic:"City life: transport",format:"mcq",passageTitle:"Local radio news",passage:"[N] And now some local news. From next Monday, the city's shared bikes will be free for the first thirty minutes of every ride. The council hopes this will encourage more people to leave their cars at home, especially for short trips to work or school. To use the bikes, you'll need to download the city app and register. After the first thirty minutes, rides will cost two reais an hour.",prompt:"What is the main point of the news report?",options:["The city is building new bike lanes.","Cars will be banned from the city centre.","The bike app has stopped working.","Short bike rides will soon be free."],correct:3,feedback:"The report announces that the first thirty minutes of every shared-bike ride will be free.",seconds:80,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-22"},{id:"EN-LI-B1-03",version:1,lang:"en",ageGroups:["preteen","teen"],skill:"listening",subskill:"attitude",band:3,difficulty:1,objectiveId:"en.b1.listen-gist",topic:"School trip",format:"mcq",passageTitle:"Two classmates before a school trip",passage:`[M] Are you ready for the trip tomorrow? Three days in the mountains!
[F] I think so. I've packed everything twice, actually.
[M] Twice?
[F] Well, I've never slept away from home before, so … I keep thinking about what could go wrong. But everyone says the hiking is amazing, and I really want to see the waterfall.
[M] You'll be fine. And we're in the same group!`,prompt:"How does the girl feel about the trip?",options:["bored, because she has done it before","a bit nervous, but also looking forward to it","annoyed, because she doesn't want to go","completely relaxed about it"],correct:1,feedback:"She worries about what could go wrong but 'really wants' to see the waterfall, so she is nervous and excited.",seconds:85,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-22"},{id:"EN-LI-B1-04",version:1,lang:"en",ageGroups:["adult"],skill:"listening",subskill:"main idea",band:3,difficulty:0,objectiveId:"en.b1.listen-gist",topic:"Work: schedules",format:"mcq",passageTitle:"Two colleagues in the office",passage:`[F] Have you seen the email about the new shifts?
[M] Yeah, I've just read it. So from next month we start at eight instead of nine?
[F] Only on Mondays and Tuesdays. The rest of the week stays the same.
[M] Right. Well, I'll have to find someone to take my son to school on those days.
[F] Same here. Maybe we could take turns?`,prompt:"What are the colleagues mainly talking about?",options:["a change to their working hours on some days","a problem at their children's school","a new job they both want","an email they forgot to send"],correct:0,feedback:"They discuss the new shifts that start an hour earlier on Mondays and Tuesdays and how this affects them.",seconds:85,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-23"},{id:"EN-LI-B2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"implied meaning",band:4,difficulty:0,objectiveId:"en.b2.listen-implied",topic:"Renting a flat",format:"mcq",passageTitle:"Viewing a flat",passage:`[M] So, what do you think? The living room's huge, and it's really close to the metro.
[F] Mm, it's got … potential.
[M] Potential? You don't like it.
[F] I didn't say that! It's just … did you see the bathroom? And I'm not sure I want to hear every train that goes past at six in the morning.
[M] OK, OK. Let's see the other one before we decide.`,prompt:"What does the woman imply about the flat?",options:["She thinks it's perfect and wants to rent it.","She has some serious doubts about it.","She thinks it's too far from the metro.","She prefers it to the other flat they've seen."],correct:1,feedback:"'It's got potential', the comment on the bathroom and the train noise all signal doubts she does not state directly.",seconds:100,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-23"},{id:"EN-LI-B2-02",version:1,lang:"en",ageGroups:["adult"],skill:"listening",subskill:"attitude",band:4,difficulty:1,objectiveId:"en.b2.listen-implied",topic:"Work: feedback",format:"mcq",passageTitle:"A conversation with a manager",passage:`[F] Thanks for coming in, Paulo. I wanted to talk about the presentation you gave the clients yesterday.
[M] Sure. I thought it went pretty well, actually.
[F] Your slides were very clear, and you obviously knew the product. I'm just wondering whether forty-five minutes was the best use of a one-hour meeting.
[M] Oh. You mean they didn't have much time for questions?
[F] Well, let's just say that next time I'd love to hear a bit more from them — and a little less from us.`,prompt:"What is the manager suggesting?",options:["His slides were confusing.","He needs to learn more about the product.","He spoke for too long and didn't leave the clients enough time.","The meeting should have been longer."],correct:2,feedback:"Her polite hints ('forty-five minutes of a one-hour meeting', 'less from us') mean he talked too much and the clients had little time.",seconds:110,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-24"},{id:"EN-LI-B2-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"implied meaning: sarcasm",band:4,difficulty:0,objectiveId:"en.b2.listen-implied",topic:"Sport and free time",format:"mcq",passageTitle:"After a football match",passage:`[M] Well, that was a great way to spend a Sunday afternoon.
[F] Oh, come on, it wasn't that bad.
[M] Two hours in the rain, nil-nil, and I couldn't see a thing from our seats. Fantastic.
[F] OK, fair enough. Next time, you choose what we do.`,prompt:"How does the man really feel about the afternoon?",options:["He enjoyed it very much.","He was happy because his team won.","He is excited about the next match.","He was disappointed and quite annoyed."],correct:3,feedback:"'A great way to spend a Sunday' and 'Fantastic' are sarcastic: the rain, the 0-0 score and the bad seats show he was annoyed.",seconds:90,a11y:Ae,status:"approved",author:O,createdAt:"2025-09-24"},{id:"EN-LI-B2-04",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"detail in extended speech",band:4,difficulty:-1,objectiveId:"en.b2.listen-implied",topic:"Health: teenagers and sleep",format:"mcq",passageTitle:"A science podcast",passage:`[N] Welcome back to Everyday Science. Today's question: why are teenagers so tired in the morning?
[F] Well, it's not just late nights and screens, although those don't help. During the teenage years, the body starts producing melatonin — the hormone that makes us sleepy — around two hours later than in childhood. So a fourteen-year-old who can't fall asleep before eleven isn't necessarily being difficult. Their body clock has actually moved.
[M] So making them go to bed earlier won't solve it?
[F] Not on its own. That's why some schools have tried later start times — and the early results on attention and mood are quite encouraging.`,prompt:"What is the main biological reason the scientist gives for teenagers finding it hard to fall asleep early?",options:["Teenagers need less sleep than children.","Schools start too late in the morning.","They drink too much coffee in the evening.","Their bodies start producing the sleep hormone later."],correct:3,feedback:"She explains that melatonin is released about two hours later in the teenage years, so their body clock has moved.",seconds:120,a11y:Nn,status:"approved",author:O,createdAt:"2025-09-25"},{id:"EN-LI-C1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"stance",band:5,difficulty:0,objectiveId:"en.c1.listen-complex",topic:"Remote work",format:"mcq",passageTitle:"A radio panel discussion",passage:`[N] So, Dr Ferreira, is remote work here to stay?
[F] I think the honest answer is that it depends on what you mean by 'remote'. Fully remote teams have struggled, in my experience, with things like mentoring junior staff — you just don't pick up as much when your only contact is a scheduled video call.
[M] But surely the productivity figures show —
[F] They show that certain tasks get done faster, yes. I'm not disputing that. What they don't capture is the slower, harder-to-measure stuff: trust, informal learning, the chat by the coffee machine that saves a project three months later. So I'd say hybrid models are probably the future, but we're kidding ourselves if we think we've already worked out how to do them well.`,prompt:"What is Dr Ferreira's view?",options:["Remote work has clearly failed and should be abandoned.","Productivity figures prove that remote work is better.","Hybrid work will probably last, but how to do it well is still unresolved.","Junior staff learn faster when they work from home."],correct:2,feedback:"She concedes some productivity gains but concludes that hybrid is 'probably the future' and that we have not yet worked out how to do it well.",seconds:130,a11y:Nn,status:"approved",author:O,createdAt:"2025-09-25"},{id:"EN-LI-C1-02",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"implicit attitude: irony",band:5,difficulty:1,objectiveId:"en.c1.listen-complex",topic:"Family celebrations",format:"mcq",passageTitle:"Two siblings planning a party",passage:`[F] So Mum wants a 'small, simple' party for Dad's sixtieth.
[M] Right. Small and simple. Which is why she's already booked a band, invited the whole street and asked Aunt Lúcia to make a three-layer cake.
[F] To be fair, the band is only a trio.
[M] Oh, well, that changes everything.
[F] Look, I know it's getting out of hand, but you know what she's like. If we try to scale it back now, she'll only add something else.
[M] Fine. But I'm not giving a speech.`,prompt:"What is the speakers' attitude to their mother's plans?",options:["They think the party is getting far bigger than she claims, but they've accepted it.","They're pleased the party will be small and simple.","They've decided to cancel the band and the cake.","They think their father would prefer an even bigger party."],correct:0,feedback:"The ironic 'Small and simple' and 'that changes everything' show the party is growing, but 'Fine' signals they accept it.",seconds:130,a11y:Nn,status:"approved",author:O,createdAt:"2025-09-26"},{id:"EN-LI-C1-03",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"inference: speaker's evaluation",band:5,difficulty:-1,objectiveId:"en.c1.listen-complex",topic:"Urban planning",format:"mcq",passageTitle:"Part of a public lecture",passage:"[M] Now, one proposal that gets a lot of attention is painting city roofs white to reflect sunlight and cool buildings down. And it does work — on a hot afternoon, a white roof can be dramatically cooler than a dark one. But I'd be wary of treating it as a solution in itself. In a city like ours, much of the heat that makes nights unbearable comes from roads and pavements, not roofs. And the neighbourhoods that suffer most are often the ones with the fewest trees and the oldest housing, where residents can't simply repaint. So by all means, let's paint roofs. Just don't let anyone tell you that's the end of the conversation.",prompt:"What is the speaker's view of the white-roof proposal?",options:["It's useful, but only a partial answer to the problem.","It doesn't work and is a waste of money.","It's the most effective way to cool a city.","It should only be used in wealthy neighbourhoods."],correct:0,feedback:"He accepts that 'it does work' but warns against 'treating it as a solution in itself', so it is helpful but partial.",seconds:120,a11y:Nn,status:"approved",author:O,createdAt:"2025-09-26"},{id:"EN-VO-B2-05",version:1,lang:"en",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"false friends",band:4,difficulty:0,objectiveId:"en.b2.vocab-precision",topic:"False friends",format:"mcq",prompt:"I used to work in sales, but I'm ___ looking for a job in marketing.",options:["actually","currently","eventually","really"],correct:1,feedback:"'Currently' means 'at the moment' (Portuguese 'atualmente'); 'actually' means 'in fact' and 'eventually' means 'in the end'.",seconds:25,status:"in_review",author:O,createdAt:"2025-09-24",changeNote:"New item: second reviewer to check whether 'really' is defensible in speech."},{id:"EN-LI-A2-05",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"listening",subskill:"specific detail: directions",band:2,difficulty:0,objectiveId:"en.a2.listen-detail",topic:"Directions in the city",format:"mcq",passageTitle:"Asking for directions",passage:`[M] Excuse me, is there a pharmacy near here?
[F] Yes, there's one on Rua das Flores. Go straight on and turn left at the bank.
[M] Left at the bank …
[F] That's right. The pharmacy is next to the supermarket, opposite the bus stop.
[M] Great, thank you!`,prompt:"Where is the pharmacy?",options:["next to the supermarket","next to the bank","opposite the supermarket","behind the bus stop"],correct:0,feedback:"She says the pharmacy is 'next to the supermarket, opposite the bus stop'; the bank is where you turn left.",seconds:60,a11y:Ae,status:"in_review",author:O,createdAt:"2025-09-26",changeNote:"New item: text-to-speech speed and voices to be checked before approval."},{id:"EN-GR-B1-05",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"grammar",subskill:"present perfect for recent events",band:3,difficulty:0,objectiveId:"en.b1.present-perfect",topic:"Present Perfect",format:"mcq",prompt:"Oh no! I ___ my keys. Can you help me look for them?",options:["lost","was losing","have lost","had lost"],correct:2,feedback:"The present perfect ('have lost') links a recent past event to a present result.",seconds:25,status:"retired",author:O,createdAt:"2025-08-25",changeNote:"Retired: two defensible answers reported by teacher review ('I lost my keys' is also natural, especially in American English)."}],Vo=[{id:"EN-WR-PA1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"writing",band:0,title:"All about me",prompt:"Write about you. You can write words or very short sentences.",bullets:["your name","your age","a colour, food or animal you like"],picture:"🙂 🎂 🎨 🐶",minWords:5,teacherNotes:"Targets Pre-A1. Accept single words and formulaic phrases ('My name is …', 'I am 11'). Look for correct spelling of very high-frequency words, basic word order and 'I am' (not 'I have') for age. Do not penalise missing capitals or punctuation at this band. Evidence of A1: two or more complete sentences, perhaps joined with 'and'.",seconds:300,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-WR-A1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"writing",band:1,title:"My typical day",prompt:"Write a short text about a normal day in your life.",bullets:["what time you get up and what you have for breakfast","what you do in the morning and the afternoon (school, work or home)","what you like doing in the evening"],minWords:25,teacherNotes:"Targets A1 (en.a1.write-sentences). Look for the Present Simple with routine verbs, times ('at seven o'clock'), and simple sequencing ('then', 'after that'). Note typical Brazilian learner errors without over-penalising: missing subject ('Is very busy'), 'I have 15 years', 'make my homework', missing third-person -s. Evidence above A1: frequency adverbs used accurately, a reason with 'because', a short connected paragraph rather than a list.",seconds:600,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-WR-A2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"writing",band:2,title:"A message about last weekend",prompt:"Write a message to an English-speaking friend. Tell them about something you did last weekend and invite them to do something with you next weekend.",bullets:["where you went and who you were with","what you did and how it was","an invitation: what, when and where to meet"],minWords:50,teacherNotes:"Targets A2 (en.a2.write-message). Look for the Past Simple of common regular and irregular verbs, past time expressions (last Saturday, two days ago), a clear invitation ('Would you like to …?', 'Let's …', 'I'm going to …'), and simple linking (and, but, because, then). A greeting and a closing count towards task achievement. Evidence above A2: past continuous for background, an opinion developed over two sentences, varied linkers.",seconds:900,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-WR-B1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"writing",band:3,title:"A day that didn't go to plan",prompt:"Write a short story for our class website about a day when something went wrong but ended well. It can be real or invented.",bullets:["set the scene: where you were and what was happening","what went wrong and how you felt","what happened in the end and what you learned"],minWords:90,teacherNotes:"Targets B1 (en.b1.write-paragraph). Look for past simple vs past continuous for interrupted actions ('I was waiting for the bus when …'), linking and sequencing (while, suddenly, however, in the end), feelings vocabulary and paragraphing. At B1 the text is generally clear even with errors; range matters more than perfection. Evidence above B1: past perfect for earlier events, varied sentence openings, a reflective ending that ties back to the start.",seconds:1500,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-WR-B2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"writing",band:4,title:"Online or in person?",prompt:"Write an essay with the title: 'Learning online is just as effective as learning in a classroom.' Do you agree? Give your opinion with reasons and examples.",bullets:["at least two advantages of learning online","at least one disadvantage or limitation","your own opinion, with a clear conclusion"],minWords:150,teacherNotes:"Targets B2 (en.b2.argue). Look for a clear position kept throughout, an introduction and a conclusion, paragraphs that each develop one point, and support from examples or consequences. Language: concession (although, while, on the other hand), conditionals, some passive or impersonal forms ('it is often argued that …') and precise vocabulary. A B2 essay deals with the other side; a B1 essay tends to list points. Evidence above B2: nuanced stance, hedging, cohesion that does not depend on 'firstly/secondly'.",seconds:2100,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-WR-C1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"writing",band:5,title:"Tourism: who really benefits?",prompt:"Write an article for an online magazine called 'Tourism: who really benefits?'. Use a place you know (for example Florianópolis, Paraty or your own town) to explore both sides and reach a reasoned view.",bullets:["the benefits tourism brings, and who receives them","the costs, including some that are less obvious","what should change, and why that would be realistic"],minWords:200,teacherNotes:"Targets C1. Look for an engaging opening suited to a magazine, a nuanced rather than one-sided stance, effective hedging and evaluation (arguably, to some extent, it is debatable whether …), advanced structures used naturally (inversion, cleft sentences, mixed conditionals), and a register that is lively but not chatty. Cohesion should come from the development of ideas, not only from linkers. B2-level performance: a clear argument with limited nuance or repetitive structures.",seconds:2700,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-WR-B1-02",version:1,lang:"en",ageGroups:["adult"],skill:"writing",band:3,title:"Email to a colleague: rescheduling",prompt:"You can't go to an important team meeting on Thursday. Write an email to your colleague Marcos.",bullets:["apologise and explain why you can't attend","suggest another day or time to meet","tell Marcos what he needs to know about your part of the project"],minWords:90,teacherNotes:"Targets B1 in a work context (en.b1.write-paragraph). Look for a neutral, polite register (Hi Marcos … Best regards), a clear apology and reason, a concrete suggestion ('Could we …?', 'Would Friday at 10 work for you?') and an update using the present perfect ('I've finished …', 'I haven't received … yet'). Typical errors to note: 'I'm sorry for not can go', 'I'll send it until Friday' (by), 'actually' used to mean 'currently'. Evidence above B1: tactful softening, well-organised paragraphs, precise time expressions.",seconds:1200,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-WR-B2-02",version:1,lang:"en",ageGroups:["adult"],skill:"writing",band:4,title:"A short proposal for your manager",prompt:"Your manager has asked for ideas to improve the way new employees are welcomed in your company. Write a short proposal.",bullets:["the current situation and its main problem","your proposal, with two or three practical steps","the expected benefits, and any costs or risks"],minWords:150,teacherNotes:"Targets B2 (en.b2.argue) in a workplace genre. Look for proposal organisation (headings or clearly signalled sections), a problem – solution – benefit structure, persuasive but measured language ('I would recommend …', 'this would allow …', 'one possible risk is …'), passive and impersonal forms where appropriate, and accurate second conditionals for hypothetical benefits. A B1 response tends to describe rather than propose; a C1 response anticipates objections and quantifies benefits.",seconds:2100,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-SP-PA1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"speaking",band:0,title:"Hello! Tell me about you",prompt:"Say hello. Tell me your name, how old you are and one thing you like.",bullets:["your name","your age","a colour, food or animal you like"],picture:"👋 🙂 🍕 🐱",speakingSeconds:30,teacherNotes:"Targets Pre-A1 (en.pa1.greetings). Keep it warm and slow; model an answer first if needed. Follow-up questions: 'What's your favourite colour?', 'Have you got a pet?', 'Can you count to ten?'. Listen for recognisable single words and formulaic phrases, 'I'm …' for age, and willingness to try. Pauses, gestures and one-word answers are normal at this band. A Brazilian accent is fine as long as the words are intelligible.",seconds:120,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-SP-A1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"speaking",band:1,title:"My family and my home",prompt:"Talk about your family and the place where you live.",bullets:["who is in your family (names, ages, jobs or school)","your house or flat and your favourite room","something you do together"],speakingSeconds:45,teacherNotes:"Targets A1 (en.a1.questions-basic). Follow-up questions: 'What does your mother or father do?', 'Is there a garden or a balcony?', 'What do you do at the weekend?'. Listen for simple Present Simple sentences, there is / there are, possessives, and the ability to answer short personal questions. Interaction matters: can the student understand and respond when a question is repeated slowly? Note typical errors ('my mother have', 'I have 12 years') without interrupting. Accent is not penalised if speech is intelligible.",seconds:180,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-SP-A2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"speaking",band:2,title:"A great day out",prompt:"Tell me about a day out you really enjoyed: a trip, a party or a visit.",bullets:["where you went, when, and who with","what you did, in order","why you enjoyed it"],speakingSeconds:60,teacherNotes:"Targets A2 (en.a2.narrate-past). Follow-up questions: 'What did you eat?', 'How did you get there?', 'Would you like to go again? Why?'. Listen for the Past Simple of common verbs (went, saw, ate), sequencing (first, then, after that) and simple reasons with 'because'. Short pauses to find words are expected; check whether the story can be followed. Accent is fine if intelligible; note an extra final vowel ('worked-e') only if it causes misunderstanding.",seconds:240,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-SP-B1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"speaking",band:3,title:"City or small town?",prompt:"Is it better to live in a big city or in a small town? Give your opinion and explain why.",bullets:["at least two reasons for your opinion","an example from your own experience","one advantage of the other option"],speakingSeconds:90,teacherNotes:"Targets B1 (en.b1.opinions). Follow-up questions: 'What would make your city or town a better place to live?', 'Where would you like to live in ten years? Why?', 'Do you think young people and older people would answer differently?'. Listen for giving and justifying opinions (I think
