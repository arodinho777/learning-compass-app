…, because …, for example …), comparatives, the present perfect for experience, and the ability to keep going despite some hesitation. Interaction: does the student respond to the follow-ups rather than repeating a prepared answer? Intelligibility matters, not accent.",seconds:360,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-SP-B2-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"speaking",band:4,title:"At home or in person?",prompt:"Some people say that working or studying from home is better than going to an office or school. Discuss the advantages and disadvantages and explain your view.",bullets:["advantages for the individual","disadvantages or risks","who it suits and who it does not suit","your view, and what might change your mind"],speakingSeconds:120,teacherNotes:"Targets B2 (en.b2.discuss). Follow-up questions (challenge the student's view to test interaction): 'But isn't it harder to make friends or build a team remotely?', 'If you were in charge of a school or company, what rule would you introduce?', 'What do you think will have changed in ten years?'. Listen for extended, organised turns, concession and contrast, hypothetical language (second conditional), and the ability to respond to and negotiate with a counter-argument. A non-native accent is fine; note only features that affect intelligibility (for example word stress in 'comfortable' or 'develop').",seconds:480,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-SP-C1-01",version:1,lang:"en",ageGroups:["preteen","teen","adult"],skill:"speaking",band:5,title:"Cities of the future",prompt:"How do you think cities will change over the next 20 years? Speculate about the changes, evaluate whether they will be positive, and say what worries you most.",bullets:["two or three likely changes (transport, housing, work or climate)","who might benefit and who might lose out","what you would prioritise if you could decide"],speakingSeconds:150,teacherNotes:"Targets C1. Follow-up questions: 'Isn't that a rather optimistic view?', 'What would cities be like now if they had planned for this twenty years ago?', 'How would you persuade someone who disagrees with you?'. Listen for speculation and hedging (it's likely that …, I'd be surprised if …, arguably), advanced structures used naturally (cleft sentences, inversion, mixed conditionals), precise and idiomatic vocabulary, and flexible interaction (picking up and reshaping the teacher's points). Fluency should be near-effortless, with pauses for thinking rather than for language. Accent is irrelevant unless it affects intelligibility.",seconds:600,status:"approved",author:O,createdAt:"2025-09-01"},{id:"EN-SP-B1-02",version:1,lang:"en",ageGroups:["teen","adult"],skill:"speaking",band:3,title:"Role-play: Your flight is cancelled",prompt:"You are at the airport and your flight to Lisbon has just been cancelled. Go to the airline desk and talk to the agent (your teacher). Explain your situation and get the best solution you can.",bullets:["explain the problem and why it is urgent for you","ask about other flights and options","ask about a hotel or meals if you have to wait","check and confirm the final arrangement before you leave"],speakingSeconds:120,teacherNotes:"Targets B1 functional communication (en.b1.spontaneous). The teacher plays the airline agent and opens with 'Good afternoon, how can I help?'. Add one complication: first offer only a flight tomorrow at 6 am; if the student asks for alternatives, offer a seat today with a connection in Madrid. Possible agent lines: 'I'm afraid there are no direct flights today.', 'Have you checked in any luggage?', 'Is there anything else I can help you with?'. Listen for polite requests (Could you …? Is it possible to …?), explaining with reasons, asking for clarification, checking details ('So the flight leaves at …?') and repairing misunderstandings. Score functional success first: does the student leave with a workable solution? A non-native accent is fine if speech is intelligible.",seconds:480,status:"approved",author:O,createdAt:"2025-09-01"}],z="Flavia Destefanio",Ko=[{id:"ENK-VO-PA1-01",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"food words",band:0,difficulty:-1,objectiveId:"en.pa1.vocab-everyday",topic:"Fruit",format:"picture",prompt:"Pip is hungry! Which one is an apple?",options:["🍐","🍊","🍎"],optionLabels:["pear","orange","apple"],correct:2,feedback:"Apple is 🍎; the pear is the look-alike distractor, and 'apple' is not a cognate, so success shows real word knowledge.",seconds:15,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-11"},{id:"ENK-VO-PA1-02",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"colours",band:0,difficulty:0,objectiveId:"en.pa1.vocab-everyday",topic:"Colours",format:"picture",prompt:"Luna loves blue. Find the blue heart.",options:["💙","💚","💜"],optionLabels:["blue heart","green heart","purple heart"],correct:0,feedback:"Blue is 💙; children often swap blue and green, so note which distractor was chosen.",seconds:15,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-11"},{id:"ENK-VO-PA1-03",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"animals",band:0,difficulty:0,objectiveId:"en.pa1.vocab-everyday",topic:"Animals",format:"match",prompt:"Match the word and the animal.",pairs:[["cow","🐮"],["horse","🐴"],["mouse","🐭"]],feedback:"Mixing up 'horse' and 'mouse' (similar spelling) suggests the child is matching by word shape rather than meaning.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-12"},{id:"ENK-VO-PA1-04",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"numbers",band:0,difficulty:1,objectiveId:"en.pa1.vocab-everyday",topic:"Numbers",format:"picture",prompt:"Caio has eight crayons. Find the number eight.",options:["6️⃣","8️⃣","3️⃣"],optionLabels:["number six","number eight","number three"],correct:1,feedback:"Eight is 8; 'eight' looks and sounds nothing like Portuguese 'oito', so it cannot be guessed from the mother tongue.",seconds:15,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-12"},{id:"ENK-VO-A1-01",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"family words",band:1,difficulty:0,objectiveId:"en.a1.vocab-routine",topic:"Family",format:"picture",prompt:"Which one is a grandfather?",options:["👵","👴","👦"],optionLabels:["grandmother","grandfather","boy"],correct:1,feedback:"Grandfather is 👴; choosing 👵 often reflects the Portuguese avô/avó mix-up, so check grandfather/grandmother.",seconds:20,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-13"},{id:"ENK-VO-A1-02",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"daily routine phrases",band:1,difficulty:-1,objectiveId:"en.a1.vocab-routine",topic:"Daily routine",format:"picture",prompt:"Night night, Caio! Which picture is 'go to bed'?",options:["🚿","🪥","🛏️"],optionLabels:["have a shower","brush your teeth","go to bed"],correct:2,feedback:"'Go to bed' is 🛏️; the other two are bedtime-routine phrases from the same set.",seconds:20,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-13"},{id:"ENK-VO-A1-03",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"school objects",band:1,difficulty:0,objectiveId:"en.a1.vocab-routine",topic:"School",format:"match",prompt:"Luna is ready for school! Match the word and the picture.",pairs:[["ruler","📏"],["scissors","✂️"],["school bag","🎒"]],feedback:"'Ruler' and 'scissors' are often unknown even when 'pencil' and 'book' are secure.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-14"},{id:"ENK-VO-A1-04",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"meals",band:1,difficulty:1,objectiveId:"en.a1.vocab-routine",topic:"Food and meals",format:"mcq",prompt:"It's 7 o'clock in the morning. Luna eats cereal 🥣. It's her ___.",options:["breakfast","lunch","dinner"],correct:0,feedback:"Breakfast is the morning meal; choosing 'lunch' or 'dinner' shows the meal words are not yet linked to times of day.",seconds:25,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-14"},{id:"ENK-VO-A2-01",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"past time expressions",band:2,difficulty:-1,objectiveId:"en.a2.time-expressions",topic:"Time expressions",format:"mcq",prompt:"Today is Sunday. On Saturday, Luna went to the beach. She went to the beach ___.",options:["tomorrow","next week","yesterday"],correct:2,feedback:"Saturday is the day before Sunday, so 'yesterday'; 'tomorrow' is the classic yesterday/tomorrow swap.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-15"},{id:"ENK-VO-A2-02",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"travel words",band:2,difficulty:0,objectiveId:"en.a2.vocab-travel",topic:"Travel",format:"picture",prompt:"The family is going on holiday! Which one is a suitcase?",options:["🧳","🎒","👜"],optionLabels:["suitcase","backpack","handbag"],correct:0,feedback:"Suitcase is 🧳; the backpack and handbag are close-meaning distractors (all are bags).",seconds:20,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-15"},{id:"ENK-VO-A2-03",version:1,lang:"en",ageGroups:["child"],skill:"vocabulary",subskill:"past time expressions",band:2,difficulty:1,objectiveId:"en.a2.time-expressions",topic:"Time expressions",format:"mcq",prompt:"Biscuit came to live with Luna's family two years ___.",options:["last","ago","before"],correct:1,feedback:"'Two years ago' is correct; 'before' and 'last' come from translating Portuguese 'há dois anos' or 'o ano passado'.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-15"},{id:"ENK-GR-PA1-01",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"be: I am",band:0,difficulty:-1,objectiveId:"en.pa1.be-have",topic:"be",format:"mcq",prompt:"Luna says: “I ___ nine.”",options:["is","am","have"],correct:1,feedback:"'I am nine' is correct; 'have' mirrors Portuguese 'tenho nove anos' and is the key error to note.",seconds:20,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-18"},{id:"ENK-GR-PA1-02",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"have got: he/she has",band:0,difficulty:0,objectiveId:"en.pa1.be-have",topic:"have got",format:"mcq",prompt:"Caio ___ got a kite. 🪁",options:["has","have","is"],correct:0,feedback:"'Caio has got' takes third-person 'has'; 'have' is the typical 'He have' error.",seconds:20,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-18"},{id:"ENK-GR-PA1-03",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"word order: adjective + noun",band:0,difficulty:0,objectiveId:"en.pa1.be-have",topic:"be",format:"order",prompt:"Put the words in order. 🦜",tokens:["Pip","is","a","green","bird."],feedback:"'Pip is a green bird.' puts the adjective before the noun; 'a bird green' follows Portuguese word order.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-19"},{id:"ENK-GR-PA1-04",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"be: plural (are)",band:0,difficulty:1,objectiveId:"en.pa1.be-have",topic:"be",format:"mcq",prompt:"Luna and Caio ___ at the park. 🌳",options:["is","am","are"],correct:2,feedback:"Two people take 'are'; choosing 'is' shows the child is agreeing with the nearest name, not the plural subject.",seconds:20,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-19"},{id:"ENK-GR-A1-01",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"third person -s",band:1,difficulty:0,objectiveId:"en.a1.present-simple",topic:"Present Simple",format:"mcq",prompt:"Grandma Rosa ___ her flowers every day. 🌻",options:["water","watering","waters"],correct:2,feedback:"A routine with he/she takes -s: 'waters'; 'water' with no -s is the most common error at this level.",seconds:25,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-20"},{id:"ENK-GR-A1-02",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"there are + plural",band:1,difficulty:0,objectiveId:"en.a1.there-is",topic:"There is / there are",format:"gap",prompt:"There ___ three cats in Grandma Rosa's garden. 🐈🐈🐈",accept:["are"],feedback:"A plural noun takes 'there are'; 'is' (There is three…) or 'have' (from Portuguese 'tem') are the typical errors.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-20"},{id:"ENK-GR-A1-03",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"can't + verb",band:1,difficulty:-1,objectiveId:"en.a1.can-ability",topic:"can / can't",format:"order",prompt:"Put the words in order. 🚲",tokens:["Caio","can't","ride","a","bike."],feedback:"'Caio can't ride a bike.' is subject + can't + verb; putting 'can't' after the verb shows the pattern is not yet secure.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-21"},{id:"ENK-GR-A1-04",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"does-questions",band:1,difficulty:1,objectiveId:"en.a1.present-simple",topic:"Present Simple questions",format:"mcq",prompt:"___ Biscuit like carrots? 🥕",options:["Does","Do","Is"],correct:0,feedback:"Questions about he/she/it use 'Does'; 'Is Biscuit like…' transfers the question pattern of 'be'.",seconds:25,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-21"},{id:"ENK-GR-A2-01",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"irregular past forms",band:2,difficulty:-1,objectiveId:"en.a2.past-simple",topic:"Past Simple",format:"gap",prompt:"Yesterday Luna and Caio ___ to the beach. (go)",accept:["went"],feedback:"'Went' is the irregular past of 'go'; 'goed' shows the -ed rule without the irregular form, and 'go' that the past is not yet marked.",seconds:30,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-22"},{id:"ENK-GR-A2-02",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"comparative -er",band:2,difficulty:0,objectiveId:"en.a2.comparatives",topic:"Comparatives",format:"mcq",prompt:"Biscuit is ___ than Pip. 🐶 🦜",options:["more big","bigger","biggest"],correct:1,feedback:"Short adjectives add -er: 'bigger'; 'more big' translates Portuguese 'mais grande'.",seconds:25,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-22"},{id:"ENK-GR-A2-03",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"going to for plans",band:2,difficulty:1,objectiveId:"en.a2.future-plans",topic:"going to",format:"order",prompt:"Grandma Rosa has eggs and flour. Put the words in order. 🎂",tokens:["We're","going","to","make","a","cake."],feedback:"'We're going to make a cake.' is be + going to + verb; putting 'make' before 'going to' shows the chunk is not yet secure.",seconds:35,a11y:"Read aloud by teacher on request.",status:"approved",author:z,createdAt:"2025-08-22"},{id:"ENK-RE-PA1-01",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"word recognition",band:0,difficulty:-1,objectiveId:"en.pa1.read-words",topic:"Things",format:"picture",prompt:"Read the word. Find the picture.",passageTitle:"One word",passage:"car",options:["🐱","⭐","🚗"],optionLabels:["cat","star","car"],correct:2,feedback:"The word is 'car'; picking 🐱 (cat) means the child is reading only the first letters.",seconds:15,a11y:"Teacher may read the instruction aloud, but not the word.",status:"approved",author:z,createdAt:"2025-08-25"},{id:"ENK-RE-PA1-02",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"sentence–picture match",band:0,difficulty:0,objectiveId:"en.pa1.read-words",topic:"Pets and toys",format:"picture",prompt:"Read. Find the picture.",passageTitle:"At home",passage:"The dog has a ball.",options:["🐶⚽","🐱⚽","🐶🦴"],optionLabels:["a dog with a ball","a cat with a ball","a dog with a bone"],correct:0,feedback:"Both 'dog' and 'ball' must be read; each distractor matches only one of the two words.",seconds:20,a11y:"Teacher may read the instruction aloud, but not the sentence.",status:"approved",author:z,createdAt:"2025-08-25"},{id:"ENK-RE-PA1-03",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"sentence–picture match",band:0,difficulty:0,objectiveId:"en.pa1.read-words",topic:"Numbers and animals",format:"picture",prompt:"Read. Find the picture.",passageTitle:"Luna's pets",passage:"Luna has two fish.",options:["🐟","🐟🐟","🐦🐦"],optionLabels:["one fish","two fish","two birds"],correct:1,feedback:"The child must read both 'two' and 'fish'; choosing 🐟 alone means the number word was missed.",seconds:20,a11y:"Teacher may read the instruction aloud, but not the sentence.",status:"approved",author:z,createdAt:"2025-08-26"},{id:"ENK-RE-PA1-04",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"sentence–picture match",band:0,difficulty:1,objectiveId:"en.pa1.read-words",topic:"Feelings",format:"picture",prompt:"Read. Find the picture.",passageTitle:"How do they feel?",passage:"The girl is sad.",options:["👧😀","👦😢","👧😢"],optionLabels:["a happy girl","a sad boy","a sad girl"],correct:2,feedback:"Choosing 👦😢 means 'girl' was not read; choosing 👧😀 means 'sad' is not yet known.",seconds:20,a11y:"Teacher may read the instruction aloud, but not the sentence.",status:"approved",author:z,createdAt:"2025-08-26"},{id:"ENK-RE-A1-01",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"specific detail",band:1,difficulty:-1,objectiveId:"en.a1.read-short",topic:"Pets and home",format:"picture",prompt:"What does Mum want Luna to do?",passageTitle:"A note from Mum",passage:`Luna,
Biscuit is hungry. Please give him his dinner.
Don't go to the park today. It's raining!
Love, Mum`,options:["🐶🛁","🐶🦴","🐶🌳"],optionLabels:["wash the dog","feed the dog","take the dog to the park"],correct:1,feedback:"'Give him his dinner' means feed the dog; the park is mentioned, but Mum says not to go.",seconds:35,a11y:"Teacher may read the question aloud on request, but not the note.",status:"approved",author:z,createdAt:"2025-08-27"},{id:"ENK-RE-A1-02",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"specific detail",band:1,difficulty:1,objectiveId:"en.a1.read-short",topic:"Days of the week",format:"mcq",prompt:"Which day is the ice cream shop closed?",passageTitle:"A sign at the park",passage:`ICE CREAM 🍦
Open every day, 10 to 5.
Not on Mondays.`,options:["Monday","Sunday","Saturday"],correct:0,feedback:"'Not on Mondays' means the shop is closed on Monday; Sunday or Saturday suggests a guess at a weekend day.",seconds:30,a11y:"Teacher may read the question aloud on request, but not the sign.",status:"approved",author:z,createdAt:"2025-08-27"},{id:"ENK-RE-A1-03",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"specific detail",band:1,difficulty:0,objectiveId:"en.a1.read-short",topic:"My room",format:"mcq",prompt:"Where does Biscuit sleep?",passageTitle:"Luna's bedroom",passage:"My bed is blue. My lamp is on the desk. Biscuit sleeps under my bed.",options:["on the bed","on the desk","under the bed"],correct:2,feedback:"The text says 'under my bed'; 'on the desk' copies the lamp's place and 'on the bed' confuses on/under.",seconds:30,a11y:"Teacher may read the question aloud on request, but not the text.",status:"approved",author:z,createdAt:"2025-08-28"},{id:"ENK-RE-A1-04",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"specific detail",band:1,difficulty:0,objectiveId:"en.a1.read-short",topic:"Abilities",format:"picture",prompt:"What can't Pip do?",passageTitle:"Hello from Pip",passage:"Hi! I'm Pip. I'm a parrot. I can talk and I can dance. I can't swim!",options:["💃","🏊","🗣️"],optionLabels:["dance","swim","talk"],correct:1,feedback:"Pip can't swim; choosing dance or talk means 'can' and 'can't' were not told apart in reading.",seconds:30,a11y:"Teacher may read the question aloud on request, but not the text.",status:"approved",author:z,createdAt:"2025-08-29"},{id:"ENK-RE-A2-01",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"specific detail",band:2,difficulty:-1,objectiveId:"en.a2.read-main",topic:"Notes and messages",format:"mcq",prompt:"What does Grandma Rosa want the children to do?",passageTitle:"A note from Grandma Rosa",passage:`Dear Luna and Caio,
I'm at the market. I'm going to buy some flowers for the garden.
There is a cake in the kitchen for you.
Please give some water to the tomatoes.
I'll be home at four o'clock.
Love, Grandma Rosa`,options:["water the tomatoes","buy some flowers","make a cake"],correct:0,feedback:"The request is 'Please give some water to the tomatoes'; Grandma is buying the flowers herself and the cake is already made.",seconds:45,a11y:"Teacher may read the question aloud on request, but not the note.",status:"approved",author:z,createdAt:"2025-09-01"},{id:"ENK-RE-A2-02",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"specific detail",band:2,difficulty:1,objectiveId:"en.a2.read-main",topic:"Parties and invitations",format:"mcq",prompt:"What do you need to bring to the party?",passageTitle:"A party invitation",passage:`Come to my party! 🎉
It's my 8th birthday on Saturday, from 3 to 6.
The party is in Grandma Rosa's garden.
There is a small pool, so bring your swimsuit!
Please don't bring presents. Mum is making a big chocolate cake.
From Caio`,options:["a cake","a swimsuit","a present"],correct:1,feedback:"The text says 'bring your swimsuit'; 'a present' means 'don't bring presents' was missed, and Mum is making the cake.",seconds:45,a11y:"Teacher may read the question aloud on request, but not the invitation.",status:"approved",author:z,createdAt:"2025-09-01"},{id:"ENK-RE-A2-03",version:1,lang:"en",ageGroups:["child"],skill:"reading",subskill:"main idea",band:2,difficulty:0,objectiveId:"en.a2.read-main",topic:"Holidays",format:"mcq",prompt:"Why did Luna write this postcard?",passageTitle:"A postcard from the beach",passage:`Hi Pip!
We're on holiday at the beach. 🏖️
It's sunny and hot every day.
Yesterday Caio found a big shell.
Biscuit ran into the sea and got very wet!
See you on Sunday. Love, Luna`,options:["to invite Pip to a party","to ask Pip for a shell","to tell Pip about her holiday"],correct:2,feedback:"The postcard is about the holiday as a whole; the shell is only one detail, so choosing it shows detail and main idea are being confused.",seconds:45,a11y:"Teacher may read the question aloud on request, but not the postcard.",status:"approved",author:z,createdAt:"2025-09-02"},{id:"ENK-LI-PA1-01",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"word recognition",band:0,difficulty:-1,objectiveId:"en.pa1.listen-words",topic:"Animals",format:"picture",prompt:"Listen. Touch the picture.",passageTitle:"At the park",passage:"[N] Where's the duck?",options:["🐶","🦆","🐔"],optionLabels:["dog","duck","chicken"],correct:1,feedback:"The word is 'duck'; choosing 🐶 (dog) suggests the child caught only the first sound.",seconds:15,a11y:"Audio can be replayed.",status:"approved",author:z,createdAt:"2025-09-03"},{id:"ENK-LI-PA1-02",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"numbers",band:0,difficulty:0,objectiveId:"en.pa1.listen-words",topic:"Numbers",format:"picture",prompt:"Listen. Touch the number.",passageTitle:"Counting with Pip",passage:"[N] Number nine.",options:["5️⃣","1️⃣","9️⃣"],optionLabels:["number five","number one","number nine"],correct:2,feedback:"'Nine' and 'five' share the same vowel sound, so 5 is the likely confusion.",seconds:15,a11y:"Audio can be replayed.",status:"approved",author:z,createdAt:"2025-09-03"},{id:"ENK-LI-PA1-03",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"colours",band:0,difficulty:0,objectiveId:"en.pa1.listen-words",topic:"Colours",format:"picture",prompt:"Listen. Touch the picture.",passageTitle:"At school",passage:"[N] The green book, please.",options:["📗","📘","📕"],optionLabels:["green book","blue book","red book"],correct:0,feedback:"'Green' is 📗; picking 📘 shows the common green/blue mix-up.",seconds:15,a11y:"Audio can be replayed.",status:"approved",author:z,createdAt:"2025-09-04"},{id:"ENK-LI-PA1-04",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"word recognition",band:0,difficulty:1,objectiveId:"en.pa1.listen-words",topic:"Toys",format:"picture",prompt:"Listen. Touch the picture.",passageTitle:"At the beach",passage:"[N] Look! A kite!",options:["🪁","🚲","🛴"],optionLabels:["kite","bike","scooter"],correct:0,feedback:"'Kite' rhymes with 'bike', so choosing 🚲 shows the child heard the vowel but not the first sound.",seconds:15,a11y:"Audio can be replayed.",status:"approved",author:z,createdAt:"2025-09-04"},{id:"ENK-LI-A1-01",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"numbers",band:1,difficulty:0,objectiveId:"en.a1.listen-info",topic:"Age and numbers",format:"picture",prompt:"Listen. How old is Biscuit?",passageTitle:"At home",passage:`[F] Caio, how old is Biscuit?
[M] He's six. And Pip is two!`,options:["2️⃣","7️⃣","6️⃣"],optionLabels:["two","seven","six"],correct:2,feedback:"Biscuit is six; 2 is Pip's age from the same line and 7 is another number starting with /s/.",seconds:25,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"approved",author:z,createdAt:"2025-09-08"},{id:"ENK-LI-A1-02",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"places",band:1,difficulty:-1,objectiveId:"en.a1.listen-info",topic:"Places",format:"picture",prompt:"Listen. Where is Caio?",passageTitle:"On the phone",passage:`[F] Hello! Is Caio at home?
[M] No, he isn't. He's at the beach with Dad.`,options:["🏠","🏖️","🏫"],optionLabels:["home","beach","school"],correct:1,feedback:"Caio is at the beach; choosing 🏠 means the child heard 'home' in the question but missed 'No, he isn't'.",seconds:25,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"approved",author:z,createdAt:"2025-09-08"},{id:"ENK-LI-A1-03",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"times",band:1,difficulty:0,objectiveId:"en.a1.listen-info",topic:"Times",format:"picture",prompt:"Listen. What time is the party?",passageTitle:"Party plans",passage:`[F] Dad, what time is Caio's party?
[M] At four o'clock, on Saturday.`,options:["5️⃣","2️⃣","4️⃣"],optionLabels:["five o'clock","two o'clock","four o'clock"],correct:2,feedback:"The party is at four o'clock; 'four' and 'five' both start with /f/, so 5 is the likely slip.",seconds:25,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"approved",author:z,createdAt:"2025-09-09"},{id:"ENK-LI-A1-04",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"spelled names",band:1,difficulty:1,objectiveId:"en.a1.listen-info",topic:"Names and the alphabet",format:"mcq",prompt:"Listen. What is his name?",passageTitle:"A new friend",passage:`[M] Hi, Luna! I'm Ben.
[F] Hi! How do you spell that?
[M] B, E, N.`,options:["Ben","Bin","Ban"],correct:0,feedback:"English E is said /iː/; choosing 'Bin' or 'Ban' shows the letter names E, I and A are still confused (very common for Portuguese speakers).",seconds:25,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"approved",author:z,createdAt:"2025-09-10"},{id:"ENK-LI-A2-01",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"specific detail",band:2,difficulty:-1,objectiveId:"en.a2.listen-detail",topic:"Food and drink",format:"mcq",prompt:"What does Luna want to drink?",passageTitle:"At the birthday party",passage:`[M] Luna, what do you want to drink? Orange juice or lemonade?
[F] Lemonade, please.
[M] And Caio?
[F] Caio likes orange juice. I don't!`,options:["orange juice","water","lemonade"],correct:2,feedback:"Luna asks for lemonade; 'orange juice' is Caio's drink, heard later in the dialogue.",seconds:35,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"approved",author:z,createdAt:"2025-09-11"},{id:"ENK-LI-A2-02",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"specific detail",band:2,difficulty:1,objectiveId:"en.a2.listen-detail",topic:"At the beach",format:"mcq",prompt:"What did Caio do at the beach?",passageTitle:"Back from the beach",passage:`[M] Hi, Luna! Where did you go yesterday?
[F] We went to the beach, Pip!
[M] Did Caio swim in the sea?
[F] No, he didn't. He made a big sandcastle. Biscuit swam with Dad!`,options:["He made a sandcastle.","He swam in the sea.","He played with Biscuit."],correct:0,feedback:"Caio made a sandcastle; 'swam in the sea' appears in Pip's question and in what Biscuit did, so the child must catch 'No, he didn't'.",seconds:40,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"approved",author:z,createdAt:"2025-09-11"},{id:"ENK-LI-A2-03",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"specific detail",band:2,difficulty:0,objectiveId:"en.a2.listen-detail",topic:"Plans in the garden",format:"mcq",prompt:"What are they going to plant?",passageTitle:"In Grandma Rosa's garden",passage:`[F] Caio, can you help me in the garden tomorrow?
[M] Yes, Grandma! What are we going to do?
[F] We're going to plant carrots. Then we can pick some strawberries.
[M] Yummy! I love strawberries!`,options:["strawberries","carrots","tomatoes"],correct:1,feedback:"They will plant carrots and only pick strawberries; choosing strawberries means 'plant' and 'pick' were not told apart.",seconds:40,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"approved",author:z,createdAt:"2025-09-12"},{id:"ENK-GR-A2-04",version:1,lang:"en",ageGroups:["child"],skill:"grammar",subskill:"did-questions",band:2,difficulty:0,objectiveId:"en.a2.past-questions",topic:"Past Simple questions",format:"mcq",prompt:"Caio: “___ you see the dolphins yesterday?” Luna: “Yes, I did!” 🐬",options:["Did","Do","Are"],correct:0,feedback:"'Yesterday' and the answer 'Yes, I did' both signal 'Did'; choosing 'Do' shows the question is not yet marked for the past.",seconds:30,a11y:"Read aloud by teacher on request.",status:"in_review",author:z,createdAt:"2025-09-19",changeNote:"New item, waiting for a second review before it is used in tests."},{id:"ENK-LI-A1-05",version:1,lang:"en",ageGroups:["child"],skill:"listening",subskill:"specific detail",band:1,difficulty:0,objectiveId:"en.a1.listen-info",topic:"Birthday presents",format:"picture",prompt:"Listen. What does Luna want?",passageTitle:"Birthday wishes",passage:`[M] Luna, do you want a piano for your birthday?
[F] No, thanks, Dad. I want a guitar!`,options:["🎹","🎸","🥁"],optionLabels:["piano","guitar","drum"],correct:1,feedback:"Luna wants a guitar; choosing 🎹 means the child took the first object heard and missed 'No, thanks'.",seconds:25,a11y:"Audio can be replayed; teacher may read the question aloud.",status:"in_review",author:z,createdAt:"2025-09-19",changeNote:"New item, waiting for a second review before it is used in tests."}],Jo=[{id:"ENK-WR-PA1-01",version:1,lang:"en",ageGroups:["child"],skill:"writing",band:0,title:"Grandma Rosa's garden",picture:"🌳 🌻 🐝 🐈 🍅 ☀️",prompt:"Look at Grandma Rosa's garden. Write the names of 3 things you can see.",bullets:["Write one word for each thing.","You can write more than 3 if you like!"],minWords:3,teacherNotes:"Look for: retrieval of the English word (tree, flower, bee, cat, tomato, sun). Spelling is not the main criterion — accept recognisable sound-based spellings such as 'flawer' or 'tri'. Note letter formation and whether the child writes Portuguese words (gato, árvore) or English. Literacy is still developing at this age, in Portuguese too: if the child cannot yet write independently, let them say the words and scribe for them, and record this as an accommodation rather than as a writing score.",seconds:180,status:"approved",author:z,createdAt:"2025-09-01"},{id:"ENK-WR-A1-01",version:1,lang:"en",ageGroups:["child"],skill:"writing",band:1,title:"My favourite thing",picture:"🧸 🐶 🍕",prompt:"Tell Pip about your favourite toy, pet or food. Write 2 or 3 sentences.",bullets:["What is it?","What is it like? (colour, size…)","Why do you like it?"],minWords:15,teacherNotes:"Look for: simple complete sentences with a subject and a verb (I have…, It is…, I like…), basic adjectives and joining with 'and'. Portuguese-influenced patterns such as 'a dog brown', 'He have' or a missing subject ('Is very cute') are normal at this stage — note them as next steps rather than penalising heavily. Spelling is not the main criterion: judge whether a reader understands the message. Writing speed and stamina vary a lot at 8–10; if the child clearly has more to say, ask orally and note the difference between what they can say and what they can write.",seconds:480,status:"approved",author:z,createdAt:"2025-09-01"},{id:"ENK-WR-A2-01",version:1,lang:"en",ageGroups:["child"],skill:"writing",band:2,title:"A message to Pip about my weekend",picture:"📅 ⚽ 🍦 🎮",prompt:"Pip wants to know about your weekend! Write a short message to Pip.",bullets:['Start with "Hi Pip!"',"Where did you go? Who was with you?","What did you do? What was the best part?","Say goodbye at the end."],minWords:30,teacherNotes:"Look for: a greeting and a sign-off, connected sentences (and, but, then, because) and the past simple of common verbs (went, played, ate, saw, was). Forms such as 'goed' or 'I go to the beach yesterday' show the past tense is emerging — note them. Spelling is not the main criterion; judge clarity and how ideas are connected. Many children of this age can say far more than they can write: if the message is very short, invite the child to tell you about the weekend and note the oral version separately (do not score it as writing).",seconds:720,status:"approved",author:z,createdAt:"2025-09-01"},{id:"ENK-SP-PA1-01",version:1,lang:"en",ageGroups:["child"],skill:"speaking",band:0,title:"What's this?",picture:"🐶 🍎 ⚽ 🚗 🌳 ⭐",prompt:"Look at the pictures with your teacher. What's this?",speakingSeconds:30,teacherNotes:"Warm up with 'Hello! What's your name?'. Point to each picture and ask 'What's this?'. Accept single words; 'It's a…' is a bonus. Gentle follow-ups: 'What colour is it?', 'Is it big or small?', 'Do you like apples?' (yes/no is fine). Listen for: English word retrieval, the start of 'It's a…', and understanding of simple questions. Praise every attempt; if the child answers in Portuguese, model the English word, let them repeat it, and note that it was prompted.",seconds:180,status:"approved",author:z,createdAt:"2025-09-01"},{id:"ENK-SP-A1-01",version:1,lang:"en",ageGroups:["child"],skill:"speaking",band:1,title:"My family and my house",picture:"👨‍👩‍👧‍👦 🏠",prompt:"Tell me about your family or your house.",bullets:["Who is in your family?","What is your house like?"],speakingSeconds:45,teacherNotes:"Let the child choose family or house. Gentle follow-ups: 'Have you got a brother or a sister? How old is he/she?', 'How many bedrooms are there in your house?', 'What's in your bedroom?'. Listen for: short sentences with be / have got / there is, family and house words, 'I am nine' (not 'I have nine years'), his/her (often confused by Portuguese speakers) and 'There are two bedrooms' (not 'Have two bedrooms'). Families differ — accept any family make-up, and if the child seems uncomfortable move to the house or a favourite room.",seconds:300,status:"approved",author:z,createdAt:"2025-09-01"},{id:"ENK-SP-A2-01",version:1,lang:"en",ageGroups:["child"],skill:"speaking",band:2,title:"Tell the story",picture:"🪁 🌬️ 🌳 🪜",prompt:"Look at the pictures. Last Saturday, Luna and Caio went to the park. Tell the story!",bullets:["What happened first?","What happened then?","How did the story end?"],speakingSeconds:60,teacherNotes:"Give the child about 20 seconds to look first (the story: a kite, a windy day, the kite gets stuck in a tree, Dad gets it down with a ladder). Gentle follow-ups: 'What happened to the kite?', 'How did Luna feel?', 'What did Dad do?'. Listen for: past simple forms (went, was, flew, got stuck, climbed), sequencing words (first, then, after that, in the end) and linking with and / but / because. Telling the story in the present tense is a lower-band performance — note it, but do not correct mid-story; if the child stalls, point to the next picture rather than supplying words.",seconds:300,status:"approved",author:z,createdAt:"2025-09-01"}],D="Flavia Destefanio",xe="Audio can be replayed twice; transcript available as accommodation.",$e="Text can be enlarged or shown in high contrast; do not read it aloud (this item assesses reading).",_n="Keyboard alternative: select an item on the left, then its match on the right (Tab/Enter).",Ws="Keyboard alternative: tap or press Enter on the words in sequence instead of dragging.",gi="On-screen accent buttons (á, â, ã, é, ê, í, ó, ô, õ, ú, ç) should be available for typed answers.",Yo=[{id:"PT-VO-PA1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"colours",band:0,difficulty:-1,objectiveId:"pt.pa1.vocab-basic",topic:"Colours",format:"match",prompt:"Match each Portuguese colour word to its English meaning.",pairs:[["vermelho","red"],["azul","blue"],["verde","green"],["amarelo","yellow"]],feedback:"Basic colour words: vermelho = red, azul = blue, verde = green, amarelo = yellow.",seconds:40,a11y:`${_n} No colour swatches are used, so the item is colour-blind safe.`,status:"approved",author:D,createdAt:"2025-08-04"},{id:"PT-VO-PA1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"numbers 1-50",band:0,difficulty:0,objectiveId:"pt.pa1.vocab-basic",topic:"Numbers",format:"mcq",prompt:"What number is “quinze”?",options:["50","5","15","13"],correct:2,feedback:"Quinze is 15; learners often confuse it with cinco (5), cinquenta (50) and treze (13).",seconds:20,status:"approved",author:D,createdAt:"2025-08-04"},{id:"PT-VO-A1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"family members",band:1,difficulty:1,objectiveId:"pt.a1.vocab-daily",topic:"Family",format:"mcq",prompt:`Choose the correct word.
A mãe da minha mãe é a minha ___.`,options:["avó","tia","avô","irmã"],correct:0,feedback:"The mother of your mother is your avó (grandmother, open ó); avô (closed ô) means grandfather.",seconds:30,status:"approved",author:D,createdAt:"2025-08-05"},{id:"PT-VO-A1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"routine collocations",band:1,difficulty:-1,objectiveId:"pt.a1.vocab-daily",topic:"Daily routine",format:"match",prompt:"Match each verb to the words that complete a daily routine phrase.",pairs:[["escovar","os dentes"],["tomar","banho"],["pegar","o ônibus"],["fazer","o almoço"]],feedback:"Fixed routine phrases: escovar os dentes, tomar banho, pegar o ônibus, fazer o almoço; only tomar combines with banho.",seconds:50,a11y:_n,status:"approved",author:D,createdAt:"2025-08-06"},{id:"PT-VO-A1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"days of the week",band:1,difficulty:0,objectiveId:"pt.a1.vocab-daily",topic:"Days of the week",format:"gap",prompt:`Write the missing day of the week.
Eu trabalho de segunda a sexta. No sábado e no ___, eu descanso.`,accept:["domingo"],feedback:"The weekend is sábado and domingo; the working week runs from segunda-feira to sexta-feira.",seconds:35,status:"approved",author:D,createdAt:"2025-08-06"},{id:"PT-VO-A2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"shops and services",band:2,difficulty:-1,objectiveId:"pt.a2.vocab-city",topic:"Shops and services",format:"mcq",prompt:`Escolha a melhor palavra.
Estou com dor de cabeça. Vou à ___ comprar um remédio.`,options:["livraria","padaria","papelaria","farmácia"],correct:3,feedback:"Medicine is bought at a farmácia; livraria is a bookshop (a false friend of “library”, which is biblioteca).",seconds:30,status:"approved",author:D,createdAt:"2025-08-07"},{id:"PT-VO-A2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"places in the city",band:2,difficulty:0,objectiveId:"pt.a2.vocab-city",topic:"City places",format:"match",prompt:"Ligue cada lugar ao que você faz lá.",pairs:[["padaria","comprar pão francês"],["Correios","mandar uma encomenda"],["feira","comprar frutas e verduras"],["rodoviária","pegar um ônibus para outra cidade"]],feedback:"Each place matches its typical service: bread at the padaria, parcels at the Correios, fresh produce at the feira, intercity buses at the rodoviária.",seconds:60,a11y:_n,status:"approved",author:D,createdAt:"2025-08-08"},{id:"PT-VO-A2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"payments vocabulary",band:2,difficulty:1,objectiveId:"pt.a2.vocab-city",topic:"Payments (Pix)",format:"gap",prompt:`Complete com uma palavra.
Quero pagar com Pix. Você pode me passar a sua ___ Pix?`,accept:["chave"],feedback:"A Pix transfer is sent to a “chave Pix” (Pix key), such as a phone number or an e-mail address.",seconds:35,status:"approved",author:D,createdAt:"2025-08-11"},{id:"PT-VO-A2-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"shopping verbs",band:2,difficulty:0,objectiveId:"pt.a2.vocab-city",topic:"Shopping",format:"mcq",prompt:`Escolha a melhor palavra.
Comprei uma camiseta, mas ela ficou pequena. Vou ___ por um tamanho maior.`,options:["mudar","trocar","cambiar","devolver"],correct:1,feedback:"Trocar is the verb for exchanging an item (trocar por um tamanho maior); mudar means to change or move, cambiar is Spanish, and devolver (return) does not fit “por um tamanho maior”.",seconds:35,status:"approved",author:D,createdAt:"2025-08-11"},{id:"PT-VO-B1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"fixed expressions",band:3,difficulty:0,objectiveId:"pt.b1.vocab-expressions",topic:"Everyday expressions",format:"mcq",prompt:`Escolha a opção correta.
O chuveiro quebrou no domingo, mas o zelador ___ e consertou rapidinho.`,options:["fez um jeito","tomou um jeito","deu um jeito","pôs um jeito"],correct:2,feedback:"“Dar um jeito” means to find a way to sort something out; “tomar jeito” exists but means to shape up, and the other combinations are not used.",seconds:40,status:"approved",author:D,createdAt:"2025-08-12"},{id:"PT-VO-B1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"idiomatic expressions",band:3,difficulty:1,objectiveId:"pt.b1.vocab-expressions",topic:"Brazilian idioms",format:"match",prompt:"Ligue cada expressão ao seu significado.",pairs:[["pagar mico","passar vergonha"],["pisar na bola","decepcionar alguém por causa de um erro"],["ficar de boa","ficar tranquilo"],["quebrar um galho","ajudar a resolver um problema"]],feedback:"Common informal expressions: pagar mico = be embarrassed, pisar na bola = let someone down, ficar de boa = stay relaxed, quebrar um galho = help someone out.",seconds:60,a11y:_n,status:"approved",author:D,createdAt:"2025-08-13"},{id:"PT-VO-B1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"false friends",band:3,difficulty:-1,objectiveId:"pt.b1.vocab-expressions",topic:"False friends",format:"mcq",prompt:`Escolha a palavra correta.
A minha cunhada está ___ de cinco meses. O bebê nasce em março.`,options:["grávida","embaraçada","esquisita","engravidada"],correct:0,feedback:"Grávida means pregnant; embaraçada is a false friend for Spanish speakers (embarazada) and in Portuguese means embarrassed or tangled, while esquisita means strange and engravidada is not used as an adjective.",seconds:35,status:"approved",author:D,createdAt:"2025-08-13"},{id:"PT-VO-B1-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"verb + noun collocations",band:3,difficulty:0,objectiveId:"pt.b1.vocab-expressions",topic:"Collocations",format:"gap",prompt:`Complete com uma palavra.
Cheguei atrasado pela terceira vez na semana, e a professora ___ a paciência comigo.`,accept:["perdeu"],feedback:"The collocation is “perder a paciência” (to lose one’s patience), here in the pretérito perfeito: perdeu.",seconds:40,status:"approved",author:D,createdAt:"2025-08-14"},{id:"PT-VO-B2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"formal register",band:4,difficulty:-1,objectiveId:"pt.b2.vocab-precision",topic:"Register in e-mails",format:"mcq",prompt:`Escolha a opção mais adequada para um e-mail formal.
Prezada Sra. Lima, ___ que o seu pedido de reembolso foi aprovado.`,options:["a gente queria te contar","tô passando pra avisar","olha só, fica sabendo","temos o prazer de informar"],correct:3,feedback:"A formal e-mail to a customer needs formal wording (“temos o prazer de informar”); the other options are informal spoken Portuguese.",seconds:40,status:"approved",author:D,createdAt:"2025-08-15"},{id:"PT-VO-B2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"false friends",band:4,difficulty:1,objectiveId:"pt.b2.vocab-precision",topic:"False friends",format:"mcq",prompt:`Qual é o significado de “pretendemos” nesta frase?
“Pretendemos abrir uma loja em Recife no ano que vem.”`,options:["Fingimos que vamos abrir","Temos a intenção de abrir","Já decidimos não abrir","Somos obrigados a abrir"],correct:1,feedback:"Pretender means to intend or plan; the English verb “pretend” corresponds to fingir.",seconds:40,status:"approved",author:D,createdAt:"2025-08-15"},{id:"PT-VO-B2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"word formation (-ção)",band:4,difficulty:0,objectiveId:"pt.b2.vocab-precision",topic:"Word formation",format:"gap",prompt:`Complete com o substantivo formado a partir do verbo entre parênteses.
A prefeitura anunciou a ___ (construir) de um novo hospital na zona leste.`,accept:["construção","construcao"],feedback:"The noun from construir is construção (suffix -ção, feminine, agreeing with “a”).",seconds:45,a11y:gi,status:"approved",author:D,createdAt:"2025-08-15"},{id:"PT-GR-PA1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"ter for age",band:0,difficulty:-1,objectiveId:"pt.a1.presente",topic:"Ter (age)",format:"mcq",prompt:`Choose the correct word.
Eu ___ 25 anos.`,options:["sou","tenho","estou","tem"],correct:1,feedback:"Portuguese uses ter for age (Eu tenho 25 anos), not ser or estar as in English “I am 25”; tem is the form for ele/ela/você.",seconds:20,status:"approved",author:D,createdAt:"2025-08-18"},{id:"PT-GR-PA1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"ser for origin",band:0,difficulty:0,objectiveId:"pt.a1.ser-estar",topic:"Ser (origin)",format:"order",prompt:"Put the words in order to make a sentence.",tokens:["Eu","sou","da","Alemanha."],feedback:"Origin uses ser + de, and de + a contracts to da before a feminine country name: Eu sou da Alemanha.",seconds:30,a11y:Ws,status:"approved",author:D,createdAt:"2025-08-18"},{id:"PT-GR-A1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"irregular present (fazer)",band:1,difficulty:0,objectiveId:"pt.a1.presente",topic:"Presente: irregular verbs",format:"mcq",prompt:`Choose the correct word.
Nos fins de semana, eu ___ esporte com meus amigos.`,options:["fazo","faz","faço","fazer"],correct:2,feedback:"Fazer is irregular in the eu form: eu faço (not *fazo); faz is the form for ele/ela/você.",seconds:25,status:"approved",author:D,createdAt:"2025-08-19"},{id:"PT-GR-A1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"estar for temporary states",band:1,difficulty:-1,objectiveId:"pt.a1.ser-estar",topic:"Ser vs estar",format:"gap",prompt:`Complete with the correct form of ser or estar.
O Marcos não vai à aula hoje porque ___ doente.`,accept:["está"],feedback:"Temporary states such as being ill take estar: ele está doente (“esta” without the accent is a different word, “this”).",seconds:30,a11y:gi,status:"approved",author:D,createdAt:"2025-08-20"},{id:"PT-GR-A1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"preposition + article contractions",band:1,difficulty:1,objectiveId:"pt.a1.ser-estar",topic:"Contractions (do, da, no, na)",format:"error",prompt:"Find the incorrect part of the sentence.",options:["A minha casa","é perto","de o mercado","e da padaria."],correct:2,correction:"do mercado",feedback:"De + o must contract to do (perto do mercado), just as de + a becomes da in “da padaria”.",seconds:45,status:"approved",author:D,createdAt:"2025-08-20"},{id:"PT-GR-A2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"irregular perfeito (ir)",band:2,difficulty:-1,objectiveId:"pt.a2.preterito-perfeito",topic:"Pretérito perfeito: ir/ser",format:"mcq",prompt:`Escolha a forma correta.
Ontem eu ___ ao cinema com meus amigos.`,options:["vou","ia","foi","fui"],correct:3,feedback:"A completed event yesterday needs the pretérito perfeito of ir in the eu form: fui (foi is for ele/ela/você).",seconds:25,status:"approved",author:D,createdAt:"2025-08-21"},{id:"PT-GR-A2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"a gente + verb agreement",band:2,difficulty:1,objectiveId:"pt.a2.preterito-perfeito",topic:"A gente + pretérito perfeito",format:"error",prompt:"Encontre a parte errada da frase.",options:["No sábado passado,","a gente fomos","à feira","e comprou muitas frutas."],correct:1,correction:"a gente foi",feedback:"“A gente” takes a third-person singular verb in standard Portuguese: a gente foi (consistent with “comprou”).",seconds:50,status:"approved",author:D,createdAt:"2025-08-22"},{id:"PT-GR-A2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"ir + infinitive",band:2,difficulty:0,objectiveId:"pt.a2.ir-futuro",topic:"Futuro com ir",format:"gap",prompt:`Complete com o verbo ir.
Nas férias de julho, nós ___ viajar para Salvador.`,accept:["vamos","iremos"],feedback:"Plans are expressed with ir in the present + infinitive: nós vamos viajar (iremos is also correct but more formal).",seconds:30,status:"approved",author:D,createdAt:"2025-08-25"},{id:"PT-GR-A2-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"pronoun placement with ir + infinitive",band:2,difficulty:0,objectiveId:"pt.a2.ir-futuro",topic:"Pronoun placement (Brazilian)",format:"order",prompt:"Coloque as palavras na ordem correta.",tokens:["A","gente","vai","te","esperar","na","portaria."],feedback:"In Brazilian Portuguese the object pronoun goes before the infinitive: a gente vai te esperar na portaria.",seconds:50,a11y:Ws,status:"approved",author:D,createdAt:"2025-08-25"},{id:"PT-GR-B1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"imperfeito for past habits",band:3,difficulty:-1,objectiveId:"pt.b1.imperfeito",topic:"Imperfeito vs perfeito",format:"mcq",prompt:`Escolha a forma correta.
Quando eu era criança, eu ___ na casa da minha avó todo domingo.`,options:["almoçava","almocei","almoço","almoce"],correct:0,feedback:"Repeated past habits (todo domingo, quando eu era criança) take the imperfeito: almoçava.",seconds:30,status:"approved",author:D,createdAt:"2025-08-26"},{id:"PT-GR-B1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"imperfeito for ongoing background actions",band:3,difficulty:1,objectiveId:"pt.b1.imperfeito",topic:"Imperfeito vs perfeito",format:"error",prompt:"Encontre a parte errada da frase.",options:["A luz acabou","no prédio inteiro","enquanto eu","fiz o jantar."],correct:3,correction:"fazia o jantar.",feedback:"An action in progress when something else happened takes the imperfeito: enquanto eu fazia o jantar.",seconds:50,status:"approved",author:D,createdAt:"2025-08-27"},{id:"PT-GR-B1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"subjuntivo after verbs of hope",band:3,difficulty:0,objectiveId:"pt.b1.subjuntivo-presente",topic:"Presente do subjuntivo",format:"gap",prompt:`Complete com o verbo entre parênteses.
Comprei este livro para você. Espero que você ___ (gostar)!`,accept:["goste"],feedback:"“Espero que” expresses a wish and requires the presente do subjuntivo: goste.",seconds:35,status:"approved",author:D,createdAt:"2025-08-28"},{id:"PT-GR-B1-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"subjuntivo after tomara que",band:3,difficulty:0,objectiveId:"pt.b1.subjuntivo-presente",topic:"Presente do subjuntivo",format:"order",prompt:"Coloque as palavras na ordem correta.",tokens:["Tomara","que","não","chova","no","sábado."],feedback:"“Tomara que” is followed by the presente do subjuntivo (chova), with não placed before the verb.",seconds:40,a11y:Ws,status:"approved",author:D,createdAt:"2025-08-28"},{id:"PT-GR-B2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"imperfeito do subjuntivo in hypotheses",band:4,difficulty:-1,objectiveId:"pt.b2.subjuntivo-avancado",topic:"Se + imperfeito do subjuntivo",format:"mcq",prompt:`Escolha a forma correta.
Se eu ___ mais tempo livre, faria um curso de culinária baiana.`,options:["tivesse","tiver","tenho","teria"],correct:0,feedback:"A hypothetical condition paired with the conditional (faria) takes the imperfeito do subjuntivo: se eu tivesse.",seconds:35,status:"approved",author:D,createdAt:"2025-08-29"},{id:"PT-GR-B2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"futuro do subjuntivo in time clauses",band:4,difficulty:0,objectiveId:"pt.b2.subjuntivo-avancado",topic:"Quando + futuro do subjuntivo",format:"gap",prompt:`Complete com a forma correta do verbo entre parênteses.
Quando você ___ (estar) em Salvador, não deixe de provar o acarajé.`,accept:["estiver"],feedback:"A future time clause introduced by quando takes the futuro do subjuntivo: quando você estiver.",seconds:40,status:"approved",author:D,createdAt:"2025-08-29"},{id:"PT-GR-B2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"futuro do subjuntivo in conditions (irregular)",band:4,difficulty:1,objectiveId:"pt.b2.subjuntivo-avancado",topic:"Se + futuro do subjuntivo",format:"error",prompt:"Encontre a parte errada da frase.",options:["Se vocês poder","chegar mais cedo,","a gente começa","o churrasco ao meio-dia."],correct:0,correction:"Se vocês puderem",feedback:"A condition about the future with se takes the futuro do subjuntivo, and poder is irregular: se vocês puderem.",seconds:45,status:"approved",author:D,createdAt:"2025-08-29"},{id:"PT-RE-PA1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"understanding signs",band:0,difficulty:0,objectiveId:"pt.pa1.read-words",topic:"Signs",format:"mcq",passageTitle:"Sign on a bakery door",passage:`PADARIA PÃO QUENTE
Aberta todos os dias, das 6h às 20h.
Para entrar: PUXE.
Proibido fumar.`,prompt:"You want to go into the bakery. What do you do with the door?",options:["Push it","Pull it","Knock on it","Wait for someone to open it"],correct:1,feedback:"Puxe (from puxar) means “pull”; it is a false friend for English and Spanish speakers, who often read it as “push” (empurre).",seconds:30,a11y:$e,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-RE-PA1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"reading prices",band:0,difficulty:-1,objectiveId:"pt.pa1.read-words",topic:"Food and drink",format:"mcq",passageTitle:"Juice bar price list",passage:`SUCOS E AÇAÍ
Suco de laranja – R$ 8
Suco de abacaxi – R$ 9
Água de coco – R$ 7
Açaí na tigela – R$ 15`,prompt:"You want orange juice. How much is it?",options:["R$ 7","R$ 9","R$ 15","R$ 8"],correct:3,feedback:"Laranja means orange, and suco de laranja costs R$ 8 (abacaxi is pineapple, coco is coconut).",seconds:30,a11y:$e,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-RE-A1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"specific detail",band:1,difficulty:-1,objectiveId:"pt.a1.read-short",topic:"Health and plans",format:"mcq",passageTitle:"WhatsApp message",passage:"Oi, Júlia! Tudo bem? Hoje não posso ir à academia com você. Estou com dor de garganta e vou ficar em casa. Vamos amanhã, às sete da manhã? Beijos, Camila",prompt:"Why can’t Camila go to the gym today?",options:["She has a sore throat.","She has to work late.","Júlia is sick.","The gym is closed today."],correct:0,feedback:"Camila writes “Estou com dor de garganta” (I have a sore throat), so she is staying at home.",seconds:60,a11y:$e,status:"approved",author:D,createdAt:"2025-09-02"},{id:"PT-RE-A1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"scanning a menu",band:1,difficulty:0,objectiveId:"pt.a1.read-short",topic:"Food",format:"mcq",passageTitle:"Restaurant menu",passage:`Restaurante Sabor Mineiro
Prato do dia (de segunda a sexta): arroz, feijão, frango grelhado e salada – R$ 25
Sábado: feijoada completa – R$ 38
Sobremesa: pudim de leite – R$ 9
Não abrimos aos domingos.`,prompt:"When can you eat feijoada at this restaurant?",options:["Every day","From Monday to Friday","On Saturdays","On Sundays"],correct:2,feedback:"The menu offers feijoada only on sábado (Saturday), and the restaurant is closed on domingos (Sundays).",seconds:60,a11y:$e,status:"approved",author:D,createdAt:"2025-09-02"},{id:"PT-RE-A1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"understanding a notice",band:1,difficulty:1,objectiveId:"pt.a1.read-short",topic:"Home and building",format:"mcq",passageTitle:"Notice in an apartment building",passage:`AVISO
O elevador do prédio está quebrado hoje. Por favor, usem a escada. O técnico vem amanhã de manhã para consertar. Desculpem o transtorno!
Seu Antônio – portaria`,prompt:"What does the notice ask residents to do today?",options:["Call the technician","Use the stairs","Wait for the lift tomorrow morning","Go to the front desk"],correct:1,feedback:"“Usem a escada” means “use the stairs”: the lift is broken and the technician only comes tomorrow.",seconds:60,a11y:$e,status:"approved",author:D,createdAt:"2025-09-03"},{id:"PT-RE-A2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"specific detail",band:2,difficulty:0,objectiveId:"pt.a2.read-main",topic:"Renting a room",format:"mcq",passageTitle:"Anúncio: quarto para alugar",passage:"Alugo quarto mobiliado em apartamento de dois quartos, a cinco minutos a pé do metrô Vila Madalena. O quarto tem cama de casal, armário e uma janela grande. A cozinha e o banheiro são compartilhados. O aluguel é de R$ 1.400 por mês, com água, luz e internet incluídas. Prefiro estudante ou pessoa que trabalha fora o dia todo. Não aceito animais. Interessados, mandem mensagem para a Renata.",prompt:"Segundo o anúncio, o que está incluído no valor de R$ 1.400?",options:["Só o quarto e os móveis","Uma vaga na garagem","Um banheiro só para você","Água, luz e internet"],correct:3,feedback:"The ad says the rent comes “com água, luz e internet incluídas”; the bathroom is shared and no parking is mentioned.",seconds:90,a11y:$e,status:"approved",author:D,createdAt:"2025-09-03"},{id:"PT-RE-A2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"sequence of events",band:2,difficulty:-1,objectiveId:"pt.a2.read-main",topic:"Travel",format:"mcq",passageTitle:"E-mail para a turma de português",passage:"Oi, pessoal! Estou em Salvador desde sexta-feira e estou adorando. No sábado, fui à praia do Porto da Barra e vi o pôr do sol mais bonito da minha vida. Ontem, visitei o Pelourinho com um guia e comi acarajé pela primeira vez. Era muito apimentado, mas eu gostei! Amanhã vou fazer um passeio de barco até a Ilha de Itaparica. Até a próxima aula! Abraços, Tomás",prompt:"O que o Tomás fez ontem?",options:["Foi à praia do Porto da Barra.","Fez um passeio de barco.","Visitou o Pelourinho e comeu acarajé.","Chegou a Salvador."],correct:2,feedback:"“Ontem” goes with visiting the Pelourinho and eating acarajé; the beach was on Saturday and the boat trip is tomorrow.",seconds:90,a11y:$e,status:"approved",author:D,createdAt:"2025-09-04"},{id:"PT-RE-A2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"specific detail",band:2,difficulty:0,objectiveId:"pt.a2.read-main",topic:"Festa junina",format:"mcq",passageTitle:"Aviso da escola",passage:`FESTA JUNINA DO COLÉGIO PRIMAVERA
Sábado, 22 de junho, das 14h às 20h, na quadra do colégio.
Vai ter quadrilha, pescaria, pipoca, pamonha e muita música!
Cada aluno deve trazer um prato doce ou salgado para a mesa comunitária. A entrada é gratuita, mas as barracas de comida e as brincadeiras são pagas.
Venha com traje típico!
O dinheiro arrecadado vai para a reforma da biblioteca.`,prompt:"O que cada aluno precisa levar para a festa?",options:["Um prato doce ou salgado","Dinheiro para a entrada","Um livro para a biblioteca","Pipoca e pamonha"],correct:0,feedback:"The notice says “Cada aluno deve trazer um prato doce ou salgado”; entry is free and the money raised goes to the library.",seconds:90,a11y:$e,status:"approved",author:D,createdAt:"2025-09-05"},{id:"PT-RE-A2-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"main idea",band:2,difficulty:1,objectiveId:"pt.a2.read-main",topic:"Transport and routine",format:"mcq",passageTitle:"Blog do Jonas: minha nova rotina",passage:"Quando me mudei para São Paulo, eu ia de carro para o trabalho todos os dias. Eu passava quase duas horas no trânsito! Há três meses, comecei a usar o metrô e uma bicicleta compartilhada. Agora levo quarenta minutos, gasto menos dinheiro e ainda faço exercício. No metrô, aproveito para ler ou estudar português. Não vendi o carro, mas agora ele fica na garagem durante a semana.",prompt:"Qual é a ideia principal do texto?",options:["O autor quer vender o carro porque o trânsito é ruim.","O autor mudou a forma de ir ao trabalho e está mais satisfeito.","O metrô de São Paulo é caro e lotado.","O autor prefere dirigir porque aproveita para estudar."],correct:1,feedback:"The whole post contrasts the old car commute with the new metro-and-bike routine, which is faster, cheaper and healthier.",seconds:100,a11y:$e,status:"approved",author:D,createdAt:"2025-09-08"},{id:"PT-RE-B1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"inferring the writer’s opinion",band:3,difficulty:-1,objectiveId:"pt.b1.read-inference",topic:"Shopping at the feira",format:"mcq",passageTitle:"Blog da Cris: por que eu vou à feira",passage:"Toda quarta-feira, a rua de trás do meu prédio se transforma. Às seis da manhã, as barracas já estão montadas e os feirantes começam a gritar os preços. Muita gente me pergunta por que eu não faço tudo no supermercado, que é mais prático e abre até tarde. É verdade: na feira não tem ar-condicionado, às vezes falta troco e é preciso chegar cedo para encontrar as melhores frutas. Mas é lá que o seu Zé guarda para mim o abacaxi mais doce, que a dona Lúcia me ensina a escolher mandioca e que eu experimento um caqui antes de comprar. No supermercado, ninguém sabe o meu nome.",prompt:"O que a autora mais valoriza na feira?",options:["Os preços mais baixos","O horário de funcionamento","A relação com os feirantes","O conforto do lugar"],correct:2,feedback:"The details about seu Zé and dona Lúcia and the closing line “ninguém sabe o meu nome” imply she values the personal relationships.",seconds:140,a11y:$e,status:"approved",author:D,createdAt:"2025-09-09"},{id:"PT-RE-B1-02",version:1,lang:"pt",ageGroups:["adult"],skill:"reading",subskill:"inferring implied meaning",band:3,difficulty:1,objectiveId:"pt.b1.read-inference",topic:"Work e-mail",format:"mcq",passageTitle:"E-mail de uma colega",passage:`Oi, Daniel, tudo bem?
Obrigada por me mandar a apresentação para a reunião de sexta com o cliente. Ficou muito bonita, e os gráficos estão bem claros e fáceis de entender. Só fiquei com uma dúvida: os números de vendas de agosto são os mesmos do relatório que a Fernanda mandou na semana passada? Lá, o total era bem diferente. Talvez valha a pena você dar uma olhada antes de enviarmos o material para o cliente. Se quiser, posso revisar com você amanhã de manhã, antes do almoço.
Abraço,
Patrícia`,prompt:"O que a Patrícia quer dizer, na verdade?",options:["Que a apresentação está pronta para o cliente.","Que a Fernanda errou o relatório.","Que ela não pode ir à reunião de sexta.","Que provavelmente há um erro nos números."],correct:3,feedback:"Behind the polite praise, the question about the August figures and the suggestion to check them signal that Daniel’s numbers are probably wrong.",seconds:140,a11y:$e,status:"approved",author:D,createdAt:"2025-09-09"},{id:"PT-RE-B1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"inference in narrative",band:3,difficulty:1,objectiveId:"pt.b1.read-inference",topic:"Daily commute",format:"mcq",passageTitle:"Crônica: o ônibus das 7h10",passage:"Todo dia pego o mesmo ônibus, o das 7h10. Já sei que a senhora de chapéu vai descer na terceira parada e que o rapaz de fone de ouvido vai dormir até o ponto final. A gente nunca conversou, mas, de certa forma, somos vizinhos. Na semana passada, o motorista de sempre não apareceu. O novo dirigia bem, era simpático, dava bom-dia para todo mundo. Mesmo assim, o ônibus parecia outro. A senhora de chapéu reclamou do ar-condicionado, o rapaz acordou duas vezes. Na segunda-feira, quando o seu Raimundo voltou, ninguém disse nada. Mas eu juro que vi a senhora sorrir.",prompt:"O que o texto sugere sobre os passageiros?",options:["Eles se sentiam mais à vontade com o motorista de sempre.","Eles não gostavam do motorista novo porque ele dirigia mal.","Eles reclamaram com a empresa de ônibus.","Eles ficaram amigos depois daquela semana."],correct:0,feedback:"Although the new driver was good and friendly, the passengers were uneasy that week and the lady smiles when seu Raimundo returns, implying they were more comfortable with him.",seconds:150,a11y:$e,status:"approved",author:D,createdAt:"2025-09-10"},{id:"PT-RE-B1-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"identifying opinion",band:3,difficulty:0,objectiveId:"pt.b1.read-inference",topic:"School and technology",format:"mcq",passageTitle:"Opinião: celular na sala de aula",passage:"Este ano, a minha escola proibiu o uso do celular durante as aulas. No começo, eu achei a regra exagerada. Afinal, usamos o celular para pesquisar, para tirar foto do quadro e até para estudar inglês com aplicativos. Mas, depois de dois meses, preciso admitir algumas coisas. Os intervalos ficaram mais barulhentos, no bom sentido: as pessoas voltaram a conversar, jogar bola e até jogar baralho. Eu também presto mais atenção nas explicações. Ainda acho que os professores poderiam liberar o celular em atividades específicas, com regras claras. Proibir tudo é fácil; ensinar a usar bem é que é difícil.",prompt:"Qual é a opinião do autor sobre a proibição do celular?",options:["Ele continua totalmente contra a regra.","Ele vê vantagens, mas acha que a regra poderia ser mais flexível.","Ele acha que o celular deveria ser proibido também nos intervalos.","Ele acredita que os professores não sabem usar o celular."],correct:1,feedback:"The writer admits benefits (more conversation, more attention) but still wants the phone allowed for specific activities with clear rules.",seconds:140,a11y:$e,status:"approved",author:D,createdAt:"2025-09-10"},{id:"PT-RE-B2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"paragraph function",band:4,difficulty:-1,objectiveId:"pt.b2.read-organisation",topic:"City news",format:"mcq",passageTitle:"Notícia: novas ciclovias no centro",passage:`A prefeitura de Campo Verde anunciou ontem a construção de 30 quilômetros de novas ciclovias na região central até o fim do próximo ano. Segundo a secretária de Mobilidade, o objetivo é reduzir o trânsito e incentivar formas de transporte menos poluentes.
A medida, no entanto, não agradou a todos. Comerciantes da Avenida Central temem perder vagas de estacionamento e, consequentemente, clientes. “Quem vem fazer compras aqui vem de carro”, afirma o dono de uma loja de calçados.
Especialistas lembram que experiências semelhantes em outras capitais tiveram resultados variados. Em alguns casos, o movimento no comércio aumentou depois de um ano; em outros, as ciclovias ficaram vazias por falta de integração com o transporte público. Para a urbanista Ana Ribeiro, o sucesso do projeto vai depender menos da quilometragem e mais da conexão com estações de metrô e terminais de ônibus.`,prompt:"Qual é a função do terceiro parágrafo no texto?",options:["Apresentar a decisão da prefeitura.","Mostrar a reação dos comerciantes.","Trazer uma visão mais equilibrada, com base em outras experiências.","Defender que o projeto seja cancelado."],correct:2,feedback:"Paragraph 1 gives the decision, paragraph 2 the objection, and paragraph 3 balances both with evidence from other cities and an expert view.",seconds:200,a11y:$e,status:"approved",author:D,createdAt:"2025-09-11"},{id:"PT-RE-B2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"writer’s stance",band:4,difficulty:0,objectiveId:"pt.b2.read-organisation",topic:"Money and technology",format:"mcq",passageTitle:"Opinião: “Só Pix, moça”",passage:`Outro dia, um vendedor de água de coco na praia me olhou com pena quando tirei uma nota de vinte reais do bolso. “Só Pix, moça”, disse, apontando para um QR code plastificado preso ao carrinho. Paguei com o celular, claro, em três segundos. E fiquei pensando.
Não há dúvida de que o Pix facilitou a vida de milhões de pessoas: é gratuito, instantâneo e chegou a lugares onde o cartão nunca chegou. Ainda assim, cada vez que vejo uma placa de “não aceitamos dinheiro”, lembro da minha avó, que não tem celular e jamais pediria ajuda a um desconhecido para pagar uma conta. A inovação é bem-vinda, desde que ninguém seja deixado para trás. Por enquanto, guardo a nota de vinte. Vai que alguém ainda aceite.`,prompt:"Qual é a posição da autora sobre o Pix?",options:["Ela acha que o Pix deveria ser proibido no comércio.","Ela prefere o Pix porque é mais rápido que o dinheiro.","Ela acredita que a avó deveria aprender a usar o celular.","Ela reconhece as vantagens, mas se preocupa com quem fica sem acesso."],correct:3,feedback:"The concession “Não há dúvida de que…” followed by “Ainda assim…” and “desde que ninguém seja deixado para trás” shows qualified support with concern for exclusion.",seconds:210,a11y:$e,status:"approved",author:D,createdAt:"2025-09-12"},{id:"PT-RE-B2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"reading",subskill:"irony and implied meaning",band:4,difficulty:1,objectiveId:"pt.b2.read-organisation",topic:"Neighbours and apartment life",format:"mcq",passageTitle:"Crônica: o grupo do condomínio",passage:`O grupo de WhatsApp do meu prédio foi criado, segundo a mensagem de boas-vindas, “para facilitar a comunicação entre os vizinhos”. Missão cumprida, de certa forma: hoje sei exatamente quem deixa o lixo no corredor, quem estaciona torto na garagem e quem ouve pagode às onze da noite de uma terça-feira. Sei também que o morador do 302 escreve tudo em letras maiúsculas e que a síndica responde às reclamações com um único emoji de mãos juntas, que ninguém sabe se significa “obrigada” ou “paciência”.
Antes do grupo, a gente se cumprimentava no elevador. Agora, a gente se cumprimenta no elevador e finge que não leu a última discussão. É um avanço, sem dúvida. Só não sei bem em que direção.`,prompt:"Quando o cronista diz “É um avanço, sem dúvida. Só não sei bem em que direção”, ele quer dizer que:",options:["ele duvida que o grupo tenha melhorado a convivência.","o grupo melhorou muito a convivência no prédio.","ele quer sair do prédio por causa das discussões.","a síndica deveria controlar melhor o grupo."],correct:0,feedback:"The closing lines are ironic: the group produced more information and awkwardness, not better relations, so the writer doubts it is real progress.",seconds:210,a11y:$e,status:"approved",author:D,createdAt:"2025-09-12"},{id:"PT-LI-PA1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"prices",band:0,difficulty:-1,objectiveId:"pt.pa1.listen-words",topic:"Numbers and prices",format:"mcq",passageTitle:"At the bakery",passage:`[F] Bom dia! Quanto custa o pão de queijo?
[M] Cinco reais.`,prompt:"How much is the cheese bread (pão de queijo)?",options:["R$ 15","R$ 50","R$ 5","R$ 9"],correct:2,feedback:"The baker says “cinco reais” (R$ 5); quinze is 15 and cinquenta is 50.",seconds:30,a11y:xe,status:"approved",author:D,createdAt:"2025-09-15"},{id:"PT-LI-PA1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"names and countries",band:0,difficulty:0,objectiveId:"pt.pa1.listen-words",topic:"Introductions",format:"mcq",passageTitle:"Meeting a classmate",passage:`[F] Oi! Eu sou a Marina. Qual é o seu nome?
[M] Oi, Marina! Meu nome é Kofi. Eu sou de Gana.
[F] Prazer, Kofi!`,prompt:"Where is Kofi from?",options:["Brazil","Ghana","Angola","Portugal"],correct:1,feedback:"Kofi says “Eu sou de Gana”, and Gana is the Portuguese name for Ghana.",seconds:30,a11y:xe,status:"approved",author:D,createdAt:"2025-09-15"},{id:"PT-LI-A1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"announcements",band:1,difficulty:-1,objectiveId:"pt.a1.listen-info",topic:"Metro",format:"mcq",passageTitle:"On the metro",passage:`[N] Próxima estação: Consolação.
[N] Desembarque pelo lado esquerdo do trem.`,prompt:"Which side of the train do passengers get off?",options:["The right side","Both sides","The back of the train","The left side"],correct:3,feedback:"The announcement says “lado esquerdo” (left side); direito would be right.",seconds:35,a11y:xe,status:"approved",author:D,createdAt:"2025-09-16"},{id:"PT-LI-A1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"days and times",band:1,difficulty:1,objectiveId:"pt.a1.listen-info",topic:"Doctor’s appointment",format:"mcq",passageTitle:"Booking a doctor’s appointment",passage:`[F] Clínica Bem-Estar, bom dia!
[M] Bom dia. Eu queria marcar uma consulta com a doutora Paula.
[F] Ela tem horário na quarta-feira, às duas e meia da tarde. Pode ser?
[M] Pode, sim. Obrigado!`,prompt:"When is the appointment?",options:["Wednesday at 2:30 pm","Thursday at 2:30 pm","Wednesday at 12:30 pm","Wednesday at 3:30 pm"],correct:0,feedback:"Quarta-feira is Wednesday (quinta is Thursday) and “duas e meia da tarde” is 2:30 pm.",seconds:45,a11y:xe,status:"approved",author:D,createdAt:"2025-09-16"},{id:"PT-LI-A1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"places and directions",band:1,difficulty:0,objectiveId:"pt.a1.listen-info",topic:"Places",format:"mcq",passageTitle:"At the shopping mall",passage:`[F] Com licença, onde fica o banheiro?
[M] Fica no segundo andar, ao lado da livraria.
[F] Obrigada!`,prompt:"Where is the bathroom?",options:["On the 1st floor, next to the bookshop","On the 2nd floor, next to the library","On the 2nd floor, next to the bookshop","On the 10th floor, next to the pharmacy"],correct:2,feedback:"“Segundo andar” is the 2nd floor and livraria is a bookshop (a false friend: library is biblioteca).",seconds:40,a11y:xe,status:"approved",author:D,createdAt:"2025-09-17"},{id:"PT-LI-A2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"prices and quantities",band:2,difficulty:0,objectiveId:"pt.a2.listen-detail",topic:"At the feira",format:"mcq",passageTitle:"Na feira",passage:`[M] Bom dia! Quanto está o mamão?
[F] O mamão está seis reais cada, mas o senhor leva três por quinze.
[M] Então vou levar três. E a banana?
[F] A dúzia está oito reais.
[M] Hoje só o mamão, obrigado.`,prompt:"Quanto o cliente vai pagar?",options:["R$ 18","R$ 15","R$ 23","R$ 6"],correct:1,feedback:"He takes three papayas at the deal price “três por quinze” (R$ 15) and does not buy bananas.",seconds:60,a11y:xe,status:"approved",author:D,createdAt:"2025-09-18"},{id:"PT-LI-A2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"specific detail",band:2,difficulty:-1,objectiveId:"pt.a2.listen-detail",topic:"Paying the bill",format:"mcq",passageTitle:"Pagando a conta no restaurante",passage:`[F] Moço, pode trazer a conta, por favor?
[M] Claro. A senhora vai pagar no cartão?
[F] Vou, no débito.
[M] Ih, desculpe, a maquininha está sem sinal hoje. Só estamos aceitando Pix ou dinheiro.
[F] Ah, então vou fazer um Pix. Qual é a chave?`,prompt:"Como a cliente vai pagar a conta?",options:["No cartão de débito","Em dinheiro","No cartão de crédito","Com Pix"],correct:3,feedback:"She first wants to use her debit card, but the card machine has no signal, so she says “vou fazer um Pix”.",seconds:60,a11y:xe,status:"approved",author:D,createdAt:"2025-09-18"},{id:"PT-LI-A2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"past events",band:2,difficulty:0,objectiveId:"pt.a2.listen-detail",topic:"Weekend and football",format:"mcq",passageTitle:"Conversa sobre o fim de semana",passage:`[F] E aí, Pedro, o que você fez no fim de semana?
[M] No sábado, fui ao jogo do Bahia com o meu primo. O estádio estava lotado!
[F] Que legal! E no domingo?
[M] No domingo choveu muito, então fiquei em casa e assisti a uma série.
[F] E o Bahia ganhou?
[M] Ganhou de dois a um!`,prompt:"O que o Pedro fez no domingo?",options:["Ficou em casa e assistiu a uma série.","Foi ao estádio com o primo.","Jogou futebol na chuva.","Visitou o primo."],correct:0,feedback:"Pedro went to the match on Saturday; on Sunday it rained, so he stayed at home and watched a series.",seconds:70,a11y:xe,status:"approved",author:D,createdAt:"2025-09-19"},{id:"PT-LI-A2-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"making arrangements",band:2,difficulty:1,objectiveId:"pt.a2.listen-detail",topic:"Plans",format:"mcq",passageTitle:"Combinando um cinema",passage:`[M] Oi, Lu! Vamos ao cinema na sexta? Vai estrear aquele filme brasileiro.
[F] Sexta não dá. Vou jantar com a minha mãe, é aniversário dela.
[M] E no sábado?
[F] Sábado de manhã eu tenho aula, mas à tarde eu posso.
[M] Então combinado: sábado, às quatro, no shopping.`,prompt:"Quando eles vão ao cinema?",options:["Na sexta à noite","No sábado de manhã","No sábado à tarde","No domingo à tarde"],correct:2,feedback:"Friday is ruled out and she has class on Saturday morning, so they agree on Saturday at four in the afternoon.",seconds:70,a11y:xe,status:"approved",author:D,createdAt:"2025-09-19"},{id:"PT-LI-B1-01",version:1,lang:"pt",ageGroups:["adult"],skill:"listening",subskill:"speaker attitude",band:3,difficulty:0,objectiveId:"pt.b1.listen-gist",topic:"Working from home",format:"mcq",passageTitle:"Conversa no trabalho: home office",passage:`[M] E aí, Carla, tá gostando de trabalhar de casa três dias por semana?
[F] Olha, no começo eu adorei. Sem trânsito, sem pegar metrô lotado...
[M] Mas?
[F] Mas agora sinto falta das pessoas, sabe? Em casa eu acabo trabalhando até mais tarde e quase não converso com ninguém.
[M] Então você prefere voltar pro escritório todo dia?
