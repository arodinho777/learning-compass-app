unch plate with picture cards, describe it, then compare it with a typical school lunch in their country.",adult:"Feira role-play: learners shop for fruit and vegetables at a classroom feira with picture cards and prices, then describe what their family usually eats."},reinforcement:"Revise numbers and articles from Pre-A1.",successCriterion:"Uses at least 15 target words accurately in a short description of their day, family and meals.",followUpCheck:"In week 4, describe a picture sequence showing someone else's day.",prerequisites:["pt.pa1.vocab-basic"]},{id:"pt.a1.read-short",lang:"pt",band:1,skill:"reading",title:"Understand short simple texts: notes, menus, messages",languageFocus:"Short texts: bilhetes, cardápios, mensagens de WhatsApp, avisos de condomínio; key words such as hoje, amanhã, horário, grátis, reserva, a partir de.",activities:{teen:"Menu budget challenge: students read a lanchonete menu and decide what to order with a fixed budget, answering questions about prices and ingredients.",adult:"Building notices: learners read condominium notices (water cut, residents' meeting, pool rules) and decide what they need to do and when."},reinforcement:"Revise numbers, times and food vocabulary.",successCriterion:"Answers at least 4 of 5 detail questions correctly about a new short text.",followUpCheck:"In week 4, a new text type (a WhatsApp group chat or a gym timetable).",prerequisites:["pt.pa1.read-words"]},{id:"pt.a1.listen-info",lang:"pt",band:1,skill:"listening",title:"Catch numbers, prices, times and places",languageFocus:"Numbers up to 1,000 and prices (R$ 12,50 — 'doze e cinquenta'), times (às três e meia, meio-dia, meia-noite), days, place names, spelling names letter by letter, and 'meia' for six in phone numbers.",activities:{teen:"The price is right: students hear the prices of everyday items, write them down, then guess whether each price is fair before checking the real one.",adult:"Departures board: learners listen to bus-station or airport announcements and complete a departures board with times, gates and destinations."},reinforcement:"Daily number dictation including phone numbers.",successCriterion:"Notes at least 8 of 10 key details correctly from two short recordings heard twice.",followUpCheck:"In week 4, a new recording (a delivery call or a clinic appointment reminder).",prerequisites:["pt.pa1.listen-words"]},{id:"pt.a1.questions-basic",lang:"pt",band:1,skill:"speaking",title:"Ask and answer simple personal questions",languageFocus:"Personal questions: Como você se chama? De onde você é? Onde você mora? O que você faz? Você tem filhos? Você gosta de…?; question words o que, onde, quando, quantos, qual; rising intonation for yes / no questions; answering by repeating the verb (Gosto! / Tenho, sim).",activities:{teen:"Find someone who: students circulate asking questions from a grid ('Você gosta de futebol?', 'Você tem cachorro?'), collect names and report the results.",adult:"Churrasco small talk: learners role-play meeting people at a barbecue, each with a secret identity card, and find two things they have in common through questions."},reinforcement:"Recycle ser / estar and presente forms.",successCriterion:"In a 3-minute exchange, asks 5 personal questions and answers 5 with relevant short answers, with correct verb forms in most turns.",followUpCheck:"In week 4, a live conversation with a new interlocutor (another teacher or a Brazilian friend on video).",prerequisites:["pt.pa1.greetings"],milestone:"Can ask and answer simple questions about personal details"},{id:"pt.a2.preterito-perfeito",lang:"pt",band:2,skill:"grammar",title:"Use the pretérito perfeito to describe completed past events",languageFocus:"Pretérito perfeito of regular verbs (falei, comi, abri; falamos) and common irregulars (fui, tive, fiz, estive, pude, vi, dei, quis, trouxe); time markers ontem, anteontem, semana passada, há dois dias.",activities:{teen:"Weekend photo story: students show three photos from their weekend (real or invented) and classmates ask 'O que você fez?' and 'Com quem você foi?' about each one.",adult:"Travel blog: learners use a map and photos to tell what they did on a trip to a Brazilian city, then write a five-sentence post and add comments to two classmates' posts."},reinforcement:"Revise presente endings to contrast present -o with past -ei / -i patterns (falo / falei, como / comi).",successCriterion:"Uses the pretérito perfeito correctly in at least 8 of 10 obligatory contexts, including at least 3 irregular verbs.",followUpCheck:"In week 4, describe a different past event (a party or a festa junina) that needs new verbs.",prerequisites:["pt.a1.presente"],milestone:"Can describe completed past events"},{id:"pt.a2.ir-futuro",lang:"pt",band:2,skill:"grammar",title:"Talk about plans with ir + infinitivo",languageFocus:"ir + infinitivo (Vou viajar, Vamos comer fora, Eles vão se mudar); time expressions amanhã, no fim de semana, no mês que vem, no ano que vem, daqui a pouco; the present for near-future arrangements (Amanhã eu trabalho cedo).",activities:{teen:"Bucket list: students list things they are going to do in the next year and compare with a partner to find two shared plans to present.",adult:"Weekend planner: learners plan a weekend in Rio or São Paulo with a partner from a list of events, negotiating activities, timings and budget."},reinforcement:"Revise the presente of ir and the days of the week.",successCriterion:"Talks about at least 5 plans with correct ir + infinitivo forms and suitable time expressions.",followUpCheck:"In week 4, a new planning task (a holiday or a work event).",prerequisites:["pt.a1.presente"]},{id:"pt.a2.vocab-city",lang:"pt",band:2,skill:"vocabulary",title:"Use words for the city, shopping, transport and services",languageFocus:"City places (padaria, farmácia, posto, praça, esquina), shopping (provador, tamanho, troco, parcelar, à vista), transport (ônibus, metrô, ponto, passagem, corrida de aplicativo) and services (correio, banco, lotérica, cartório).",activities:{teen:"Map trail: students follow written directions on a city map to find places, collecting a new word at each stop and using it in a sentence.",adult:"Errand day: learners plan a morning of errands (paying a bill, buying medicine, catching a bus) and act out each step at a different classroom station."},reinforcement:"Revise numbers and prices from A1.",successCriterion:"Uses at least 12 target words appropriately across two city or shopping role-plays.",followUpCheck:"In week 5, a new role-play (returning an item to a shop or asking for directions).",prerequisites:["pt.a1.vocab-daily"]},{id:"pt.a2.read-main",lang:"pt",band:2,skill:"reading",title:"Find the main idea and details in short everyday texts",languageFocus:"Main idea and detail in short texts (anúncios, e-mails, posts, notícias curtas): skimming titles and first lines; scanning for dates, places and prices.",activities:{teen:"Classified match: students skim a page of ads to find the best option for different people (a student, a family with a dog), then scan for prices and conditions.",adult:"News bites: learners read short local news items, choose the best headline for each and answer detail questions."},reinforcement:"Revise city and shopping vocabulary.",successCriterion:"Identifies the main idea of 2 short texts and answers at least 5 of 6 detail questions correctly.",followUpCheck:"In week 4, a new text type (a restaurant review or an events listing).",prerequisites:["pt.a1.read-short"],milestone:"Can understand the main point and key details of short everyday texts"},{id:"pt.a2.listen-detail",lang:"pt",band:2,skill:"listening",title:"Listen for detail in short everyday conversations",languageFocus:"Everyday dialogues: ordering at a padaria, asking for directions, booking an appointment; reduced forms in natural speech (tá, pra, cê, tô) and fillers (então, aí).",activities:{teen:"Order the scene: students listen to a dialogue at a lanchonete and put picture cards of what happens in sequence, then act out a version with a different order.",adult:"Follow the route: learners listen to someone giving directions from a metro station and trace the route on a real map of a Brazilian neighbourhood, noting landmarks."},reinforcement:"Revise numbers, times and city vocabulary.",successCriterion:"Answers at least 5 of 6 detail questions from a dialogue heard twice at natural but clear speed.",followUpCheck:"In week 4, a new dialogue in a different setting (a taxi ride or a hotel reception).",prerequisites:["pt.a1.listen-info"]},{id:"pt.a2.narrate-past",lang:"pt",band:2,skill:"speaking",title:"Narrate a simple sequence of past events",languageFocus:"Narration with the pretérito perfeito and sequencers (primeiro, depois, então, aí, no final), plus connectors (e, mas, porque, por isso); listener reactions (Nossa! E aí?).",activities:{teen:"Story dice: students roll story cubes and build a past story together, each adding one event with a sequencer.",adult:"Misunderstanding story: learners tell the story of a memorable trip or a funny misunderstanding in Brazil; listeners react and ask two follow-up questions."},reinforcement:"Revise irregular past forms and time markers.",successCriterion:"Tells a story of at least 5 connected events using at least 3 sequencers, with past forms correct in most clauses.",followUpCheck:"In week 5, retell a new picture story or anecdote to a different listener.",prerequisites:["pt.a1.questions-basic","pt.a1.presente"],milestone:"Can narrate a simple sequence of past events"},{id:"pt.a2.write-message",lang:"pt",band:2,skill:"writing",title:"Write a short message with connected sentences",languageFocus:"Informal messages and short emails: Oi, tudo bem? / Abraços / Beijos / Até mais; inviting, thanking and apologising (Desculpa, não vou poder…); connectors e, mas, porque, então.",activities:{teen:"Group-chat planner: students write messages in a mock group chat organising a get-together, replying to each other's suggestions until a plan is agreed.",adult:"Note to the landlord: learners write a short message reporting a problem in the flat or rescheduling a visit, then compare how formal each version sounds."},reinforcement:"Revise ir + infinitivo for plans and the pretérito perfeito for news.",successCriterion:"Writes a 40–60 word message covering all 3 required points, with at least 2 connectors and an appropriate opening and closing.",followUpCheck:"In week 5, a new message prompt (thanking a host or cancelling a reservation).",prerequisites:["pt.a1.presente","pt.a1.read-short"],milestone:"Can write a short connected message about everyday matters"},{id:"pt.b1.imperfeito",lang:"pt",band:3,skill:"grammar",title:"Contrast the pretérito imperfeito and the pretérito perfeito",languageFocus:"Pretérito imperfeito for past habits, descriptions and background (Quando eu era criança, morava…; Estava chovendo quando…) vs the pretérito perfeito for completed events; irregular imperfeito forms (era, tinha, vinha, punha).",activities:{teen:"Childhood photo: students bring a childhood photo, describe what life was like then (imperfeito) and tell one special event (perfeito).",adult:"Then and now: learners compare life in their home town 20 years ago with today, then tell a story set in that time with background and events."},reinforcement:"Revise irregular pretérito perfeito forms.",successCriterion:"Chooses the correct past tense in at least 8 of 10 contexts in a story or description.",followUpCheck:"In week 5, a new narrative prompt (a power cut or an unexpected visit).",prerequisites:["pt.a2.preterito-perfeito","pt.a2.narrate-past"]},{id:"pt.b1.subjuntivo-presente",lang:"pt",band:3,skill:"grammar",title:"Use the presente do subjuntivo for wishes, advice and opinions",languageFocus:"Presente do subjuntivo after wishes, advice and opinion triggers: Espero que…, Quero que…, Sugiro que…, É importante que…, Não acho que…; regular forms built from the eu form (falo → fale) and irregulars (seja, esteja, vá, tenha, faça, saiba, queira).",activities:{teen:"Wish cards: students write birthday or New Year wish cards for classmates (Espero que você…) and advice cards for a new student joining the school.",adult:"Newcomer guide: learners co-write a short guide for foreigners arriving in Brazil ('É importante que você tenha CPF…', 'Sugiro que você abra uma conta…') and debate which tips matter most."},reinforcement:"Revise presente do indicativo eu forms, since the subjunctive is built from them.",successCriterion:"Uses the presente do subjuntivo correctly after trigger expressions in at least 6 of 8 cases.",followUpCheck:"In week 5, a new advice or wishes task (for a friend starting a new job).",prerequisites:["pt.a1.presente","pt.a2.ir-futuro"]},{id:"pt.b1.vocab-expressions",lang:"pt",band:3,skill:"vocabulary",title:"Use common Brazilian expressions and collocations",languageFocus:"Common Brazilian expressions and collocations: dar uma olhada, fazer questão, pegar o ônibus, tomar uma decisão, ficar com saudade, valer a pena, tanto faz, de boa, dar certo / dar errado.",activities:{teen:"Expression charades: students act out expressions for the group to guess, then use three of them in a short dialogue.",adult:"Expression spotting: learners watch a short clip from a Brazilian series or podcast, note the expressions they hear and discuss meaning and register."},reinforcement:"Revise A2 city and daily vocabulary inside new collocations.",successCriterion:"Uses at least 8 target expressions appropriately in speaking or writing.",followUpCheck:"In week 5, a new conversation task where the expressions can occur naturally.",prerequisites:["pt.a2.vocab-city"]},{id:"pt.b1.read-inference",lang:"pt",band:3,skill:"reading",title:"Infer meaning and opinion in texts on familiar topics",languageFocus:"Inference and opinion in crônicas, opinion columns and reviews: evaluative language (infelizmente, curiosamente, ainda bem), irony and attitude markers; guessing meaning from context.",activities:{teen:"Feelings evidence table: students read a short story or crônica written for teenagers and infer the characters' feelings and motives from their actions and word choice, recording evidence in a table.",adult:"Crônica circle: learners read a short crônica and discuss the writer's attitude and any criticism it implies."},reinforcement:"Revise main-idea and scanning strategies.",successCriterion:"Identifies the writer's opinion in 2 texts with supporting evidence and answers 4 of 5 inference questions correctly.",followUpCheck:"In week 5, a new text (a blog post or a reader's letter to a newspaper).",prerequisites:["pt.a2.read-main"]},{id:"pt.b1.listen-gist",lang:"pt",band:3,skill:"listening",title:"Understand the gist and attitudes in longer talk",languageFocus:"Longer talk (2–4 minutes) from podcasts, interviews and radio: gist, speakers' attitudes and discourse markers (tipo, sabe, então, na verdade, enfim).",activities:{teen:"Emoji reactions: students listen to a short segment of a youth podcast or vlog and choose an emoji for each speaker's attitude, then justify it with words they heard.",adult:"Interview summary: learners listen to a radio interview and summarise the main message and the interviewee's attitude in one sentence each."},reinforcement:"Revise detail-listening strategies from A2.",successCriterion:"Summarises the gist of a 3-minute recording and correctly identifies the attitudes of both speakers.",followUpCheck:"In week 5, a new genre (a vlog or a TV debate show).",prerequisites:["pt.a2.listen-detail"],milestone:"Can follow the main points and speakers' attitudes in longer everyday talk"},{id:"pt.b1.opinions",lang:"pt",band:3,skill:"speaking",title:"Give and justify opinions on familiar topics",languageFocus:"Opinion language: Eu acho que…, Na minha opinião…, Para mim…, Concordo / Discordo porque…; reasons and examples (por exemplo, por isso, é que…); Não acho que + subjuntivo.",activities:{teen:"Hot seat: a student sits in the hot seat and gives quick opinions on topics (school uniforms, social media, video games) while classmates challenge each answer.",adult:"Culture comparison: learners discuss cultural differences between Brazil and their home country (punctuality, meals, work hours) with reasons and examples."},reinforcement:"Revise comparatives (mais / menos… do que, melhor, pior) and past forms for giving examples from experience.",successCriterion:"In a 2-minute exchange, gives an opinion with at least 2 reasons and 1 example and responds to a challenge.",followUpCheck:"In week 5, a new unprepared topic with a new partner.",prerequisites:["pt.a2.narrate-past"],milestone:"Can give and briefly justify opinions on familiar topics"},{id:"pt.b1.write-paragraph",lang:"pt",band:3,skill:"writing",title:"Write a connected paragraph using linking words",languageFocus:"Paragraph structure and linking words: além disso, porém, no entanto, embora (+ subjuntivo), por exemplo, portanto, por causa de.",activities:{teen:"Photo prompt paragraph: students choose a photo of a Brazilian place or event and write a paragraph explaining why it is worth visiting, then swap and underline each other's linkers.",adult:"Blog paragraph: learners write a paragraph for a blog about living in Brazil, then revise it after peer feedback focused on linkers and the topic sentence."},reinforcement:"Revise e, mas, porque and então from A2 messages.",successCriterion:"Writes a 100–120 word paragraph with a clear topic sentence and at least 4 accurately used linkers.",followUpCheck:"In week 5, a new paragraph on a different topic, written in class.",prerequisites:["pt.a2.write-message"],milestone:"Can write a connected paragraph on a familiar topic"},{id:"pt.b2.subjuntivo-avancado",lang:"pt",band:4,skill:"grammar",title:"Use the imperfeito and futuro do subjuntivo in conditions and time clauses",languageFocus:"Imperfeito do subjuntivo in hypotheses (Se eu tivesse tempo, viajaria) and after past triggers (Queria que você viesse); futuro do subjuntivo in time and conditional clauses (Quando você chegar…, Se der…, Assim que eu puder…); futuro do pretérito in the main clause.",activities:{teen:"If I were mayor: students make hypothetical proposals for their city ('Se eu fosse prefeito, eu…') and debate them, then plan the future with 'Quando eu terminar a escola…'.",adult:"Project timeline: learners plan a work or personal project timeline with future-subjunctive clauses ('Assim que o cliente aprovar…') and discuss 'what if' risks."},reinforcement:"Revise the presente do subjuntivo and futuro do pretérito forms.",successCriterion:"Uses the imperfeito and futuro do subjuntivo correctly in at least 6 of 8 contexts in a discussion or written plan.",followUpCheck:"In week 6, a new hypothetical or planning task.",prerequisites:["pt.b1.subjuntivo-presente"]},{id:"pt.b2.vocab-precision",lang:"pt",band:4,skill:"vocabulary",title:"Choose precise vocabulary and register",languageFocus:"Precise word choice and register: formal vs informal pairs (adquirir / comprar, solicitar / pedir, residir / morar), word families, intensity scales (gostar → adorar), and false cognates for English speakers (pretender, puxar, esquisito, atualmente).",activities:{teen:"Synonym ladder: students arrange synonyms by intensity or formality (gostar → curtir → adorar → amar) and use them in a social-media style review of a film or place.",adult:"False-cognate clinic: learners correct a short text full of false cognates and vague words, then write a formal request using the improved vocabulary."},reinforcement:"Revise the expressions and collocations from B1.",successCriterion:"Uses at least 8 precise or register-appropriate items in a task and corrects 4 of 5 false-cognate errors.",followUpCheck:"In week 6, a new writing task addressed to different recipients.",prerequisites:["pt.b1.vocab-expressions"]},{id:"pt.b2.read-organisation",lang:"pt",band:4,skill:"reading",title:"Follow text organisation and implied meaning",languageFocus:"Text organisation and cohesion: reference (este, aquele, o mesmo, tal), connectors (todavia, ou seja, dessa forma, em contrapartida), paragraph functions, and implied meaning in reportagens and artigos de opinião.",activities:{teen:"Predict the next paragraph: students highlight connectors and reference words in a short news report, then predict what the next paragraph will say before reading it.",adult:"Article skeleton: learners reduce an opinion article to a skeleton outline (thesis, arguments, concession, conclusion) and note what the writer suggests without saying it directly."},reinforcement:"Revise inference strategies from B1.",successCriterion:"Correctly reorders or reinserts at least 4 of 5 sections of a text and explains the cohesive link for each.",followUpCheck:"In week 5, a new gapped text on a different topic.",prerequisites:["pt.b1.read-inference"]},{id:"pt.b2.listen-implied",lang:"pt",band:4,skill:"listening",title:"Understand implied meaning in extended speech",languageFocus:"Implied meaning in extended speech: irony, understatement, intonation, and Brazilian politeness strategies such as indirect refusals ('Vou ver', 'Pode ser', 'Vamos marcar').",activities:{teen:"Tone sorting: students hear the same short sentence said in different ways (sincere, ironic, annoyed), match each version to a context, then perform their own.",adult:"The polite no: learners listen to workplace and social conversations and identify when 'sim' really means 'talvez' or 'não', then discuss the cultural norms behind it."},reinforcement:"Revise gist and attitude strategies from B1.",successCriterion:"Correctly interprets the implied meaning in at least 4 of 5 extracts, with supporting evidence.",followUpCheck:"In week 6, a new extended recording (a panel discussion or a podcast debate).",prerequisites:["pt.b1.listen-gist"]},{id:"pt.b2.discuss",lang:"pt",band:4,skill:"speaking",title:"Sustain a discussion and negotiate",languageFocus:"Discussion and negotiation language: Concordo em parte, mas…; Entendo seu ponto, porém…; E se a gente…?; Que tal…?; summarising (Então ficamos assim…); inviting others in (E você, o que acha?).",activities:{teen:"Class council: students negotiate a plan for a class trip using role cards with conflicting priorities and must reach a group agreement.",adult:"Residents' meeting: learners take roles in a condominium meeting and negotiate a decision (a renovation, new rules for the pool), proposing compromises."},reinforcement:"Revise opinion language and the subjunctive.",successCriterion:"In a 6-minute discussion, responds directly to others at least 3 times, proposes a compromise and summarises the outcome.",followUpCheck:"In week 6, a new discussion with different roles.",prerequisites:["pt.b1.opinions"],milestone:"Can sustain a discussion and negotiate an agreement"},{id:"pt.b2.argue",lang:"pt",band:4,skill:"writing",title:"Develop a clear written argument",languageFocus:"Argumentative text structure (introdução com tese, desenvolvimento, contra-argumento, conclusão); formal linkers (além disso, por outro lado, contudo, portanto); impersonal constructions (é possível que, deve-se, cabe ressaltar).",activities:{teen:"Letter to the city: students write a formal letter to the city council arguing for a change in their neighbourhood (more cycle lanes, a new park), using a model with highlighted linkers.",adult:"Point and counterpoint: learners read two short opposing texts, then write their own argued position and peer-review it with a checklist on thesis, support and rebuttal."},reinforcement:"Revise paragraph structure and linkers from B1.",successCriterion:"Writes a 200–250 word argument with a clear thesis, 2 supported points, a counter-argument and a conclusion.",followUpCheck:"In week 6, a timed text on a new topic.",prerequisites:["pt.b1.write-paragraph","pt.b1.opinions"],milestone:"Can write a clear argument that supports a point of view"}],vd={id:"fluency",name:"Fluency and coherence",descriptors:["Says single words or memorised phrases, with long silences between them. Needs the listener's help to say almost anything.","Manages very short, mostly practised utterances joined in the simplest way. Stops often to find words but can finish a simple turn.","Speaks in short, linked sentences about familiar things. Pauses, false starts and restarts are frequent, but a simple sequence is easy to follow.","Keeps talking on familiar topics for a minute or more. Stops to plan or fix language are noticeable, yet the speaker carries on and the ideas follow a clear, straightforward order.","Keeps a steady pace through longer turns, with only short hesitations. Develops points with relevant detail and makes it clear how one idea leads to the next.","Talks with natural ease, even on complex or unexpected topics. Any hesitation is about choosing the best way to say something, and longer talk is well organised and easy to follow."]},bd={id:"grammar",name:"Grammatical control",descriptors:["Uses a few memorised chunks correctly (for example, saying their name or age). Outside these chunks there is little recognisable sentence structure.","Builds short sentences with a handful of basic patterns. Beyond memorised language, errors are frequent and can make the meaning unclear.","Simple, familiar structures (present and past, basic questions) are often correct. Basic errors keep coming back, but the intended meaning usually gets through.","Uses common structures reasonably accurately in everyday situations. Errors increase when trying longer or more complex sentences, but they seldom confuse the listener.","Handles a wide range of structures, including complex sentences, with few errors. Mistakes are mostly small slips, which the speaker often notices and corrects.","Grammar stays accurate across simple and complex structures, even when the speaker is focused on ideas rather than form. The few errors are minor and easy to miss."]},wd={id:"vocabulary",name:"Vocabulary and precision",descriptors:["Knows a handful of isolated words and set phrases for very familiar things (names, numbers, colours). Often uses gestures or another language to fill gaps.","Has basic words and phrases for personal information and concrete everyday needs. Frequent gaps make the speaker stop or switch to another language.","Covers everyday topics (family, school or work, food, shopping, free time) with simple words. Word choice is repetitive, and gaps often force the speaker to simplify the message.","Has enough words for most familiar and personal-interest topics. When a word is missing, finds another way to express it (describing or giving an example); some wrong choices, but meaning stays clear.","Uses a good range of vocabulary, including some less common words and expressions, to say things precisely. Varies wording to avoid repetition; occasional imprecision does not hinder communication.","Draws on a broad vocabulary, including idiomatic and fixed expressions, with precision and flexibility. Adapts word choice to the listener and situation, and covers rare gaps smoothly."]},kd={id:"pronunciation",name:"Pronunciation and intelligibility",descriptors:["A supportive listener who knows the context can understand some individual words. The listener often has to guess or ask for repetition.","Practised words and phrases can usually be understood with effort. Sounds, stress or rhythm carried over from another language often make the listener ask for repetition.","Generally understood, though the listener sometimes needs to concentrate or ask again. A few sounds or misplaced word stress occasionally lead to misunderstanding.","Can be followed throughout without much effort. The speaker's own accent is clearly present and now and then makes the listener pause, but it rarely causes a breakdown; accent alone is not a reason to score lower.","Clear and easy to follow with little listener effort. Stress, rhythm and intonation support the meaning, and accent features almost never get in the way.","Easy to understand at all times. Uses stress, intonation and rhythm flexibly to show emphasis, attitude and fine shades of meaning; a noticeable non-native accent is fully compatible with this band."]},Ed={id:"interaction",name:"Interaction and communication",descriptors:["Responds to very simple, familiar questions with a word, a nod or a gesture when the partner speaks slowly and helps. Does not yet start exchanges.","Asks and answers very simple personal questions with plenty of support. Depends on the partner to repeat, rephrase and keep the exchange going.","Takes part in short, routine exchanges and can say when they do not understand or ask for repetition. Rarely keeps the conversation going on their own.","Joins in unplanned conversations on familiar subjects: gets them started, keeps them going with follow-up questions and checks understanding when unsure. Can usually fix small breakdowns.","Interacts with ease, taking turns naturally, building on what others say and bringing others in. Handles misunderstandings and disagreement constructively.","Manages conversation skilfully and flexibly, adjusting to the partner and the situation. Steers the discussion, picks up on subtle cues and keeps the exchange balanced."]},Rd={id:"RUB-SPK",version:1,skill:"speaking",name:"Speaking — analytic rubric",criteria:[vd,bd,wd,kd,Ed]},Nd={id:"task",name:"Task achievement and relevance",descriptors:["Writes a few words or a copied phrase connected to the task (for example, their name or a label). Most of the required content is missing.","Gives some of the basic information asked for, in simple sentences. One or more required points are missing or only touched on.","Covers most of the required points in a simple way. Content is relevant, though brief, and some points are not developed.","Covers all required points with relevant detail. The purpose of the text is clear, although some points are developed more than others.","Addresses every part of the task fully, with well-chosen detail and support. Keeps the purpose and the intended reader in mind throughout.","Fulfils the task completely and thoughtfully. Content is selected and developed with skill for the purpose and the reader, with nothing irrelevant."]},_d={id:"organisation",name:"Organisation and coherence",descriptors:["Produces isolated words or phrases with no connection between them.","Writes separate simple sentences, occasionally joined with the most basic connector. The order of ideas is simple and not always logical.","Joins ideas into a short connected text using a few basic connectors. There is a recognisable beginning and end.","Arranges ideas in a clear sequence of points or paragraphs, using a range of common linking words. There are still some jumps or gaps between ideas.","Structures the text logically in well-developed paragraphs. Varied linking and reference words let the reader follow the line of thought without effort.","Organises complex content clearly and smoothly. Ideas connect naturally through a wide range of devices, and the overall structure suits the purpose of the text."]},Sd={id:"vocabulary",name:"Vocabulary range and appropriateness",descriptors:["Uses a few isolated, very familiar words, often copied or spelled as they sound.","Uses basic words for personal and concrete topics. The range is narrow and spelling errors are frequent, but simple meaning comes through.","Uses everyday vocabulary that is adequate for routine topics. Repetition is common and some word choices are inaccurate; common words are mostly spelled correctly.","Has enough vocabulary for familiar topics, with some variety. Wrong word choices appear, especially on less familiar topics, but rarely hide the meaning.","Uses a wide range of vocabulary with good precision, including topic-specific words and natural word combinations. The level of formality is mostly appropriate.","Uses broad, precise and idiomatic vocabulary. Formality and tone are consistently right for the reader and the purpose."]},Ad={id:"grammar",name:"Grammatical control and clarity",descriptors:["Writes isolated words or memorised phrases; there is little or no sentence structure.","Writes very simple sentences with basic word order. Errors are frequent, but the simplest ideas can be understood.","Uses simple structures with reasonable accuracy. Recurring errors (for example, with verb endings or agreement) are present but rarely block understanding.","Uses a range of structures with good control in familiar contexts. Errors appear in longer or more complex sentences, but the meaning stays clear.","Shows good control of a wide range of simple and complex structures. Errors are occasional and do not cause misunderstanding; punctuation is mostly accurate.","Grammar is accurate and varied across complex structures. The few errors are minor, and punctuation is used to make meaning clear."]},Cd={id:"effectiveness",name:"Overall communicative effectiveness",descriptors:["The reader can pick out only isolated pieces of information, and only with considerable effort and guessing.","The reader can understand a simple, basic message, but needs to make an effort to do so.","The reader understands the main message without much difficulty, although the text is simple and some parts may need re-reading.","The text gets its message across clearly to the intended reader. Minor problems cause little strain.","The text communicates clearly and effectively and holds the reader's interest. It would achieve its purpose in a real situation.","The text has a strong effect on the reader. It reads easily, the tone is well judged, and it fully achieves its purpose."]},Td={id:"RUB-WRI",version:1,skill:"writing",name:"Writing — analytic rubric",criteria:[Nd,_d,Sd,Ad,Cd]},Ya=[Rd,Td],Zo=864e5,qr=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],Id=["January","February","March","April","May","June","July","August","September","O
