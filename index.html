[F] Todo dia também não! Acho que dois dias em casa seria o ideal.`,prompt:"Qual é a opinião da Carla sobre o home office?",options:["Ela quer trabalhar de casa todos os dias.","Ela quer voltar ao escritório todos os dias.","Ela não gosta de pegar metrô e por isso prefere ficar em casa.","Ela vê vantagens, mas prefere passar menos dias em casa."],correct:3,feedback:"Carla mentions advantages (no traffic) and disadvantages (isolation, longer hours) and concludes that two days at home would be ideal.",seconds:90,a11y:xe,status:"approved",author:D,createdAt:"2025-09-22"},{id:"PT-LI-B1-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"gist of an announcement",band:3,difficulty:-1,objectiveId:"pt.b1.listen-gist",topic:"Festa junina",format:"mcq",passageTitle:"Anúncio na rádio do bairro",passage:`[N] Atenção, moradores da Vila Esperança! Neste fim de semana tem o nosso tradicional Arraiá da Praça.
[N] Sábado e domingo, a partir das cinco da tarde, vai ter quadrilha, forró ao vivo e barracas com milho, canjica e pé de moleque.
[N] A entrada é um quilo de alimento não perecível, que vai ser doado para famílias do bairro. E atenção: durante a festa, a Rua das Flores vai ficar fechada para carros.`,prompt:"Qual é o principal objetivo do anúncio?",options:["Pedir doações de roupas para famílias do bairro.","Convidar para uma festa junina e explicar como participar.","Avisar que a festa foi cancelada.","Explicar como se prepara canjica."],correct:1,feedback:"The announcement invites listeners to the Arraiá (a festa junina) and gives practical details: times, attractions, food-donation entry and a road closure.",seconds:90,a11y:xe,status:"approved",author:D,createdAt:"2025-09-22"},{id:"PT-LI-B1-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"speaker attitude",band:3,difficulty:0,objectiveId:"pt.b1.listen-gist",topic:"TV and novelas",format:"mcq",passageTitle:"Conversa sobre o final da novela",passage:`[F] Você viu o último capítulo da novela ontem?
[M] Vi... Nossa, que decepção.
[F] Sério? Eu achei lindo! A Helena finalmente perdoou o pai.
[M] Ah, mas foi tudo muito rápido. Seis meses de história, e no último capítulo eles resolvem tudo em dez minutos?
[F] É, isso é verdade. Mas a cena do casamento foi emocionante, vai.
[M] Tá, a cena foi bonita. Mas eu esperava mais.`,prompt:"Qual é a atitude do homem em relação ao final da novela?",options:["Ele adorou o final, principalmente o casamento.","Ele não assistiu ao último capítulo.","Ele achou que o final foi longo demais.","Ele ficou decepcionado porque tudo foi resolvido rápido demais."],correct:3,feedback:"He says “que decepção” and complains that six months of story were resolved in ten minutes; he only concedes that one scene was nice.",seconds:90,a11y:xe,status:"approved",author:D,createdAt:"2025-09-23"},{id:"PT-LI-B1-04",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"inferring a decision",band:3,difficulty:1,objectiveId:"pt.b1.listen-gist",topic:"Renting an apartment",format:"mcq",passageTitle:"Visita a um apartamento",passage:`[M] Então, este é o quarto. Tem bastante luz natural, né?
[F] É verdade, é bem claro. E esse barulho? É sempre assim?
[M] Ah, é a obra do prédio ao lado. Mas deve terminar... sei lá, no ano que vem.
[F] Hum. Eu estudo on-line, de casa, então preciso de silêncio durante o dia.
[M] Entendo. Mas o preço está ótimo para o bairro!
[F] Tá bom. Vou pensar e te dou uma resposta. Obrigada.`,prompt:"O que podemos concluir sobre a mulher?",options:["Ela provavelmente não vai alugar o apartamento por causa do barulho.","Ela vai alugar o apartamento porque o preço está ótimo.","Ela achou o quarto escuro demais.","Ela vai trabalhar na obra do prédio ao lado."],correct:0,feedback:"She needs silence during the day, the construction noise may last until next year, and her non-committal “Vou pensar” suggests she will not rent it.",seconds:100,a11y:xe,status:"approved",author:D,createdAt:"2025-09-23"},{id:"PT-LI-B2-01",version:1,lang:"pt",ageGroups:["adult"],skill:"listening",subskill:"polite refusal",band:4,difficulty:0,objectiveId:"pt.b2.listen-implied",topic:"Work meetings",format:"mcq",passageTitle:"Reunião de equipe",passage:`[F] Então, gente, essa é a minha proposta: a gente lança o aplicativo novo já em março, antes da concorrência.
[M] Olha, Juliana, a ideia é muito interessante, de verdade. Dá pra ver que você pensou em tudo.
[F] Obrigada!
[M] Só que... a equipe de testes ainda está com aquele atraso, o orçamento do primeiro semestre já está fechado, e março é o mês do balanço...
[F] Entendi.
[M] Que tal a gente retomar essa conversa mais pra frente, quando o cenário estiver mais claro?`,prompt:"O que o homem quer dizer, na verdade?",options:["Ele aprova a proposta e quer lançar o aplicativo em março.","Ele quer que a Juliana refaça o orçamento até março.","Ele está recusando a proposta, pelo menos por enquanto, de forma educada.","Ele acha que a equipe de testes deve ser substituída."],correct:2,feedback:"After praising the idea he lists obstacles and suggests discussing it “mais pra frente”, a typical indirect way of saying no for now.",seconds:120,a11y:xe,status:"approved",author:D,createdAt:"2025-09-24"},{id:"PT-LI-B2-02",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"indirect complaint",band:4,difficulty:1,objectiveId:"pt.b2.listen-implied",topic:"Neighbours",format:"mcq",passageTitle:"Encontro no elevador",passage:`[F] Bom dia! Você é o novo morador do 504, né?
[M] Sou eu, sim! Prazer, Henrique.
[F] Prazer, Sônia, do 404. Bem embaixo de você. E aí, a festa de sábado foi boa? Deu pra ouvir que o pessoal estava animado... até umas três da manhã.
[M] Ai, desculpa! Foi meu aniversário, acabou passando da hora.
[F] Imagina, acontece. É que, no domingo, eu acordo às seis pra trabalhar no hospital, sabe?`,prompt:"O que a Sônia quer comunicar ao Henrique?",options:["Que ela gostaria de ter sido convidada para a festa.","Que a festa a incomodou, embora ela fale de forma simpática.","Que ela trabalha no mesmo hospital que ele.","Que ela também vai fazer uma festa no domingo."],correct:1,feedback:"Mentioning that she lives right below, heard the party until 3 a.m. and gets up at six on Sundays is a friendly but clear complaint about the noise.",seconds:120,a11y:xe,status:"approved",author:D,createdAt:"2025-09-25"},{id:"PT-LI-B2-03",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"listening",subskill:"nuanced stance",band:4,difficulty:-1,objectiveId:"pt.b2.listen-implied",topic:"Urban mobility",format:"mcq",passageTitle:"Podcast sobre mobilidade urbana",passage:`[M] No episódio de hoje, a gente conversa com a urbanista Marta Reis sobre os patinetes elétricos compartilhados. Marta, os patinetes resolvem o problema do trânsito?
[F] Resolver, não resolvem. Eles ajudam naquele trecho final: da estação de metrô até o trabalho, por exemplo.
[F] O problema é quando a cidade compra a ideia como se fosse a solução e esquece de investir em calçada, ciclovia, ônibus de qualidade.
[M] Então você é contra?
[F] Não, de jeito nenhum. Só acho que patinete é complemento, não é política de transporte.`,prompt:"Qual é a posição da urbanista sobre os patinetes?",options:["Ela acha que os patinetes deveriam ser proibidos.","Ela acredita que eles vão acabar com o trânsito.","Ela prefere os patinetes ao metrô.","Ela os considera úteis, mas apenas como complemento a outros investimentos."],correct:3,feedback:"She rejects both extremes (“Resolver, não resolvem” and “de jeito nenhum” to being against them): scooters help with the last stretch but are only a complement.",seconds:120,a11y:xe,status:"approved",author:D,createdAt:"2025-09-25"},{id:"PT-VO-B1-05",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"vocabulary",subskill:"false friends",band:3,difficulty:0,objectiveId:"pt.b1.vocab-expressions",topic:"False friends",format:"mcq",prompt:`Leia a frase e escolha o significado.
“Experimentei um sorvete de tapioca com queijo. Achei esquisito.”`,options:["Achei delicioso.","Achei estranho.","Achei caro.","Achei gelado demais."],correct:1,feedback:"Esquisito means strange or weird; Spanish speakers may confuse it with “exquisito” (delicious).",seconds:35,status:"in_review",author:D,createdAt:"2025-09-26",changeNote:"New item awaiting peer review: check whether “Achei estranho” is too close to a literal translation for B1."},{id:"PT-GR-A2-05",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"grammar",subskill:"irregular perfeito (pôr)",band:2,difficulty:1,objectiveId:"pt.a2.preterito-perfeito",topic:"Pretérito perfeito: irregular verbs",format:"mcq",prompt:`Escolha a forma correta.
Onde você ___ as chaves do carro? Não estou encontrando.`,options:["pusou","ponhou","pôs","pôde"],correct:2,feedback:"Pôr is irregular in the pretérito perfeito: você pôs (not *pusou or *ponhou); pôde is the past of poder.",seconds:30,status:"in_review",author:D,createdAt:"2025-09-26",changeNote:"New item awaiting peer review: confirm the distractors are plausible for A2 learners."}],Qo=[{id:"PT-WR-PA1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"writing",band:0,title:"About me",prompt:"Write about yourself in Portuguese. You can write short phrases or very simple sentences.",bullets:["Your name (Meu nome é…)","Your country (Eu sou de…)","Your age (Eu tenho … anos)"],minWords:5,teacherNotes:"Accept single words and memorised phrases. Look for: name, country/nationality and age with “tenho” (a common error is “Eu sou 30 anos”). Do not penalise missing accents or capital letters at this band; credit any recognisable attempt to communicate. If the student writes only in English, note it as “not yet” rather than zero effort.",seconds:300,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-WR-A1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"writing",band:1,title:"My daily routine",prompt:"Write a short message to your new Portuguese teacher about your daily routine.",bullets:["Where you live and where you work or study","What time you wake up and what you have for breakfast (café da manhã)","What you do in the evening or at the weekend"],minWords:25,teacherNotes:"Elicits pt.a1.vocab-daily and pt.a1.presente. Look for regular and common irregular present forms (acordo, tomo, trabalho/estudo, faço, vou), time expressions (às sete, de manhã, à noite) and simple connectors (e, mas, depois). Typical errors: “sou 30 anos”, missing contractions (“em o trabalho”), gender agreement (“o casa”). Prioritise whether the message is understandable over accuracy.",seconds:600,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-WR-A2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"writing",band:2,title:"Mensagem sobre o fim de semana",prompt:"Escreva uma mensagem para um amigo brasileiro. Conte o que você fez no último fim de semana e o que vai fazer no próximo.",bullets:["Aonde você foi e com quem","O que você comeu, comprou ou viu","Do que você gostou (ou não gostou)","Um plano para o próximo fim de semana"],minWords:50,teacherNotes:"Elicits pt.a2.write-message with pt.a2.preterito-perfeito and pt.a2.ir-futuro. Look for perfeito forms (fui, comi, comprei, vi, gostei), ir + infinitive for the plan (vou visitar), sequencing words (primeiro, depois, à noite) and an informal opening and closing (Oi!, Beijos, Abraço). Accept Brazilian informal usage such as “a gente” and “pra”. Common errors: “eu foi”, “gostei o filme” (missing de), confusion of perfeito and presente.",seconds:900,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-WR-B1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"writing",band:3,title:"Antes e agora",prompt:"Escreva um parágrafo para o blog da sua escola de idiomas: como era a sua vida antes de vir para o Brasil (ou antes de começar a estudar português) e o que mudou.",bullets:["Como era a sua rotina antes","Um momento marcante da mudança","O que hoje é mais fácil e o que é mais difícil","Um conselho para quem vai passar pela mesma experiência"],minWords:90,teacherNotes:"Elicits pt.b1.write-paragraph, pt.b1.imperfeito and pt.b1.subjuntivo-presente. Look for the imperfeito for past routines (morava, trabalhava, estudava) against the perfeito for single events (mudei, cheguei), linking words (antes, quando, no entanto, por isso, além disso) and the subjuntivo in advice (recomendo que…, é importante que…). Credit a clear, connected paragraph; a learner who has not moved to Brazil can write about starting Portuguese instead.",seconds:1200,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-WR-B2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"writing",band:4,title:"Texto de opinião: centro sem carros",prompt:"Escreva um texto de opinião para o site do seu bairro respondendo à pergunta: “O centro da cidade deveria ser fechado para carros aos domingos?”",bullets:["Apresente a sua posição com clareza","Dê pelo menos dois argumentos com exemplos","Considere um argumento contrário e responda a ele","Termine com uma proposta ou recomendação"],minWords:140,teacherNotes:"Elicits pt.b2.argue and pt.b2.subjuntivo-avancado. Look for paragraphing (introduction, arguments, counter-argument, conclusion), concession connectors (embora, ainda que, apesar de, por outro lado), hypothetical and conditional structures (se a prefeitura fechasse…, caso…, desde que…) and a register suitable for a public text (avoid “tipo”, “né”, “pra”). Accept either position; assess how well it is argued, not the opinion itself.",seconds:1800,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-SP-PA1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"speaking",band:0,title:"Hello!",prompt:"Say hello in Portuguese and tell me a little about yourself.",bullets:["Your name","Where you are from","How old you are"],speakingSeconds:30,teacherNotes:"Run live or recorded; speak slowly and use gestures. Follow-up questions: “Qual é o seu nome?”, “De onde você é?”, “Quantos anos você tem?”. Listen for intelligible formulaic phrases (Oi / Bom dia, Meu nome é…, Sou de…, Tenho … anos); single-word answers are acceptable at this band. Judge intelligibility, not a native accent: nasal vowels (ão, ãe) and the different r sounds do not need to be native-like.",seconds:120,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-SP-A1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"speaking",band:1,title:"My typical day",prompt:"Talk about a typical day in your life, in Portuguese.",bullets:["What time you wake up","How you go to work or school (ônibus, metrô, a pé…)","What you like to eat","What you do in your free time"],speakingSeconds:45,teacherNotes:"Elicits pt.a1.questions-basic and pt.a1.presente. Follow-up questions: “Você mora com quem?”, “O que você faz no fim de semana?”, “Você gosta de comida brasileira? Qual?”. Listen for present-tense verbs in the eu form, times (às oito, de manhã) and the ability to answer simple personal questions. Pauses and self-correction are normal at A1. Judge intelligibility, not a native accent; L1 rhythm and vowel quality are fine if the meaning is clear.",seconds:180,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-SP-A2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"speaking",band:2,title:"Um passeio ou uma viagem",prompt:"Conte sobre um passeio ou uma viagem que você fez.",bullets:["Aonde você foi e quando","Com quem você foi","O que você fez lá, em ordem","Do que você mais gostou"],speakingSeconds:60,teacherNotes:"Elicits pt.a2.narrate-past. Follow-up questions: “Como foi a comida lá?”, “Você quer voltar? Por quê?”, “Qual vai ser a sua próxima viagem?”. Listen for a simple sequence of events in the pretérito perfeito (fui, visitei, comi, gostei), sequencing words (primeiro, depois, no último dia) and ir + infinitive in the last answer. Judge intelligibility, not a native accent: check that past-tense endings are audible enough to show time (e.g. visito vs visitei), which matters more than accent.",seconds:240,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-SP-B1-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"speaking",band:3,title:"Cidade grande ou cidade pequena?",prompt:"Você prefere morar numa cidade grande, como São Paulo, ou numa cidade pequena? Explique a sua opinião.",bullets:["Diga qual é a sua preferência","Dê duas razões, com exemplos da sua experiência","Fale de uma desvantagem da sua escolha"],speakingSeconds:90,teacherNotes:"Elicits pt.b1.opinions. Follow-up questions: “E quando você era criança, onde você morava? Como era?”, “O que você mudaria na cidade onde você mora hoje?”, “Você acha importante que as cidades tenham mais áreas verdes? Por quê?”. Listen for opinion language (acho que, na minha opinião, por outro lado), reasons with examples, the imperfeito when describing childhood and the subjuntivo after “acho importante que”. Judge intelligibility, not a native accent; note only pronunciation that actually causes misunderstanding.",seconds:300,status:"approved",author:D,createdAt:"2025-09-01"},{id:"PT-SP-B2-01",version:1,lang:"pt",ageGroups:["teen","adult"],skill:"speaking",band:4,title:"Debate: redes sociais",prompt:"As redes sociais aproximam ou afastam as pessoas? Discuta os dois lados e defenda uma posição.",bullets:["Apresente vantagens e desvantagens","Defenda a sua posição com argumentos e exemplos","Proponha um meio-termo ou uma solução"],speakingSeconds:120,teacherNotes:"Elicits pt.b2.discuss. Run it as a short discussion: after the student’s turn, take the opposite view to see whether they can respond and negotiate. Follow-up questions: “Mas e se uma pessoa mora longe da família? As redes não ajudam?”, “Se você pudesse mudar uma regra das redes sociais, qual seria?”, “Você concorda que os jovens deveriam ter um limite de tempo, desde que…?”. Listen for turn-taking, conceding and counter-arguing (concordo em parte, mas…; por outro lado…), hypotheticals with the imperfeito do subjuntivo (se eu pudesse…) and appropriate register. Judge intelligibility and fluency, not a native accent.",seconds:420,status:"approved",author:D,createdAt:"2025-09-01"}],St=[{id:"en.pa1.vocab-everyday",lang:"en",band:0,skill:"vocabulary",title:"Recognise everyday words: colours, numbers, animals, objects",languageFocus:"Core nouns and adjectives: colours (red, blue, green, yellow…), numbers 1–20, common animals (cat, dog, bird, fish, horse), classroom and home objects (book, pen, bag, chair, table, door); chunks: 'What colour is it?', 'How many…?', 'It's a…'.",activities:{child:"Colour hunt: call out 'Find something blue!' and children race to touch an object of that colour and name it; finish with a 'What's missing?' memory game using six picture cards on the board.",teen:"Speed labelling: in pairs, students label as many objects as they can in a photo of a bedroom or a gamer's desk in two minutes, then swap sheets and check each other's spelling against a word bank.",adult:"Real-object sort: learners empty a bag of everyday items and picture cards, sort them into groups they choose (home, office, colours, animals) and name each item aloud as they place it."},reinforcement:"Two-minute flash-and-say at the start of each lesson, recycling 8–10 words from the previous week in a different order each time.",successCriterion:"Names or points to at least 16 of 20 taught words from pictures or real objects without a model.",followUpCheck:"In week 3, a picture-pointing check with a new scene (a park or a market) asking for 10 taught items in a context not used in class.",milestone:"Can recognise and name common everyday objects, colours, animals and numbers"},{id:"en.pa1.greetings",lang:"en",band:0,skill:"functional",title:"Greet people and introduce yourself",languageFocus:"Hello / Hi / Goodbye / See you; Good morning / afternoon / evening; What's your name? My name's… / I'm…; How are you? I'm fine, thanks. And you?; Nice to meet you; How old are you? I'm… (not 'I have…').",activities:{child:"Puppet hello: two hand puppets meet and greet in front of the class; children then take a puppet each and greet three classmates, passing a soft name ball to the next speaker.",teen:"Name-badge mingle: students invent an identity (a footballer, a game character), write a name badge and mingle, greeting and introducing themselves to as many people as possible in three minutes.",adult:"First day at work: learners role-play greeting a new colleague at reception and saying their name and city, then repeat with a new partner in a different setting (checking in at a hotel)."},reinforcement:"Open every lesson with a greeting ritual at the door and 'How are you today?' answered from a feelings chart.",successCriterion:"Greets, gives their name and answers 'How are you?' in a 30-second exchange with a new person, needing no more than one prompt.",followUpCheck:"In week 3, an unannounced greeting by a different adult (or on a video call); note whether the full routine comes out without support.",milestone:"Can greet people, say who they are and respond to simple greetings"},{id:"en.pa1.be-have",lang:"en",band:0,skill:"grammar",title:'Use "be" and "have got" in very simple sentences',languageFocus:"be: I'm / you're / he's / she's / it's, negatives (I'm not, it isn't) and short questions (Is it…?); have got: I've got / she's got a…, Have you got…? Yes, I have / No, I haven't. Age with be: 'I'm 9', 'I'm 35' (a common transfer error from Portuguese 'tenho').",activities:{child:"Monster dictation: the teacher describes a monster ('It's green. It's got three eyes and a long tail'), children draw it, then describe their own monster for a partner to draw.",teen:"Guess who: a student thinks of a famous person or character and the group asks yes/no questions ('Is she tall?', 'Has she got red hair?') until someone guesses.",adult:"ID cards: learners complete a short profile card for themselves and one family member, then present it orally ('This is my brother. He's 40. He's got two children')."},reinforcement:"Recycle colours, numbers and animals from the vocabulary unit inside be / have got sentences.",successCriterion:"Produces at least 5 short sentences with correct be / have got forms, including one negative, when describing a picture or a person.",followUpCheck:"In week 4, describe a new picture or character not seen before; count correctly formed sentences."},{id:"en.pa1.listen-words",lang:"en",band:0,skill:"listening",title:"Understand familiar words and very short phrases spoken slowly",languageFocus:"Familiar words and short chunks spoken slowly and clearly: numbers, colours, animals, objects, classroom instructions (sit down, stand up, open your book, listen, look).",activities:{child:"Simon says with classroom instructions and 'Touch something red!' commands; children who move without 'Simon says' become the teacher's helpers instead of leaving the game.",teen:"Phrase bingo: students mark pictures on a bingo card as the teacher reads short phrases slowly ('a big black dog', 'three red pens'); the winner reads their line back.",adult:"Listen and point: learners point to items in a busy street photo as the teacher reads short phrases slowly ('a red car', 'two women', 'a small dog'), then give phrases to a partner."},reinforcement:"A daily instruction routine: give 3–4 classroom instructions in English and gradually drop the gestures.",successCriterion:"Identifies the correct picture or object for at least 8 of 10 short phrases heard twice at slow speed.",followUpCheck:"In week 3, a new listen-and-point sheet that combines known words in new ways, spoken by a different voice or recording.",milestone:"Can understand familiar words and simple instructions spoken slowly"},{id:"en.pa1.read-words",lang:"en",band:0,skill:"reading",title:"Read and match single words and short labels",languageFocus:"Sight words and short labels: object and animal names, colours, numbers written as words, simple signs (EXIT, OPEN, CLOSED, TOILETS, STOP) and labels on apps and products (Play, Settings, Start).",activities:{child:"Label treasure hunt: word labels are hidden around the room; children find one, read it to a friend and stick it on the matching object or picture.",teen:"Sign safari: students match photos of real signs and app buttons to their meaning, then design two new signs for the classroom door.",adult:"Label match: learners match photos of product labels and airport signs to pictures, then sort them into 'at the airport' and 'at the supermarket'."},reinforcement:"Word-wall review: point to five words at random and the learner reads them aloud.",successCriterion:"Matches at least 8 of 10 written words or labels to the correct picture without help.",followUpCheck:"In week 3, a new set of labels (a toy-shop sign or a café board) in which at least half the combinations of known words are unseen."},{id:"en.a1.present-simple",lang:"en",band:1,skill:"grammar",title:"Use the Present Simple to talk about routines and facts",languageFocus:"Present Simple affirmative, negative and questions: I / you / we / they work; he / she works (third-person -s, -es, -ies: watches, studies); don't / doesn't + base verb; Do you…? Does she…?; adverbs of frequency (always, usually, sometimes, never) and their position.",activities:{child:"Animal routines: a child mimes a day in the life of a zoo animal or pet while classmates guess and describe it ('It eats fish. It sleeps in the afternoon').",teen:"Routine detective: students read clues about a famous athlete's or YouTuber's week and write he / she sentences, then interview a partner and report back using third-person -s.",adult:"Weekday timeline: learners map their own working week on a timeline, compare with a partner and report the differences ('She starts at eight; I don't start until ten')."},reinforcement:"Recycle be and have got: describe the person first, then their routine.",successCriterion:"In a 1-minute talk or 6 written sentences about someone else's routine, uses third-person -s correctly in at least 4 of 5 cases and forms one question correctly.",followUpCheck:"In week 4, describe the routine of a new person (a relative or a character from a picture story) without notes.",prerequisites:["en.pa1.be-have"],milestone:"Can describe daily routines and simple facts"},{id:"en.a1.there-is",lang:"en",band:1,skill:"grammar",title:"Describe places with there is / there are and prepositions of place",languageFocus:"There is / There are, Is there…? Are there any…?; some / any; prepositions: in, on, under, next to, behind, in front of, between, opposite. Watch for 'Have a…' used for existence (from Portuguese 'tem').",activities:{child:"Spot the difference: with two bedroom pictures, children find differences ('In my picture there's a cat under the bed'), then hide a toy and give clues for a friend to find it.",teen:"Dream room: students draw their ideal bedroom and describe it to a partner, who draws it from the description; then they compare drawings and fix any differences.",adult:"Neighbourhood info-gap: each learner has half a map of a neighbourhood and asks 'Is there a pharmacy near the station?' to complete it, then describes where they live."},reinforcement:"Revise everyday objects and numbers inside plural forms ('There are two chairs next to the window').",successCriterion:"Describes a picture in at least 6 sentences using there is / there are and 3 different prepositions, with no more than one 'have' used for existence.",followUpCheck:"In week 4, a describe-and-draw task with a new picture (a kitchen or a beach).",prerequisites:["en.pa1.vocab-everyday","en.pa1.be-have"]},{id:"en.a1.can-ability",lang:"en",band:1,skill:"grammar",title:"Talk about ability with can / can't",languageFocus:"can / can't + base verb for ability (I can swim; She can't cook); Can you…? Yes, I can / No, I can't; weak /kən/ in sentences vs strong 'can't'; action verbs: swim, ride, cook, sing, dance, draw, speak, drive.",activities:{child:"Superhero academy: each child chooses a superpower and strikes a pose; classmates ask 'Can you fly?' and the hero answers 'Yes, I can!' or 'No, I can't!'.",teen:"Talent survey: students run a 'Find someone who can…' mingle (skateboard, code, juggle, speak three languages) and present the class's top talents in a bar chart.",adult:"Job match: learners read three short job ads and decide who in the group could apply, explaining 'I can speak Spanish, but I can't drive'."},reinforcement:"Recycle sports and free-time verbs with a quick mime-and-guess warm-up.",successCriterion:"Asks and answers 5 can-questions accurately, with a clearly audible difference between can and can't in at least 4 of 5 answers.",followUpCheck:"In week 3, a short recorded interview with new prompts (skills needed for a summer camp or a new job), checked for form and the can / can't contrast.",prerequisites:["en.pa1.be-have"]},{id:"en.a1.vocab-routine",lang:"en",band:1,skill:"vocabulary",title:"Use words for daily routines, food, family and school",languageFocus:"Routine verb phrases (get up, have breakfast, go to school / work, do homework, go to bed), food and drink, family members, school subjects and places; collocations with have, go and do.",activities:{child:"Family tree: children draw and label their family (or a cartoon family) and play 'Who is it?' ('It's my grandmother'), then add each person's favourite food.",teen:"Routine bingo: students fill a bingo card with routine phrases and food words, then listen to a partner describe their day and cross off what they hear.",adult:"Meal planner: learners plan a week of meals for their household and write the shopping list, labelling who eats what and when."},reinforcement:"Recycle numbers and clock times while practising routine phrases ('at seven o'clock').",successCriterion:"Uses at least 15 target words accurately in a short description of their own day, family and food preferences.",followUpCheck:"In week 4, describe a picture sequence of a new character's day and count target words used correctly.",prerequisites:["en.pa1.vocab-everyday"]},{id:"en.a1.read-short",lang:"en",band:1,skill:"reading",title:"Understand short simple texts such as notes, signs and messages",languageFocus:"Short functional texts: notes, signs, notices, text messages, simple menus and timetables; key words such as open / closed, today, tomorrow, meet, please, don't, at + time.",activities:{child:"Message in a bottle: children open 'bottles' with short notes from a pirate and follow the instructions (go to the door, find the yellow box, count the shells).",teen:"Group-chat puzzle: students put a set of mixed-up chat messages in order, then answer 'Who? When? Where?' questions about the plan they describe.",adult:"Sticky-note action list: learners read realistic notes and notices (gym, office, building management) and decide what action each one requires and by when."},reinforcement:"Revise clock times and days of the week before reading notes about arrangements.",successCriterion:"Answers at least 4 of 5 detail questions correctly about a new short note or message.",followUpCheck:"In week 4, a new set of notices from a different context (a school noticeboard or a hotel lobby) with true / false questions.",prerequisites:["en.pa1.read-words"]},{id:"en.a1.listen-info",lang:"en",band:1,skill:"listening",title:"Catch specific information: numbers, times, names, places",languageFocus:"Numbers (including thirteen / thirty contrasts), clock times, prices, days, names spelled letter by letter, places; the English alphabet, especially the vowels a / e / i that Portuguese speakers often mix up.",activities:{child:"Number race: children hear a phone number, a time or a score and race to put number cards in the right order on the floor.",teen:"Cinema listings: students listen to a short recorded cinema message, fill in film times and prices, then role-play booking tickets for friends.",adult:"Voicemail notes: learners listen to three short voicemails (a clinic, a delivery company, a colleague) and note the name, time and phone number for each."},reinforcement:"Daily spelling warm-up: spell a name or email address aloud for a partner to write down.",successCriterion:"Notes at least 8 of 10 key details (numbers, times, names) correctly from two short recordings heard twice.",followUpCheck:"In week 4, a different recording type (a station announcement or a sports result) with a new note-taking grid.",prerequisites:["en.pa1.listen-words"]},{id:"en.a1.questions-basic",lang:"en",band:1,skill:"speaking",title:"Ask and answer simple personal questions",languageFocus:"Wh- and yes / no questions about personal information: What's your…? Where do you live? How old are you? Have you got…? Do you like…? What do you do?; short answers and bounce-back questions (And you?).",activities:{child:"Interview the mascot: children take turns asking the class toy questions, which the teacher answers in a funny voice; then pairs interview each other using a picture-cue card.",teen:"Speed-friending: students rotate every 90 seconds, asking a partner three questions from a card and one of their own, then report one surprising fact to the class.",adult:"Registration desk: one learner is a receptionist completing a gym membership form by asking questions, the other answers; then they swap with a new form (a language course)."},reinforcement:"Recycle Present Simple and be with a quick question-word ball toss (the catcher must start a question with the word called).",successCriterion:"In a 3-minute exchange, asks 5 personal questions with correct word order and answers 5 questions with relevant short answers.",followUpCheck:"In week 4, a live conversation with a new interlocutor (in person or on video) using questions not rehearsed in class.",prerequisites:["en.pa1.greetings","en.pa1.be-have"],milestone:"Can ask and answer simple questions about personal details"},{id:"en.a1.write-sentences",lang:"en",band:1,skill:"writing",title:"Write simple sentences about yourself and your day",languageFocus:"Simple sentences with capital letters and full stops; I am / I have got / I like / I live / I go…; and, but; time phrases (in the morning, after school, at the weekend); capital I.",activities:{child:"All-about-me poster: children draw themselves and write 4–5 sentences in speech bubbles, then display them in a 'poster museum' where classmates read and vote for a favourite fact.",teen:"Profile bio: students write a short social-media style bio and three posts about their day; the class reads them anonymously and guesses who wrote each one.",adult:"Hello email: learners write five or six sentences introducing themselves to a new teacher or colleague, using a model and a three-point checklist (capitals, full stops, verb)."},reinforcement:"Sentence-building race with word cards, re-using routine vocabulary and the Present Simple.",successCriterion:"Writes at least 6 understandable sentences about themselves and their day, with correct capitals, full stops and basic word order in most sentences.",followUpCheck:"In week 4, write about a different topic (my weekend or my best friend) without a model.",prerequisites:["en.pa1.read-words","en.pa1.be-have"],milestone:"Can write simple sentences about themselves and their day"},{id:"en.a2.past-simple",lang:"en",band:2,skill:"grammar",title:"Use the Past Simple (regular and irregular verbs) to describe events",languageFocus:"Past Simple affirmative and negative: regular -ed (pronounced /t/, /d/, /ɪd/ — avoid an extra syllable in 'walked') and 25–30 high-frequency irregular verbs (went, had, saw, ate, got, made, took, came); didn't + base verb; was / were.",activities:{child:"Fairy-tale chain: the class retells a well-known story with picture cards, each child adding one past sentence ('The wolf knocked on the door'); wrong verbs earn a silly forfeit, not a penalty.",teen:"Two truths and a lie: students write three sentences about their last holiday, two true and one false; classmates ask questions and vote on the lie.",adult:"Diary page: learners complete a short gapped diary entry, then write their own 'yesterday' diary in six sentences and compare with a partner to find two things in common."},reinforcement:"Irregular-verb snap or a quick-fire base form → past form recall game at the start of class.",successCriterion:"Uses the Past Simple correctly in at least 8 of 10 obligatory contexts in a short spoken or written account, including at least 3 irregular verbs.",followUpCheck:"In week 4, describe a different event (a birthday party or a trip) that needs new verbs.",prerequisites:["en.a1.present-simple"],milestone:"Can describe past events using simple past forms"},{id:"en.a2.past-questions",lang:"en",band:2,skill:"grammar",title:"Form and answer past-tense questions about real events",languageFocus:"Past Simple interrogative: Did you…? Where / When / What / Who did you…?; base verb after did ('Did you go?', not 'Did you went?'); short answers (Yes, I did / No, I didn't); questions with was / were; common irregular verbs in questions.",activities:{child:"Missing-toy mystery: the class teddy has disappeared; children question 'suspects' (the teacher and volunteers) with 'Did you go to the kitchen?' and use the answers to solve the case.",teen:"Alibi game: two students agree an alibi for last night, then the class questions them separately with past questions and looks for differences in their answers.",adult:"Weekend interview: learners interview a partner about last weekend from a cue card, then add three free follow-up questions of their own and report the most interesting answer."},reinforcement:"Recycle Present Simple questions first to highlight the do → did pattern.",successCriterion:"In a new interview, forms at least 4 of 5 past questions correctly (did + base verb, correct word order) and gives matching short answers.",followUpCheck:"At the end of week 4, a short communicative task with new prompts (interviewing a 'famous traveller' about a trip).",prerequisites:["en.a1.questions-basic","en.a1.present-simple"]},{id:"en.a2.comparatives",lang:"en",band:2,skill:"grammar",title:"Compare people, places and things (comparatives and superlatives)",languageFocus:"Comparative and superlative adjectives: -er / -est, more / most, irregular (good / better / best, bad / worse / worst, far / further), than, (not) as… as, the + superlative; spelling (bigger, easier); avoid 'more big'.",activities:{child:"Animal trump cards: pairs compare animal cards ('An elephant is heavier than a lion') and the animal that wins on the chosen category takes the round.",teen:"Ranking challenge: groups rank five phones, films or football teams and justify their order ('It's cheaper than…, but it's the slowest').",adult:"Choose the offer: learners compare two cities or two job offers from a data table (salary, commute, cost of living) and decide which is the best option for them."},reinforcement:"Revise descriptive adjectives and their opposites (big / small, cheap / expensive, fast / slow).",successCriterion:"Produces 6 accurate comparisons in a ranking or decision task, including at least 2 superlatives and 1 irregular form.",followUpCheck:"In week 4, a new comparison task (holiday destinations or restaurants) with a fresh data card.",prerequisites:["en.pa1.be-have","en.a1.vocab-routine"]},{id:"en.a2.future-plans",lang:"en",band:2,skill:"grammar",title:"Talk about plans with going to and the present continuous",languageFocus:"be going to for intentions and evidence-based predictions; Present Continuous for fixed arrangements (I'm meeting Ana on Friday); time phrases: tonight, tomorrow, this weekend, next week / month.",activities:{child:"Holiday suitcase: children pack a picture suitcase and say what they are going to do ('I'm going to swim'); classmates guess the destination from the clues.",teen:"Diary clash: each student has a busy weekend diary and must 'phone' friends to find a free time to meet, using 'What are you doing on Saturday?'",adult:"Event planner: learners plan a team or family event, checking real arrangements in their own calendars and agreeing on a date and plan."},reinforcement:"Revise days, clock times and the -ing form from the Present Continuous.",successCriterion:"Talks about at least 3 intentions and 2 arrangements with correct forms and appropriate time expressions.",followUpCheck:"In week 5, a new planning task with a partner (organising a birthday party or a short trip).",prerequisites:["en.a1.present-simple"]},{id:"en.a2.time-expressions",lang:"en",band:2,skill:"vocabulary",title:"Use past time expressions: yesterday, last week, ago, then",languageFocus:"yesterday, last night / week / year, three days ago ('ago' comes after the time period, unlike Portuguese 'há três dias'), in 2019, on Monday, when I was…, first, then, after that, finally.",activities:{child:"Timeline jump: a floor timeline is marked 'two days ago', 'yesterday', 'last week'; children jump to the right spot when the teacher describes an event.",teen:"Five dates: students make a timeline of five important moments in their life and present them using ago and last; each listener must ask one follow-up question.",adult:"Career timeline: learners draw a timeline of their studies and jobs, then a partner retells it aloud using the target expressions while the owner corrects any details."},reinforcement:"Combine with Past Simple revision through a quick 'When did you last…?' warm-up.",successCriterion:"Uses at least 5 different past time expressions correctly, with 'ago' placed after the time period every time.",followUpCheck:"In week 4, retell a new partner's timeline without notes.",prerequisites:["en.a1.vocab-routine"]},{id:"en.a2.vocab-travel",lang:"en",band:2,skill:"vocabulary",title:"Use words for travel, shopping, free time and the city",languageFocus:"Transport and tickets (return ticket, platform, gate), directions (turn left, go straight on), shops and clothes (size, try on, receipt), prices, free-time activities and city places (museum, square, shopping centre); chunks: How much is…? Can I try it on?",activities:{child:"Classroom shop: children run a toy shop with price tags and play money, buying and selling and naming everything they buy.",teen:"City trip planner: groups plan a day in London or New York with a fixed budget, using a map and price lists, then present their itinerary to the class.",adult:"Travel carousel: learners rotate between stations (ticket office, clothes shop, tourist information) and complete a short role-play at each using the target vocabulary."},reinforcement:"Recycle numbers and prices; quick 'odd one out' game with travel and shopping words.",successCriterion:"Uses at least 12 target words appropriately across two travel or shopping role-plays.",followUpCheck:"In week 5, a new role-play situation (hotel check-in or renting a bike) without a word list.",prerequisites:["en.a1.vocab-routine"]},{id:"en.a2.read-main",lang:"en",band:2,skill:"reading",title:"Find the main idea and specific details in short everyday texts",languageFocus:"Strategies for main idea (titles, first sentences, repeated key words) and specific detail (scanning for names, numbers, dates) in short emails, adverts, posters, blog posts and simple articles.",activities:{child:"Title match: children read three very short animal stories, match each one to the best title and picture, then find one detail in each (What colour? How many?).",teen:"Scanning race: teams race to find specific details in an event poster or short blog post, then choose the best headline for it from three options.",adult:"Inbox triage: learners skim five short emails, decide the main purpose of each (complaint, invitation, request, reminder), then scan for the key details needed to reply."},reinforcement:"Revise question words and recent travel and shopping vocabulary.",successCriterion:"Identifies the main idea of 2 short texts and answers at least 5 of 6 detail questions correctly.",followUpCheck:"In week 4, a new text type (a short review or a school newsletter) with mixed main-idea and detail questions.",prerequisites:["en.a1.read-short"],milestone:"Can understand the main point and key details of short everyday texts"},{id:"en.a2.listen-detail",lang:"en",band:2,skill:"listening",title:"Listen for detail in short everyday conversations",languageFocus:"Short everyday dialogues: ordering food, asking for directions, making and changing arrangements; listening for numbers, times, places, decisions and the words that signal a change (actually, instead, what about…?).",activities:{child:"Listen and colour: children hear a short dialogue between two characters and colour or add details to a picture (the red bike, the dog under the tree).",teen:"Fix the summary: students read a summary of a conversation that contains five wrong details and correct them while listening.",adult:"Changed plans: learners listen to two colleagues rearranging a meeting and complete a calendar with the final day, time and place."},reinforcement:"Revise numbers, clock times and directions vocabulary.",successCriterion:"Completes a detail task with at least 5 of 6 correct answers from a dialogue heard twice at natural but clear speed.",followUpCheck:"In week 4, a new dialogue in a different setting (a shop or a clinic) with a different voice.",prerequisites:["en.a1.listen-info"]},{id:"en.a2.narrate-past",lang:"en",band:2,skill:"speaking",title:"Narrate a simple sequence of past events",languageFocus:"Past Simple narrative with sequencers (first, then, after that, later, finally), time expressions and simple connectors (and, but, so, because); reacting as a listener (Really? What happened next?).",activities:{child:"Comic-strip story: children draw a four-panel comic of 'My best day' and tell it to a partner using first, then, after that and finally, while the listener points to each panel.",teen:"Worst day ever: students build a funny story about a disastrous day from three random picture cards and tell it to a small group, who vote for the most creative.",adult:"Anecdote circle: learners tell a short true anecdote (a travel problem, a memorable meal) and listeners must ask two follow-up questions before the next turn."},reinforcement:"Recycle irregular past verbs and past time expressions.",successCriterion:"Tells a story of at least 5 connected events using at least 3 sequencers, with past forms correct in most clauses.",followUpCheck:"In week 5, retell a different picture story or anecdote to a new listener.",prerequisites:["en.a1.present-simple","en.a1.questions-basic"],milestone:"Can narrate a simple sequence of past events"},{id:"en.a2.write-message",lang:"en",band:2,skill:"writing",title:"Write a short message or email with connected sentences",languageFocus:"Short informal messages and emails: openings and closings (Hi…, Thanks for…, See you soon, Love / Best wishes), connectors (and, but, because, so), inviting, thanking, apologising and arranging.",activities:{child:"Postcard from a magic island: children write a 4–5 sentence postcard to a classmate about an imaginary holiday, then 'post' it and write a short reply to the one they receive.",teen:"Reply chain: students answer a friend's message that contains three questions, making sure each question is answered and adding one question of their own.",adult:"Workplace email: learners write a short email rescheduling a meeting or inviting colleagues to an event, then peer-check it against a three-point checklist."},reinforcement:"Revise going to for plans and the Past Simple for 'news' sentences.",successCriterion:"Writes a 40–60 word message that covers all 3 required points, uses at least 2 connectors and has an appropriate opening and closing.",followUpCheck:"In week 5, a new message prompt (thanking a host family or cancelling an appointment).",prerequisites:["en.a1.write-sentences"],milestone:"Can write a short connected message about everyday matters"},{id:"en.b1.past-continuous",lang:"en",band:3,skill:"grammar",title:"Contrast the Past Simple and the Past Continuous in stories",languageFocus:"Past Continuous (was / were + -ing) for background scenes and interrupted actions; Past Simple for the main events; when / while / as; typical story frames ('I was walking home when…', 'While we were waiting, …').",activities:{teen:"Crime-scene alibi: a 'robbery' happened at 8 pm; each student says what they were doing, and the class tries to break the alibis with interrupted-action questions ('What were you doing when the lights went out?').",adult:"Freeze-frame: learners study a busy street photo, describe what everyone was doing at the moment something unexpected happened, then write the opening lines of a short news story."},reinforcement:"Recycle irregular past forms and the sequencers from A2 narration.",successCriterion:"Tells or writes a short story with at least 3 correct background clauses (Past Continuous) and 3 correct main-event clauses (Past Simple).",followUpCheck:"In week 4, a new story prompt (a power cut or a surprise visitor) told without notes.",prerequisites:["en.a2.past-simple","en.a2.narrate-past"]},{id:"en.b1.present-perfect",lang:"en",band:3,skill:"grammar",title:"Use the Present Perfect for experiences and recent events",languageFocus:"Present Perfect for life experience (Have you ever…? I've never…) and recent events with just, already, yet; for / since; switching to the Past Simple for finished-time details. Portuguese covers both meanings with one past tense, so the contrast needs explicit practice.",activities:{teen:"Ever-tower: students build a tower of 'Have you ever…?' question cards; each 'yes' must be followed by two Past Simple questions (When? Who with?) before the next card goes on.",adult:"Experience interview: learners hold a mock job interview about professional experience ('I've managed a team of five… In 2021 I led…'), alternating Present Perfect overviews with Past Simple details."},reinforcement:"Past participle revision with a quick card game, contrasting finished-time markers (yesterday, in 2020) with unfinished ones (ever, this year).",successCriterion:"In a conversation, uses the Present Perfect for 4 experiences and switches correctly to the Past Simple for details in at least 3 of 4 follow-ups.",followUpCheck:"In week 5, an unprepared interview with new prompts (travel experiences or personal achievements).",prerequisites:["en.a2.past-simple","en.a2.past-questions"]},{id:"en.b1.first-conditional",lang:"en",band:3,skill:"grammar",title:"Talk about real possibilities with the first conditional",languageFocus:"If + present, will / won't + base verb; unless, as soon as, when; may / might for less certain results; no 'will' in the if-clause.",activities:{teen:"Consequence chain: starting from 'If I skip school tomorrow…', each student turns the previous result into the next condition, and the group sees how far the story goes.",adult:"Decision tree: learners map the possible outcomes of a real decision (changing jobs, moving city, buying a car) with if-sentences, then discuss which outcome is most likely."},reinforcement:"Recycle future forms (going to, will) and time expressions.",successCriterion:"Produces 5 accurate first conditional sentences in a discussion task, with no 'will' in the if-clause.",followUpCheck:"In week 4, a new problem-solving scenario (planning an outdoor event when rain is forecast).",prerequisites:["en.a2.future-plans"]},{id:"en.b1.modals-obligation",lang:"en",band:3,skill:"grammar",title:"Give advice and express obligation: should, must, have to",languageFocus:"should / shouldn't for advice; must / mustn't for strong obligation and prohibition; have to / don't have to for external rules and lack of necessity; the key meaning contrast between mustn't and don't have to.",activities:{teen:"Rule makers: groups write a new set of rules for their school or an online gaming community with must / mustn't / don't have to, then debate which rules are fair.",adult:"Advice column: learners read short problems from an advice page (work–life balance, noisy neighbours, health habits), write advice, then compare solutions in groups."},reinforcement:"Recycle can / can't for permission and ability.",successCriterion:"Gives advice and states rules with the correct meaning in at least 5 of 6 cases, including the difference between mustn't and don't have to.",followUpCheck:"In week 5, a new situation (advice for a tourist visiting Brazil or rules for a shared flat).",prerequisites:["en.a1.can-ability"]},{id:"en.b1.collocations",lang:"en",band:3,skill:"vocabulary",title:"Use common collocations (make/do, take/have, adjective + noun)",languageFocus:"make vs do (make a decision / a mistake, do homework / the shopping), take / have (take a photo, have a shower, take a break), strong adjective + noun pairs (heavy rain, strong coffee, high price); many errors come from Portuguese 'fazer' and 'tomar'.",activities:{teen:"Collocation dominoes: groups build a domino chain matching verbs and nouns, then use five of the collocations in a short story about a crazy weekend.",adult:"Collocation notebook: learners highlight collocations in a short article from their own field, record them in a personal notebook and use them in a 1-minute talk."},reinforcement:"Review A2 topic vocabulary (travel, free time) as nouns to combine with new verbs.",successCriterion:"Uses at least 8 target collocations accurately in speaking or writing, with no more than one make / do confusion.",followUpCheck:"In week 5, a short gap-fill plus a free task on a new topic, scored for collocation accuracy.",prerequisites:["en.a2.vocab-travel"]},{id:"en.b1.read-inference",lang:"en",band:3,skill:"reading",title:"Infer meaning and the writer's opinion in texts on familiar topics",languageFocus:"Inference strategies: reading between the lines, attitude markers (unfortunately, surprisingly, of course), evaluative adjectives, and the reasons and examples that support an opinion; guessing unknown words from context.",activities:{teen:"Review detectives: students read film or game reviews with the star ratings removed, predict each rating and underline the words that gave them the clue.",adult:"Opinion line: learners read short opinion pieces on remote work or city life, place each writer on a for / against line and justify the position with evidence from the text."},reinforcement:"Revise main-idea and scanning strategies before moving on to inference.",successCriterion:"Identifies the writer's opinion in 2 texts, supports each with at least one piece of evidence from the text, and answers 4 of 5 inference questions correctly.",followUpCheck:"In week 5, a new text type (a blog post or a letter to the editor) with inference questions.",prerequisites:["en.a2.read-main"]},{id:"en.b1.listen-gist",lang:"en",band:3,skill:"listening",title:"Understand the gist and speakers' attitudes in longer talk",languageFocus:"Gist and attitude in longer talk (2–4 minutes): podcasts, interviews, informal discussions; tone of voice, sentence stress and discourse markers (actually, to be honest, I mean, anyway).",activities:{teen:"Podcast picker: students hear the first minute of three podcast episodes, decide the topic and the presenter's mood, and vote on which one to hear in full.",adult:"Meeting debrief: learners listen to a recorded discussion between colleagues, summarise the decision in one sentence and say how each person feels about it."},reinforcement:"Revise detail-listening strategies and attitude adjectives (annoyed, enthusiastic, unsure).",successCriterion:"Summarises the gist of a 3-minute recording in 1–2 sentences and correctly identifies the attitude of both speakers.",followUpCheck:"In week 5, a different genre (a radio phone-in or a vlog) with new questions.",prerequisites:["en.a2.listen-detail"],milestone:"Can follow the main points and speakers' attitudes in longer everyday talk"},{id:"en.b1.opinions",lang:"en",band:3,skill:"speaking",title:"Give and justify opinions on familiar topics",languageFocus:"Opinion phrases (In my opinion…, I think / I don't think…, I'm not sure that…), reasons and examples (because, for example, that's why), agreeing and disagreeing politely (I see your point, but…).",activities:{teen:"Opinion continuum: students stand on a line from 'totally agree' to 'totally disagree' for statements (homework, phones at school), then justify their place to someone standing at the other end.",adult:"Point–reason–example talk: learners prepare a 2-minute talk on a work or city issue using a point–reason–example frame, then answer two challenging questions from the group."},reinforcement:"Revise comparatives and should / shouldn't to support opinions.",successCriterion:"In a 2-minute exchange, gives an opinion with at least 2 reasons and 1 example and responds to a challenge without breaking down.",followUpCheck:"In week 5, a new unprepared topic (tourism or social media) with a new partner.",prerequisites:["en.a2.comparatives","en.a2.narrate-past"],milestone:"Can give and briefly justify opinions on familiar topics"},{id:"en.b1.spontaneous",lang:"en",band:3,skill:"functional",title:"Interact spontaneously in unprepared everyday conversations",languageFocus:"Conversation strategies: starting and keeping a conversation going, asking for clarification (Sorry, what do you mean by…?), paraphrasing a missing word (It's a kind of…), showing interest (Really? Did you?), taking and handing over turns.",activities:{teen:"Conversation roulette: pairs pick a random topic card and must keep talking for 2 minutes; an observer ticks the strategies used on a checklist and shares one highlight.",adult:"Surprise situations: learners handle role-play cards revealed on the spot (a wrong hotel booking, a delayed flight, small talk at a conference) with no preparation time."},reinforcement:"Recycle question forms and follow-up questions from A1–A2.",successCriterion:"Sustains an unprepared 3-minute conversation, using at least 2 clarification or repair strategies and asking at least 3 follow-up questions.",followUpCheck:"In week 6, an unannounced conversation with a different speaker on a new topic.",prerequisites:["en.a1.questions-basic","en.a2.narrate-past"],milestone:"Can handle most everyday conversations without preparation"},{id:"en.b1.write-paragraph",lang:"en",band:3,skill:"writing",title:"Write a connected paragraph using linking words",languageFocus:"Paragraph structure (topic sentence, supporting sentences, concluding sentence); linking words: however, although, also, in addition, for example, because of, as a result.",activities:{teen:"Paragraph puzzle: groups reorder a cut-up paragraph, identify the topic sentence and linking words, then write their own paragraph on a similar topic.",adult:"Draft–feedback–redraft: learners plan, draft and revise a paragraph about a work or travel experience, with peer feedback focused only on linking words and the topic sentence."},reinforcement:"Review and, but, so and because from A2 messages before adding new linkers.",successCriterion:"Writes a 100–120 word paragraph with a clear topic sentence and at least 4 accurately used linking words.",followUpCheck:"In week 5, a new paragraph on a different topic (the advantages of public transport), written in class.",prerequisites:["en.a2.write-message"],milestone:"Can write a connected paragraph on a familiar topic"},{id:"en.b2.passive",lang:"en",band:4,skill:"grammar",title:"Use passive forms to focus on actions and results",languageFocus:"Passive forms across tenses (is made, was built, has been changed, is being repaired, will be delivered, can be done); by + agent only when it matters; have / get something done.",activities:{teen:"How it's made: students research how a favourite product is made (sneakers, chocolate, a video game) and present the process with a diagram and passive captions.",adult:"Project update: learners describe recent changes in their workplace or city ('The road has been closed', 'A new system is being installed') and write a short status update."},reinforcement:"Review past participles and the Present Perfect.",successCriterion:"Uses passive forms accurately in at least 5 of 6 contexts and can explain why the passive was chosen (focus on the action or result).",followUpCheck:"In week 5, a new process description or a short news report about a local event.",prerequisites:["en.b1.present-perfect"]},{id:"en.b2.conditionals",lang:"en",band:4,skill:"grammar",title:"Use second and third conditionals for hypothetical situations",languageFocus:"Second conditional (If I had…, I would…) for unreal present and future; third conditional (If I had known…, I would have…) for unreal past; wish / if only; contracted forms in speech (I'd have).",activities:{teen:"Dilemma cards: groups discuss 'What would you do if…?' dilemmas and agree on an answer, then rewrite the ending of a well-known film using third conditionals.",adult:"Sliding doors: learners describe a past decision and how life would have been different, then discuss hypothetical work scenarios ('If we had a bigger budget, we would…')."},reinforcement:"Revise the first conditional and past participles.",successCriterion:"Produces 4 second and 3 third conditional sentences with correct form and meaning in an open discussion.",followUpCheck:"In week 5, a new dilemma or 'what if' story with different prompts.",prerequisites:["en.b1.first-conditional"]},{id:"en.b2.reported-speech",lang:"en",band:4,skill:"grammar",title:"Report what other people said, asked and suggested",languageFocus:"Reported statements and questions with tense backshift and statement word order (She asked where I lived); reporting verbs with their patterns: say, tell someone, ask, suggest + -ing, advise / warn someone to, promise / refuse to.",activities:{teen:"Gossip relay: students pass a statement or question along a line, each reporting it to the next person; the class compares the final version with the original.",adult:"Meeting minutes: learners read or listen to a short meeting dialogue and write minutes reporting who said, asked and suggested what."},reinforcement:"Revise tense forms and indirect question word order.",successCriterion:"Reports 6 statements and questions with correct backshift and word order, using at least 3 different reporting verbs.",followUpCheck:"In week 5, report a new interview or a conversation from a short video clip.",prerequisites:["en.b1.past-continuous","en.b1.present-perfect"]},{id:"en.b2.vocab-precision",lang:"en",band:4,skill:"vocabulary",title:"Choose precise vocabulary and common phrasal verbs",languageFocus:"Precise word choice (shades of meaning: big / huge / vast), word families (decide / decision / decisive), common phrasal verbs (come up with, put off, figure out, run out of, turn down) and false friends for Portuguese speakers (actually, pretend, push, eventually).",activities:{teen:"Phrasal-verb comic: students create a six-panel comic using six phrasal verbs; classmates then replace each one with a single-word synonym and discuss which sounds more natural.",adult:"Upgrade the email: learners improve a bland, repetitive email by replacing general words with more precise ones and suitable phrasal verbs, then compare versions."},reinforcement:"Review B1 collocations and word formation with prefixes and suffixes.",successCriterion:"Uses at least 8 target items (phrasal verbs or precise words) accurately in a task and corrects 4 of 5 false-friend errors.",followUpCheck:"In week 6, a new writing or speaking task where the target items can occur naturally; check use without prompting.",prerequisites:["en.b1.collocations"]},{id:"en.b2.read-organisation",lang:"en",band:4,skill:"reading",title:"Follow text organisation, cohesion and implied meaning",languageFocus:"Cohesive devices (this, such, the former / the latter, whereas, however), reference chains, the function of each paragraph, and implied meaning in articles and essays.",activities:{teen:"Gapped-text puzzle: students reinsert removed paragraphs into an article, highlighting the reference words and linkers that helped them decide.",adult:"Argument map: learners map the structure of an opinion article (claim, evidence, concession, conclusion) and identify any criticism the writer implies but never states."},reinforcement:"Revise inference strategies from B1.",successCriterion:"Correctly replaces at least 4 of 5 removed sentences or paragraphs and explains the cohesive link for each.",followUpCheck:"In week 5, a new gapped text on a different topic.",prerequisites:["en.b1.read-inference"]},{id:"en.b2.listen-implied",lang:"en",band:4,skill:"listening",title:"Understand implied meaning and detail in extended speech",languageFocus:"Implied meaning in extended speech: hedging (I suppose, sort of), understatement, irony and intonation that signals doubt or sarcasm; detail in talks, interviews and lectures.",activities:{teen:"What did they really mean?: students watch short clips from series or interviews and decide what each speaker implies, using tone and word choice as evidence.",adult:"Between the lines: learners listen to a recorded negotiation and identify what each side really wants, beyond what they actually say."},reinforcement:"Revise gist and attitude listening strategies from B1.",successCriterion:"Correctly interprets the implied meaning in at least 4 of 5 extracts and supports each answer with words or intonation heard.",followUpCheck:"In week 6, a new extended recording (a panel discussion) with implied-meaning questions.",prerequisites:["en.b1.listen-gist"]},{id:"en.b2.discuss",lang:"en",band:4,skill:"speaking",title:"Sustain a discussion, negotiate and respond to others",languageFocus:"Discussion and negotiation language: building on others' points (That's a fair point, but…), conceding (I take your point), proposing compromises (What if we…?), summarising, and inviting others in (What's your view?).",activities:{teen:"Balloon debate: each student represents a famous person and argues why they should stay in a sinking hot-air balloon, responding directly to the others' arguments.",adult:"Negotiation simulation: learners negotiate a budget, contract or group holiday using role cards with conflicting priorities, and must reach a written agreement."},reinforcement:"Recycle opinion language and conditionals.",successCriterion:"In a 6-minute group discussion, responds directly to others at least 3 times, proposes a compromise and summarises the outcome.",followUpCheck:"In week 6, a new discussion or negotiation with different roles.",prerequisites:["en.b1.opinions","en.b1.spontaneous"],milestone:"Can sustain a discussion, negotiate and respond to other people's views"},{id:"en.b2.argue",lang:"en",band:4,skill:"writing",title:"Develop a clear written argument with supporting points",languageFocus:"Argumentative structure (introduction with a thesis, body paragraphs with support, counter-argument and rebuttal, conclusion); hedging and emphasis; formal linkers (furthermore, nevertheless, on the other hand, consequently).",activities:{teen:"Debate to essay: after a class debate, students turn their side's strongest arguments into a structured essay using a planning template.",adult:"Proposal: learners write a short proposal or opinion essay on a real issue (a new company policy, changes to public transport), then peer-review the strength of each supporting point."},reinforcement:"Review paragraph structure and linking words from B1.",successCriterion:"Writes a 200–250 word argument with a clear thesis, 2 supported points, a counter-argument and a conclusion.",followUpCheck:"In week 6, a timed essay on a new topic requiring a different point of view.",prerequisites:["en.b1.write-paragraph","en.b1.opinions"],milestone:"Can write a clear argument that supports a point of view"},{id:"en.c1.advanced-structures",lang:"en",band:5,skill:"grammar",title:"Use advanced structures: inversion, cleft sentences, mixed conditionals",languageFocus:"Negative inversion (Never have I…, Not only… but also…, Rarely do we…), cleft sentences (What I need is…, It was… that…), mixed conditionals (If I had studied medicine, I would be a doctor now), emphatic do.",activities:{teen:"Speech makeover: students rewrite a plain student-council or graduation speech using inversion and cleft sentences for emphasis, then deliver it to the class.",adult:"Pitch rework: learners rework a real presentation or sales pitch with emphatic structures and mixed conditionals, deliver it and get feedback on its impact."},reinforcement:"Review third conditionals and passive forms.",successCriterion:"Uses at least 3 types of advanced structure accurately and appropriately in an extended spoken or written text.",followUpCheck:"In week 6, a new persuasive task in which the structures must appear without prompting.",prerequisites:["en.b2.conditionals","en.b2.passive"]},{id:"en.c1.vocab-nuance",lang:"en",band:5,skill:"vocabulary",title:"Use nuance, idiom and appropriate register",languageFocus:"Connotation (slim / skinny, determined / stubborn), idioms and fixed expressions, register shifts (informal ↔ formal), and hedging or softening language (somewhat, it could be argued).",activities:{teen:"Register remix: students rewrite a text-message conversation as a formal letter (and a formal notice as a chat) and compare word choices.",adult:"Tone audit: learners analyse a set of real-style emails for tone and rewrite them to sound more diplomatic or more direct, depending on the recipient."},reinforcement:"Review phrasal verbs and precise vocabulary from B2.",successCriterion:"Adjusts register appropriately across two versions of a text and uses at least 4 idiomatic expressions naturally.",followUpCheck:"In week 6, a new task requiring a register shift (a complaint followed by a friendly follow-up).",prerequisites:["en.b2.vocab-precision"]},{id:"en.c1.read-complex",lang:"en",band:5,skill:"reading",title:"Understand complex texts and the writer's stance",languageFocus:"Complex texts (long-form journalism, academic articles, literary extracts): stance markers, evaluative language, irony and implicit argument.",activities:{teen:"Literature circle: students read a novel extract or long-form article and take roles (summariser, stance detective, language spotter), then share their findings.",adult:"Two-article comparison: learners compare two articles on the same issue, map each writer's stance and identify the persuasive techniques used."},reinforcement:"Review text organisation and cohesion analysis from B2.",successCriterion:"Accurately describes the writer's stance and 2 techniques used to convey it, supported by evidence from the text.",followUpCheck:"In week 6, a new complex text with open questions on stance.",prerequisites:["en.b2.read-organisation"],milestone:"Can understand complex texts and identify the writer's stance"},{id:"en.c1.listen-complex",lang:"en",band:5,skill:"listening",title:"Follow complex speech, including implicit attitudes",languageFocus:"Complex, fast or loosely structured speech: lectures, debates, films and podcasts with overlapping speakers; implicit attitude, humour and cultural references.",activities:{teen:"Scene analysis: students watch a scene from a series without subtitles and analyse the characters' implicit attitudes and the humour, then compare interpretations.",adult:"Critical summary: learners take notes on a conference talk or panel debate and write a critical summary that includes each speaker's stance."},reinforcement:"Revise implied-meaning strategies from B2.",successCriterion:"Produces a summary that captures the main argument and at least 2 implicit attitudes from an authentic recording.",followUpCheck:"In week 6, a new authentic recording from a different genre.",prerequisites:["en.b2.listen-implied"]},{id:"pt.pa1.greetings",lang:"pt",band:0,skill:"functional",title:"Cumprimentar e se apresentar (greet people and introduce yourself)",languageFocus:"Oi / Olá; Bom dia / Boa tarde / Boa noite; Tchau, Até logo, Até amanhã; Como você se chama? Meu nome é… / Eu sou…; Tudo bem? Tudo bom! E você?; Prazer! / Muito prazer; De onde você é? Sou dos Estados Unidos / da Alemanha.",activities:{teen:"Video-call intro: students act out (or record) a short video call introducing themselves to an exchange partner at a Brazilian school — greeting, name, age and where they are from — and answer one question.",adult:"Building lobby: learners role-play meeting the porteiro and a new neighbour at different times of day, choosing between a more formal and a more relaxed greeting for each person."},reinforcement:"Open every class with 'Tudo bem?' and the greeting that fits the time of day.",successCriterion:"Greets, introduces themselves and responds to 'Tudo bem?' appropriately in a 30-second exchange with a new person.",followUpCheck:"In week 3, a greeting exchange with an unfamiliar speaker (or a reply to a recorded voice message) with no preparation.",milestone:"Can greet people and introduce themselves in Portuguese"},{id:"pt.pa1.vocab-basic",lang:"pt",band:0,skill:"vocabulary",title:"Reconhecer palavras do dia a dia: números, cores, objetos (recognise everyday words: numbers, colours, objects)",languageFocus:"Números 0–20, cores (vermelho, azul, verde, amarelo, branco, preto), objetos do dia a dia (mesa, cadeira, celular, chave, garrafa, caneta), with gender and articles: o / a, um / uma.",activities:{teen:"Kim's game: students study a tray of objects for 30 seconds, then name what has disappeared, with the right article ('Sumiu a chave!').",adult:"Colour and number I-spy: learners take turns with 'Eu vejo uma coisa azul…' around the room, then count and name objects in a photo of their own home or office."},reinforcement:"Quick number ping-pong warm-up (count up and down in turns, skipping multiples of three).",successCriterion:"Names at least 16 of 20 taught items from pictures or objects, with the correct article in most cases.",followUpCheck:"In week 3, a new picture scene (a kitchen or a street) asking for 10 taught items."},{id:"pt.pa1.listen-words",lang:"pt",band:0,skill:"listening",title:"Understand familiar words and very short phrases spoken slowly",languageFocus:"Familiar words and short phrases spoken slowly: numbers, colours, objects, classroom instructions (abra o livro, escute, repita, olhe); hearing nasal vowels and open / closed vowels (pão / pau, avó / avô).",activities:{teen:"Slap the picture: pictures are spread on the table; students hear a word and race to slap the right one, including minimal pairs such as pão / pau and avó / avô.",adult:"Café order listening: learners hear very short café orders spoken slowly ('um café e um pão de queijo') and tick the matching items on a picture menu."},reinforcement:"A short daily dictation of five known words.",successCriterion:"Identifies the correct picture for at least 8 of 10 short phrases heard twice at slow speed.",followUpCheck:"In week 3, a new listening sheet recorded by a different speaker.",milestone:"Can understand familiar words and very short phrases spoken slowly"},{id:"pt.pa1.read-words",lang:"pt",band:0,skill:"reading",title:"Read and match single words, signs and labels",languageFocus:"Single words, labels and signs: ENTRADA, SAÍDA, ABERTO, FECHADO, PUXE, EMPURRE, BANHEIRO, PROIBIDO FUMAR; product labels; reading accented letters and ç (ã, é, ô, ç).",activities:{teen:"Pairs memory: students play a memory game matching word cards to picture cards, reading each word aloud whenever they turn it over.",adult:"City sign match: learners match photos of real Brazilian signs (metrô, shops, building entrances) to their meaning, then read them aloud with the right stress."},reinforcement:"Word wall: read five labelled items aloud each lesson.",successCriterion:"Matches at least 8 of 10 written words or signs to the correct picture or meaning.",followUpCheck:"In week 3, a new set of signs from a different place (a hospital or a shopping centre)."},{id:"pt.a1.ser-estar",lang:"pt",band:1,skill:"grammar",title:"Use ser and estar for identity, origin, states and location",languageFocus:"ser for identity, nationality, origin, profession and characteristics (Sou canadense, Ela é médica, Ele é alto); estar for temporary states and the location of people and things (Estou cansado, O livro está na mesa); ficar for fixed locations (Onde fica o banco?).",activities:{teen:"Emoji status board: students pick emojis to show how they and some characters are today ('Ele está nervoso') and contrast it with what they are like ('Ele é tímido').",adult:"Who's who at the party: learners describe guests in a party picture — profession and personality with ser, mood and position with estar — for a partner to identify."},reinforcement:"Recycle greetings: 'Tudo bem?' — 'Estou bem / Estou cansado'.",successCriterion:"Chooses ser or estar correctly in at least 8 of 10 contexts in a description task.",followUpCheck:"In week 4, a new picture description (a family photo or an office scene) checked for ser / estar choices.",prerequisites:["pt.pa1.greetings"]},{id:"pt.a1.presente",lang:"pt",band:1,skill:"grammar",title:"Use the presente do indicativo (regular -ar/-er/-ir and common irregulars)",languageFocus:"Presente do indicativo: regular -ar / -er / -ir verbs (falo, como, abro) and common irregulars (ter, ir, fazer, querer, poder, ver); eu / você / ele / ela / nós / vocês / eles; a gente + third-person singular (a gente mora).",activities:{teen:"Verb roulette: students spin a wheel with a verb and a pronoun and make a true sentence about their routine or a classmate's, earning points for correct endings.",adult:"Here vs back home: learners compare their routine in Brazil with their routine in their home country, then interview a partner and report back ('Ela acorda às seis aqui…')."},reinforcement:"Revise ser / estar forms alongside regular verb endings.",successCriterion:"Uses correct present-tense endings for at least 8 of 10 verbs across 3 persons in a short spoken or written description.",followUpCheck:"In week 4, describe the routine of a different person (a colleague or a well-known Brazilian).",prerequisites:["pt.pa1.vocab-basic"]},{id:"pt.a1.vocab-daily",lang:"pt",band:1,skill:"vocabulary",title:"Use words for routine, food, family and work",languageFocus:"Routine (acordar, tomar banho, tomar café, trabalhar, almoçar, dormir), food (arroz, feijão, pão de queijo, frutas, suco), family (pai, mãe, irmão, filha, avós) and work and professions.",activities:{teen:"Build a prato feito: students assemble a typical Brazilian l
